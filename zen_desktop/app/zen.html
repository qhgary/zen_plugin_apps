<script>
        (function () {
            if (typeof StockData !== 'function') return;

            StockData.Explain = "HQChartData真实数据";

            // 请求队列
            var pendingRequests = [];

            // 处理挂起的请求
            var processPendingRequests = function () {
                console.log('[StockData] processPendingRequests: pendingRequests.length=' + pendingRequests.length + ', StockDataInstance=' + !!window.StockDataInstance);
                if (!window.StockDataInstance) {
                    console.log('[StockData] StockDataInstance 不存在，延迟处理');
                    return;
                }
                var requests = pendingRequests.splice(0, pendingRequests.length);
                console.log('[StockData] 处理 ' + requests.length + ' 个挂起的请求');
                for (var i = 0; i < requests.length; ++i) {
                    var item = requests[i];
                    try {
                        console.log('[StockData] 处理请求: ' + (item.data ? item.data.Name : 'unknown'));
                        window.StockDataInstance.NetworkFilter(item.data, item.callback, item.option);
                    } catch (e) {
                        console.error('[StockData.NetworkFilter] 处理请求失败:', e);
                        if (typeof item.callback === 'function') {
                            item.callback({ Error: String(e) });
                        }
                    }
                }
            };

            StockData.NetworkFilter = function (data, callback, option) {
                if (data) data.PreventDefault = true;

                if (window.StockDataInstance && typeof window.StockDataInstance.NetworkFilter === 'function') {
                    // 连接已建立，直接处理请求
                    console.log('[StockData.NetworkFilter] 直接处理: ' + (data ? data.Name : 'unknown') + ', StockDataInstance=' + !!window.StockDataInstance);
                    window.StockDataInstance.NetworkFilter(data, callback, option);
                } else {
                    // 连接尚未建立，加入队列等待
                    console.log('[StockData.NetworkFilter] 加入队列: ' + (data ? data.Name : 'unknown') + ', StockDataInstance=' + !!window.StockDataInstance);
                    pendingRequests.push({ data: data, callback: callback, option: option });
                }
            };

            var tryCount = 0;
            var tryInit = function () {
                if (window.StockDataInstance) return;

                if (typeof window.ZenWSClient === 'undefined' || !window.ZenWSClient) {
                    console.log('[StockData] tryInit: 等待 ZenWSClient 就绪, tryCount=' + tryCount);
                    tryCount++;
                    setTimeout(tryInit, 200);
                    return;
                }

                console.log('[StockData] tryInit: ZenWSClient 已就绪');
                window.StockDataInstance = new StockData();
                window.StockDataInstance.WSClient = window.ZenWSClient;
                // 处理队列中的请求
                processPendingRequests();
            };
            tryInit();

            StockData.FUNC_ALPHA = function (obj) {
                var aryValue = obj.Args[0];
                var aryAlpha = obj.DownloadData;
                var aryData = [];
                for (var i = 0; i < aryValue.length; ++i) aryData.push(aryValue[i] * aryAlpha[i]);
                return { Out: aryData };
            };
        })();
    </script>

    <script>
// 从可能包含格式化边框/标题的文本中提取纯授权码（与 Rust smart_extract_key 逻辑一致）
// 授权文件中可能存储的是带 === 边框的完整文本，这里只提取 Base64 那一行
window._smartExtractKey = function(input) {
    if (!input) return '';
    var lines = input.split(/\r?\n/).map(function(l) { return l.trim(); }).filter(function(l) { return l.length > 0; });
    if (lines.length === 0) return '';
    var bestLine = '';
    var maxLen = 0;
    for (var i = 0; i < lines.length; i++) {
        var line = lines[i];
        var decorCount = (line.match(/[=\-*#]/g) || []).length;
        if (decorCount > line.length / 2) continue;
        var lower = line.toLowerCase();
        if (lower.indexOf('key for') >= 0 || lower.indexOf('device:') >= 0 ||
            lower.indexOf('features:') >= 0 || lower.indexOf('valid:') >= 0 ||
            lower.indexOf('expires:') >= 0 || lower.indexOf('type:') >= 0 ||
            lower.indexOf('user:') >= 0) continue;
        if (line.length > maxLen) { maxLen = line.length; bestLine = line; }
    }
    return bestLine.replace(/\s/g, '');
};

window.ZenAuthClient = {
generateNonce: function () {
                var bytes = new Uint8Array(16);
                if (window.crypto && window.crypto.getRandomValues) {
                    window.crypto.getRandomValues(bytes);
                    return Array.from(bytes).map(function (n) {
                        return n.toString(16).padStart(2, '0');
                    }).join('');
                }
                return 'nonce-' + Date.now() + '-' + Math.floor(Math.random() * 1000000);
            },

            getStatus: function () {
                console.log('[ZenAuthClient] getStatus fetching...');
                var token = new URLSearchParams(window.location.search).get('token') || '';
                var url = '/api/auth/status?t=' + Date.now();
                return fetch(url, {
                    method: 'GET',
                    cache: 'no-store',
                    headers: token ? {'X-Zen-Token': token} : {}
                })
                    .then(function (r) {
                        console.log('[ZenAuthClient] getStatus response status:', r.status);
                        return r.json().catch(function(e) { 
                            console.log('[ZenAuthClient] getStatus json parse error:', e);
                            return { machine_code: null }; 
                        });
                    })
                    .catch(function(e) {
                        console.log('[ZenAuthClient] getStatus fetch error:', e);
                        return { machine_code: null };
                    });
            },

            saveLicense: function (licenseKey) {
                var token = new URLSearchParams(window.location.search).get('token') || '';
                var url = '/api/auth/license';
                return fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Zen-Token': token
                    },
                    body: JSON.stringify({license_key: licenseKey})
                })
                .then(function (r) {
                    // 无论 HTTP 状态码如何，都尝试解析 JSON 响应体；
                    // 只有 fetch 本身失败（网络不可达/超时）才进入 catch。
                    return r.json().catch(function() { return null; }).then(function(data) {
                        if (!r.ok && !data) {
                            // HTTP 非 2xx 且无 JSON body（如 503 纯文本），才算认证模块不可用
                            throw new Error('认证模块不可用');
                        }
                        return data || {};
                    });
                });
            },

            createSession: function (appId, platform) {
                var token = new URLSearchParams(window.location.search).get('token') || '';
                var nonce = this.generateNonce();
                var url = '/api/auth/session';
                return fetch(url, {
                    method: 'POST',
                    cache: 'no-store',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Zen-Token': token
                    },
                    body: JSON.stringify({
                        nonce: nonce,
                        app_id: appId,
                        platform: platform
                    })
                })
                .then(function (r) {
                    if (!r.ok) throw new Error('auth session unavailable');
                    return r.json();
                })
                .then(function (data) {
                    data = data || {};
                    data.nonce = nonce;
                    data.app_id = appId;
                    data.platform = platform;
                    return data;
                });
            }
        };

        // ====== 复制到剪贴板辅助函数 ======
        window._copyToClipboard = function(text) {
            try {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(text);
                } else {
                    var tempInput = document.createElement('input');
                    tempInput.value = text;
                    document.body.appendChild(tempInput);
                    tempInput.select();
                    document.execCommand('copy');
                    document.body.removeChild(tempInput);
                }
            } catch(err) {}
        };

        // ====== 授权面板解码信息渲染 ======
        // 有 user 即说明已成功解码：有效正常显示，已过期时剩余天数位显示红色"授权已过期"；
        // 解析失败（无 user）则隐藏，不显示任何解码信息
        window._zenRenderAuthStatusInfo = function (ar, el) {
            if (!el) return;
            if (!ar || !ar.user) { el.textContent = ''; el.style.display = 'none'; return; }
            var expired = !ar.valid && Number(ar.error_code) === _EC.EXPIRED;
            var isPermanent = ar.expire_ts === 0;
            var isTrial = !!ar.is_trial;
            var parts = [];
            parts.push('授权类型：' + (isTrial ? '试用' : '正式'));
            parts.push('授权给：' + (isTrial ? '试用用户' : ar.user));
            if (expired) {
                parts.push('<span class="zen-expired">授权已过期</span>');
                el.style.color = '#e6e6e6';
            } else if (isTrial) {
                parts.push('剩余 ' + ar.days_left + ' 天');
                el.style.color = '#fa0';
            } else if (isPermanent) {
                parts.push('永久');
                el.style.color = '#64c864';
            } else {
                parts.push('剩余 ' + ar.days_left + ' 天');
                el.style.color = '#64c864';
            }
            el.innerHTML = parts.join('<span class="sep">|</span>');
            el.style.display = 'flex';
        };

        // ====== 授权码自动解码 ======
        var _lastDecodeResult = null;
        var _decodeTimer = null;

        window._decodeLicenseKey = function() {
            var authInput = document.getElementById('AuthInput');
            var statusInfo = document.getElementById('AuthStatusInfo');
            var authError = document.getElementById('AuthError');
            if (!authInput) return;
            var key = authInput.value.trim();

            if (!key) {
                _lastDecodeResult = null;
                if (authError) authError.textContent = '';
                if (statusInfo) { statusInfo.textContent = ''; statusInfo.style.display = 'none'; }
                return;
            }

            // 调用 license API 进行解码
            window.ZenAuthClient.saveLicense(key)
            .then(function(data) {
                var ar = data && data.auth_result;
                // 解码出 user 即说明授权已成功解析（无论是否过期）；解析失败则无 user
                if (ar && ar.user) {
                    if (ar.valid) {
                        _lastDecodeResult = data;
                        // 显示后端返回的提示（"授权已保存"或"授权码未变化"）
                        if (authError) {
                            authError.textContent = data.message || '';
                            authError.style.color = '#64c864';
                        }
                    } else {
                        // 已过期：不改用成功流程，底部不再重复提示"授权已过期"
                        _lastDecodeResult = null;
                        if (authError) authError.textContent = '';
                    }
                    window._zenRenderAuthStatusInfo(ar, statusInfo);
                } else {
                    _lastDecodeResult = null;
                    // 授权无效（解析失败等），显示错误信息
                    var errMsg;
                    if (ar && !ar.valid) {
                        var ec = Number(ar.error_code) || 0;
                        errMsg = _zenErrMsg(ec, ar.message);
                    } else {
                        errMsg = (data && data.message) || '解码失败';
                    }
                    if (authError) {
                        authError.textContent = errMsg;
                        authError.style.color = '#ef5350';
                    }
                    // 不在 AuthStatusInfo 重复显示错误，统一由 AuthError 显示
                    // 同步清空残留文本，避免后续路径再次显示时旧内容闪现
                    if (statusInfo) { statusInfo.textContent = ''; statusInfo.style.display = 'none'; }
                }
            })
            .catch(function(err) {
                _lastDecodeResult = null;
                // 只有 fetch 本身失败（网络不可达/超时/连接被拒）才算网络错误；
                // throw 的 Error 不算网络错误。
                var isNetworkError = err && (err.name === 'TypeError' || /fetch|network|timeout/i.test(err.message || ''));
                if (authError) authError.textContent = isNetworkError ? '网络错误' : (err.message || '请求失败');
                if (authError) authError.style.color = '#ef5350';
                if (statusInfo) { statusInfo.textContent = ''; statusInfo.style.display = 'none'; }
            });
        };

        // showZenAuthPanel: 显示/切换授权面板
        // 参数 e: 事件对象（来自按钮点击时传入）。无 e 时为程序化调用（授权失败自动弹出）。
        // 行为：有 e 时为 toggle（点击按钮切换显示/隐藏）；无 e 时强制显示（不 toggle，避免周期性检查把面板关掉）。
        // 如果用户已手动关闭面板（_zenAuthPanelDismissed=true），程序化调用不再自动弹出。
        window.showZenAuthPanel = function(e) {
            if (e) { e.preventDefault(); e.stopPropagation(); }
            var authPanel = document.getElementById('AuthPanel');
            var authOverlay = document.getElementById('AuthOverlay');
            var authMachineCode = document.getElementById('AuthMachineCode');
            var authInput = document.getElementById('AuthInput');
            if (!authPanel) { console.log('[ZenAuthClient] AuthPanel not found'); return; }
            // 程序化调用（无事件）且面板已显示时，不重复操作
            if (!e && authPanel.style.display === 'block') return;
            // 程序化调用（无事件）且用户已手动关闭面板时，不再自动弹出
            if (!e && _zenAuthPanelDismissed) return;
            // 有事件且面板已显示时，切换为隐藏（toggle 行为）
            if (e && authPanel.style.display === 'block') {
                authPanel.style.display = 'none';
                if (authOverlay) authOverlay.classList.remove('active');
                _zenAuthPanelDismissed = true; // 用户手动关闭，定时检查不再自动弹出
                return;
            }
            // 显示面板
            authPanel.style.display = 'block';
            if (authOverlay) authOverlay.classList.add('active');
            if (authMachineCode) { var mcInit = authMachineCode.querySelector('.mc-text'); if (mcInit) mcInit.textContent = '获取中...'; }
            _lastDecodeResult = null;
            var controller = new AbortController();
            var timeout = setTimeout(function() { controller.abort(); }, 5000);
            window.ZenAuthClient.getStatus()
                .then(function(data){
                    clearTimeout(timeout);
                    console.log('[ZenAuthClient] getStatus resolved, data=', data);
                    if (controller) controller.abort();
                    if (authMachineCode) { var mcText = authMachineCode.querySelector('.mc-text'); if (mcText) mcText.textContent = (data && data.machine_code || '未知'); }
                    var copyBtn = document.getElementById('BtnCopyMachineCode');
                    if (copyBtn && data && data.machine_code) { copyBtn.dataset.machineCode = data.machine_code; }
                    if (authInput) authInput.value = (data && data.license_key) ? window._smartExtractKey(data.license_key) : '';
                    // 显示当前授权状态信息（含过期解码信息，由共享函数渲染）
                    var statusInfo = document.getElementById('AuthStatusInfo');
                    var authError = document.getElementById('AuthError');
                    var ar = data && data.auth_result;
                    if (statusInfo) {
                        // 有 user 渲染解码信息（有效绿色 / 过期红色），无 user 隐藏
                        window._zenRenderAuthStatusInfo(ar, statusInfo);
                    }
                    // 未解码出任何授权信息时，错误统一显示在 AuthError（存储类错误除外）
                    if (ar && !ar.valid && !ar.user && ar.error_code !== _EC.STORAGE_UNAVAILABLE) {
                        var ec1 = Number(ar.error_code) || 0;
                        if (authError) { authError.textContent = _zenErrMsg(ec1, ar.message); authError.style.color = '#ef5350'; }
                    }
                    // 已有授权码时触发自动解码
                    if (data && data.license_key) {
                        window._decodeLicenseKey();
                    }
                })
                .catch(function(e){
                    clearTimeout(timeout);
                    console.log('[ZenAuthClient] getStatus rejected:', e);
                    if (authMachineCode) { var mcFail = authMachineCode.querySelector('.mc-text'); if (mcFail) mcFail.textContent = '机器码: 获取失败'; }
                });
        };

        // 复制机器码按钮（在第559行的 addEventListener 中统一绑定，这里不再重复）

        window.submitZenAuthPanel = function(e) {
            if (e) { e.preventDefault(); e.stopPropagation(); }
            var authPanel = document.getElementById('AuthPanel');
            var authOverlay = document.getElementById('AuthOverlay');
            // 关闭按钮：解码已由输入框自动完成并保存，此处仅关闭面板
            // 若有解码成功的结果，触发授权成功流程
            if (_lastDecodeResult) {
                _zenAuthPanelDismissed = false; // 授权成功，重置 dismissed
                var ctrl = window.ChartContainer && window.ChartContainer.ZenChartCtrl;
                if (ctrl) {
                    if (typeof ctrl.CheckLicense === 'function') ctrl.CheckLicense();
                    // 授权从无效变有效：强制触发一次重新分析
                    if (typeof ctrl._triggerReanalysis === 'function' && ctrl.IsEnabled) {
                        ctrl._triggerReanalysis();
                    }
                }
            } else {

this.OnCreateHQChart = function (chart) {
    // 自定义缩放级别表：每级之间的 DataWidth 差值更小，缩放更平滑（幅度减半）
    JSChart.SetKLineZoom([
        [48,10],[46,10],[44,10],[42,10],
        [40,9],[38,9],[36,9],[34,9],
        [32,8],[30,8],[28,8],[26,8],
        [24,7],[22,7],[20,7],
        [18,6],[17,6],[16,6],
        [15,5],[14,5],[13,5],[12,4],
        [11,4],[10,4],[9,4],[8,4],[7,4],[6,4],[5,4],
        [4,3],[3,3],
        [3,1],[2,1],[1,1],[1,0]
    ]);
// chart 参数就是 JSChartContainer (KLineChartContainer) 本身
var hqchart = chart;
// 限制最小缩放级别：预检下一缩放级别的可见K线数，超过 MAX_VISIBLE_KLINE_COUNT 则禁止缩小
try {
if (hqchart && hqchart.Frame && hqchart.Frame.SubFrame && hqchart.Frame.SubFrame[0]) {
var frame = hqchart.Frame.SubFrame[0].Frame;
var self2 = this;
var origZoomDown = frame.ZoomDown;
var origZoomUp = frame.ZoomUp;

var isCrosshairActive = function (chartObj) {
    if (!chartObj) return false;
    if (chartObj.ChartCorssCursor && chartObj.ChartCorssCursor.IsShowCorss) return true;
    if (chartObj.ClickModel && chartObj.ClickModel.IsShowCorssCursor) return true;
    if (chartObj.TouchStatus && chartObj.TouchStatus.CorssCursorShow) return true;
    return false;
};

var adjustZoomToCenter = function (frameObj, chartObj, targetDataIndex, cursorIndex) {
    if (!frameObj || !frameObj.Data || targetDataIndex == null) return;
    var newXCount = frameObj.XPointCount;
    if (!newXCount || newXCount <= 0) return;

    var centerRelIndex = Math.floor(newXCount / 2);
    var desiredOffset = targetDataIndex - centerRelIndex;

    var dataCount = (frameObj.Data && frameObj.Data.Data) ? frameObj.Data.Data.length : 0;
    var rightSpace = frameObj.RightSpaceCount || 0;

    if (newXCount >= dataCount + rightSpace) {
        desiredOffset = 0;
    } else {
        var maxOffset = Math.max(0, dataCount - (newXCount - rightSpace));
        if (desiredOffset > maxOffset) desiredOffset = maxOffset;
        if (desiredOffset < 0) desiredOffset = 0;
    }

    frameObj.Data.DataOffset = desiredOffset;

    var newCursorRelIndex = targetDataIndex - desiredOffset;
    if (newCursorRelIndex < 0) newCursorRelIndex = 0;
    if (newCursorRelIndex >= newXCount) newCursorRelIndex = Math.max(0, newXCount - 1);

    if (cursorIndex) {
        cursorIndex.Index = newCursorRelIndex;
    }
    if (chartObj) {
        chartObj.CursorIndex = newCursorRelIndex;
        if (chartObj.ChartCorssCursor) {
            chartObj.ChartCorssCursor.CursorIndex = newCursorRelIndex;
        }
        if (chartObj.Frame && chartObj.Frame.SubFrame) {
            for (var i = 1; i < chartObj.Frame.SubFrame.length; ++i) {
                var sf = chartObj.Frame.SubFrame[i];
                if (sf && sf.Frame && sf.Frame.Data) {
                    sf.Frame.Data.DataOffset = desiredOffset;
                }
            }
        }
    }
};

frame.ZoomUp = function (cursorIndex) {
zenLog(zenGetStateStr('[ZoomUp] before', hqchart));
var curRelIdx = (cursorIndex && typeof cursorIndex.Index === 'number')
    ? cursorIndex.Index
    : (hqchart ? hqchart.CursorIndex : null);
var targetDataIndex = null;
if (curRelIdx != null && this.Data && typeof this.Data.DataOffset === 'number') {
    targetDataIndex = this.Data.DataOffset + curRelIdx;
    var dataLen = (this.Data && this.Data.Data) ? this.Data.Data.length : 0;
    if (dataLen > 0) {
        targetDataIndex = Math.max(0, Math.min(targetDataIndex, dataLen - 1));
    }
}
var result = origZoomUp.call(this, cursorIndex);
if (!result) {
// 缩放被阻止（已到边界），同步 LCS 防止 Draw 中 CalculateDataWidth 重算 ZoomIndex
if (this.LastCalculateStatus) {
var fw = this.GetFrameWidth ? this.GetFrameWidth() : 0;
this.LastCalculateStatus.Width = fw;
this.LastCalculateStatus.XPointCount = this.XPointCount;
}
return false;
}
if (isCrosshairActive(hqchart) && targetDataIndex != null) {
    adjustZoomToCenter(this, hqchart, targetDataIndex, cursorIndex);
}
zenLog(zenGetStateStr('[ZoomUp] after', hqchart));
return result;
};
frame.ZoomDown = function (cursorIndex, option) {
zenLog(zenGetStateStr('[ZoomDown] before', hqchart));
var zoomSeed = JSChart.GetKLineZoom();
var nextIndex = this.ZoomIndex + 1;
if (nextIndex >= zoomSeed.length) {
// 已到最小缩放，同步 LCS 防止重算
if (this.LastCalculateStatus) {
var fw = this.GetFrameWidth ? this.GetFrameWidth() : 0;
this.LastCalculateStatus.Width = fw;
this.LastCalculateStatus.XPointCount = this.XPointCount;
}
return false;
}
var nextCount = this.CalculateCount(nextIndex);
if (nextCount > MAX_VISIBLE_KLINE_COUNT) {
// 超过最大可见K线数，同步 LCS 防止重算
if (this.LastCalculateStatus) {
var fw2 = this.GetFrameWidth ? this.GetFrameWidth() : 0;
this.LastCalculateStatus.Width = fw2;
this.LastCalculateStatus.XPointCount = this.XPointCount;
}
return false;
}
var curRelIdx = (cursorIndex && typeof cursorIndex.Index === 'number')
    ? cursorIndex.Index
    : (hqchart ? hqchart.CursorIndex : null);
var targetDataIndex = null;
if (curRelIdx != null && this.Data && typeof this.Data.DataOffset === 'number') {
    targetDataIndex = this.Data.DataOffset + curRelIdx;
    var dataLen = (this.Data && this.Data.Data) ? this.Data.Data.length : 0;
    if (dataLen > 0) {
        targetDataIndex = Math.max(0, Math.min(targetDataIndex, dataLen - 1));
    }
}
var result = origZoomDown.call(this, cursorIndex, option);
if (!result) return false;
if (isCrosshairActive(hqchart) && targetDataIndex != null) {
    adjustZoomToCenter(this, hqchart, targetDataIndex, cursorIndex);
}
zenLog(zenGetStateStr('[ZoomDown] after', hqchart));
return result;
};

                    var symbol = data.Request.Data.symbol;    //板块代码
                    data.PreventDefault = true;

                    if (window.ChartContainer) window.ChartContainer.SelectedMemberListSymbol = symbol;
                    var baseList = (window.ChartContainer && window.ChartContainer.BaseSymbolsMap && Array.isArray(window.ChartContainer.BaseSymbolsMap[symbol])) ? window.ChartContainer.BaseSymbolsMap[symbol].slice(0) : [];
                    var userList = (window.ChartContainer && window.ChartContainer.WatchSymbolsMap && Array.isArray(window.ChartContainer.WatchSymbolsMap[symbol])) ? window.ChartContainer.WatchSymbolsMap[symbol].slice(0) : [];
                    var wc = window.ChartContainer.watchlistCanonical.bind(window.ChartContainer);
                    var seen = {};
                    var merged = [];
                    function pushWL(sym) {
                        var c = wc(sym);
                        if (!c || seen[c]) return;
                        seen[c] = true;
                        merged.push(c);
                    }
                    for (var i = 0; i < baseList.length; i++) pushWL(baseList[i]);
                    for (var j = 0; j < userList.length; j++) pushWL(userList[j]);

                    var hqchartData = { symbol: symbol, name: symbol, data: merged };

                    console.log("[ReportChart::RecvMemberListDataV2] hqchartData", hqchartData);
                    callback(hqchartData);

// === 前端调试日志写入文件（仅 debug 模式） ===
// window.ZEN_DEBUG 由构建脚本替换 __ZEN_DEBUG__ 占位符控制
// 日志写入可执行文件同目录的 zen_desktop.log，Release 版本完全不输出
// 性能优化：日志先入队，批量合并发送。绘制高峰期（如缠论逐元素添加）每条日志
// 一个 fetch 会产生数百个 HTTP 请求。服务端按 body+"\n" 写文件，多行 body
// 的每一行格式与逐条发送时完全一致，仅发送时机合并。
var zenLogQueue = [];
var zenLogFlushTimer = null;
function zenLogFlush(sync) {
    zenLogFlushTimer = null;
    if (zenLogQueue.length <= 0) return;
    var batch = zenLogQueue.join('\n');
    zenLogQueue.length = 0;
    var headers = (typeof window._zenApiHeaders === 'function') ? window._zenApiHeaders() : {};
    try {
        fetch('/api/zenlog', { method: 'POST', body: batch, headers: headers, keepalive: sync === true }).catch(function(){});
    } catch(e) { }
}
function zenLog() {
    try {
        if (!window.ZEN_DEBUG) return; // 非 debug 模式完全不输出
        var args = Array.prototype.slice.call(arguments);
        var msg = args.map(function(a) {
            if (a === null) return 'null';
            if (a === undefined) return 'undefined';
            if (typeof a === 'object') {
                try { return JSON.stringify(a); } catch(e) { return String(a); }
            }
            return String(a);
        }).join(' ');
        zenLogQueue.push(msg);
        if (zenLogQueue.length >= 50) {
            zenLogFlush();
            return;
        }
        if (!zenLogFlushTimer) zenLogFlushTimer = setTimeout(function(){ zenLogFlush(); }, 200);
    } catch(e) {}
}
// 页面卸载前把未发送的日志冲出去（keepalive 保证请求完成）
window.addEventListener('pagehide', function() { try { if (zenLogFlushTimer) clearTimeout(zenLogFlushTimer); zenLogFlush(true); } catch(e) {} });

// 待定笔/线段虚线绘制：与 ChartDrawPictureLine.Draw 行为一致，仅增加虚线
var ZEN_PENDING_LINE_DRAW = function () {
    this.LinePoint = [];
    if (this.IsFrameMinSize()) return;
    if (!this.IsShow) return;

    var drawPoint = this.CalculateDrawPoint({ IsCheckX: true, IsCheckY: false });
    if (!drawPoint) return;
    if (drawPoint.length != 2) return;

    this.ClipFrame();

    var ptStart = drawPoint[0];
    var ptEnd = drawPoint[1];

    this.SetLineWidth();
    this.Canvas.strokeStyle = this.LineColor;
    var dpr = (typeof GetDevicePixelRatio === 'function') ? GetDevicePixelRatio() : 1;
    this.Canvas.setLineDash([5 * dpr, 5 * dpr]);
    this.Canvas.beginPath();
    this.Canvas.moveTo(ptStart.X, ptStart.Y);
    this.Canvas.lineTo(ptEnd.X, ptEnd.Y);
    this.Canvas.stroke();
    this.Canvas.setLineDash([]);
    this.RestoreLineWidth();

    var line = { Start: ptStart, End: ptEnd };
    this.LinePoint.push(line);

    this.DrawPoint(drawPoint);
    this.Canvas.restore();
};
// 获取当前图表状态摘要
function zenGetStateStr(label, hq) {

        if (!hq) return label + ' [hq=null]';
        var f = hq.Frame && hq.Frame.SubFrame && hq.Frame.SubFrame[0] ? hq.Frame.SubFrame[0].Frame : null;
        var p0 = hq.ChartPaint && hq.ChartPaint[0];
        var dOff = (p0 && p0.Data) ? (p0.Data.DataOffset || 0) : -1;
        var dCnt = (p0 && p0.Data && p0.Data.Data) ? p0.Data.Data.length : 0;
        var zIdx = f ? (f.ZoomIndex || 0) : -1;
        var dW = f ? (f.DataWidth || 0) : 0;
        var xpc = f ? (f.XPointCount || 0) : 0;
        var lcsW = (f && f.LastCalculateStatus) ? f.LastCalculateStatus.Width : 'N/A';
        var lcsX = (f && f.LastCalculateStatus) ? f.LastCalculateStatus.XPointCount : 'N/A';
        return label + ' P=' + hq.Period + ' ZI=' + zIdx + ' DW=' + dW + ' XPC=' + xpc + ' DOff=' + dOff + ' DCnt=' + dCnt + ' LCS{W:' + lcsW + ',X:' + lcsX + '}';

                // === 缠论配置持久化 ===
                // 按钮状态保存到 .zen_settings.json 的 zenConfig 字段

                this._zenConfigKeys = [
                    'enableStroke', 'enableSegment', 'enableStrokePivot', 'enableSegmentPivot', 'enableMacdDiv',
                    'extend', 'gapStroke', 'newStroke', 'merge', 'expand', 'allowCross',
                    'strokePrice', 'processingMode'
                ];

                this._saveZenConfig = function () {
                    var cfg = {};
                    var keys = this._zenConfigKeys;
                    for (var i = 0; i < keys.length; i++) {
                        var k = keys[i];
                        if (this._configValues[k] !== undefined) {
                            cfg[k] = this._configValues[k];
                        }
                    }
                    try {
                        fetch('/api/zenconfig', {
                            method: 'POST',
                            headers: Object.assign({ 'Content-Type': 'application/json' }, _zenApiHeaders()),
                            body: JSON.stringify({ zenConfig: cfg })
                        }).catch(function (e) { zenLog('保存缠论配置失败:', e); });
                    } catch (e) { zenLog('保存缠论配置异常:', e); }
                };

                this._loadZenConfig = function () {
                    var self = this;
                    try {
                        fetch('/api/zenconfig', { headers: _zenApiHeaders() })
                            .then(function (r) { return r.json(); })
                            .then(function (data) {
                                var cfg = data && data.zenConfig;
                                if (!cfg) return;
                                var keys = self._zenConfigKeys;
                                var changed = false;
                                for (var i = 0; i < keys.length; i++) {
                                    var k = keys[i];
                                    if (cfg[k] !== undefined && self._configValues[k] !== cfg[k]) {
                                        self._configValues[k] = cfg[k];
                                        changed = true;
                                    }
                                }
                                zenLog('加载缠论配置:', JSON.stringify(cfg), 'changed=', changed);
                                // 更新 DOM 按钮状态以反映加载的配置
                                if (changed && self.IsEnabled) {
                                    self._updateConfigButtonsState(true);
                                    // 配置变化需要重新分析
                                    self._drawnComponents.key = null;
                                    self._triggerReanalysis();
                                }
                            })
                            .catch(function (e) { zenLog('加载缠论配置失败:', e); });
                    } catch (e) { zenLog('加载缠论配置异常:', e); }
                };

                // 启动时异步加载持久化配置
                this._loadZenConfig();
                this._getCanvasFingerprint = function () {
                    try {
                        var canvas = document.createElement('canvas');
                        canvas.width = 200;
                        canvas.height = 50;
                        var ctx = canvas.getContext('2d');
                        ctx.textBaseline = "top";
                        ctx.font = "14px 'Arial'";
                        ctx.textBaseline = "alphabetic";
                        ctx.fillStyle = "#f60";
                        ctx.fillRect(125, 1, 62, 20);
                        ctx.fillStyle = "#069";
                        ctx.fillText("ZenLicense", 2, 15);
                        ctx.fillStyle = "rgba(102, 204, 0, 0.7)";
                        ctx.fillText("ZenLicense", 4, 17);
                        return canvas.toDataURL();
                    } catch (e) {
                        return '';
                    }
                };

                // 生成 WebGL 指纹
                this._getWebGLFingerprint = function () {
                    try {
                        var canvas = document.createElement('canvas');
                        var gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
                        if (!gl) return '';
                        var debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
                        if (!debugInfo) return '';
                        var vendor = gl.getParameter(debugInfo.UNMASKED_VENDOR_WEBGL);
                        var renderer = gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL);
                        return vendor + '|' + renderer;
                    } catch (e) {
                        return '';
                    }
                };

                // 保存机器码到持久化存储 (navigator.storage)
                this._saveToPersistentStorage = async function (id) {
                    try {
                        if (navigator.storage && navigator.storage.persist) {
                            var persisted = await navigator.storage.persist();
                            if (persisted) {
                                if (navigator.storage && navigator.storage.set) {
                                    await navigator.storage.set('zen_machine_id', id);
                                }
                            }
                        }
                    } catch (e) {
                        // 忽略持久化存储错误
                    }
                };

                // 从持久化存储读取
                this._loadFromPersistentStorage = async function () {
                    try {
                        if (navigator.storage && navigator.storage.get) {
                            return await navigator.storage.get('zen_machine_id');
                        }
                    } catch (e) {
                        // 忽略
                    }
                    return null;
                };

                // 初始化机器码（从本地代理获取）
                this.InitMachineID = function () {
                    var self = this;

                    if (this._machineIDPromise) {
                        return this._machineIDPromise;
                    }

                    this._machineIDPromise = new Promise(function (resolve) {
                        // 从本地代理获取机器码
                        fetch('/api/machinecode', { method: 'GET', headers: _zenApiHeaders() })
                            .then(function (resp) { return resp.json(); })
                            .then(function (data) {
                                if (data && data.machine_code) {
                                    self.MachineID = data.machine_code;
                                    resolve(data.machine_code);
                                } else {
                                    resolve(null);
                                }
                            })
                            .catch(function () {
                                resolve(null);
                            });
                    });

                    return this._machineIDPromise;
                };

                this.DisplayStatus = function (isValid, html) {
                    zenLog('DisplayStatus: isValid =', isValid, 'html =', html);
                    var infoElem = document.getElementById('LicenseInfo');
                    var badgeElem = document.getElementById('LicenseBadge');

                    if (infoElem) {
                        var displayHtml = isValid ? (html || '授权通过') : (html || '未知错误');
                        if (displayHtml && displayHtml.indexOf('试用') >= 0) displayHtml = '试用授权';

                        infoElem.textContent = displayHtml;
                        infoElem.style.color = isValid ? '#64c864' : '#ff4d4d';
                    }
                    if (badgeElem) {
                        badgeElem.innerHTML = isValid ? '✅' : '❌';
                        badgeElem.style.display = '';
                    }

                    // 清理旧的 MachineID 显示区域，全都在一行显示
                    var machineElem = document.getElementById('LicenseMachineID');
                    if (machineElem) {
                        machineElem.textContent = '';
                        machineElem.style.display = 'none';
                    }
                };

                this.NormalizeAuthMessage = function (msg) {
                    if (!msg) return '未知错误';
                    var text = String(msg);

                    var firstValue = firstK.Date || (Array.isArray(firstK) ? firstK[0] : null);

                            if (_dataMatch) {

                                zenLog('AddDrawPicture: 跳过重复图形, drawType=', drawType, 'className=', _className);
                                return false;
                            } else {
                                // 同位置但数据不同：
                                // - 对于 ChartDrawPictureText（标签文字），同一K线上可以叠加多个不同 YValue 的标签
                                //   （如"中枢顶背驰(强)"和"1S"），不应替换，应保留两者
                                // - 对于其他类型（线段、中枢矩形等），同位置不同数据意味着数据更新，移除旧的
                                if (_className === 'ChartDrawPictureText') {
                                    continue; // 不替换，继续检查下一个旧图形
                                }
                                var _oldIdx = hqchart.ChartDrawPicture.indexOf(_old);
                                if (_oldIdx >= 0) hqchart.ChartDrawPicture.splice(_oldIdx, 1);
                                this.DrawCache.splice(_di, 1);
                                zenLog('AddDrawPicture: 替换同位置不同数据的图形, drawType=', drawType, 'className=', _className);
                                break; // 同位置只可能有一个旧图形，移除后跳出循环继续画新的
                            }
                        }
                    }

                    // 性能优化：HQChart 的 AddChartDrawPicture 每次添加都会在末尾调用
                    // DrawDynamicInfo()（整屏像素回贴 + 遍历重绘全部 ChartDrawPicture），
                    // 批量添加 N 个缠论元素即 O(N^2) 次全量动态层重绘。
                    // 这里仅在单次添加的同步期间，临时把图表实例上的 DrawDynamicInfo
                    // 挂起为空函数，添加完立即恢复（不修改 HQChart 源码、不影响其它路径）；
                    // 最终渲染由 ScheduleChartDraw -> Chart.Draw() 统一完成，视觉结果不变。
                    var origDrawDynamicInfo = hqchart.DrawDynamicInfo;
                    var picture = null;
                    if (typeof origDrawDynamicInfo === 'function') {
                        hqchart.DrawDynamicInfo = ZEN_NOOP_FN;
                        try {
                            picture = chart.AddChartDrawPicture(drawObj, { Save: false });
                        } finally {
                            hqchart.DrawDynamicInfo = origDrawDynamicInfo;
                        }
                    } else {
                        picture = chart.AddChartDrawPicture(drawObj, { Save: false });
                    }
                    if (!picture) {
                        zenLog('AddChartDrawPicture 返回空');
                        return false;
                    }

                    // 禁用拖拽和选中：固定缠论绘制结果，不能移动也不能被选中
                    if (picture) {
                        picture.EnableMove = false;
                        picture.IsPointIn = function() { return -1; };  // 永远不被检测为点击在图形上
                        if (drawObj.IsPending) picture.Draw = ZEN_PENDING_LINE_DRAW;  // 待定笔/线段：虚线
                        // ChartDrawPictureText 的 textBaseline 硬编码为 "bottom"（文字从Y坐标向上延伸），
                        // 导致下方标签文字覆盖K线到Y之间的区域。通过覆盖 Draw 方法支持自定义 textBaseline。
                        if (drawObj.ClassName === 'ChartDrawPictureText' && drawObj._zenTextBaseline) {
                            var customBaseline = drawObj._zenTextBaseline;
                            picture.Draw = function() {
                                this.TextRect = null;
                                if (this.IsFrameMinSize()) return;
                                if (!this.IsShow) return;
                                var drawPoint = this.CalculateDrawPoint({IsCheckX:true, IsCheckY:true});
                                if (!drawPoint || drawPoint.length != 1) return;
                                this.ClipFrame();
                                this.Canvas.fillStyle = this.LineColor;
                                this.Canvas.textAlign = "center";
                                this.Canvas.textBaseline = customBaseline;
                                this.Canvas.font = this.GetTextFont();
                                this.Canvas.fillText(this.Text, drawPoint[0].X, drawPoint[0].Y);
                                var textWidth = this.Canvas.measureText(this.Text).width;
                                var textHeight = this.FontOption.Size * GetDevicePixelRatio();
                                this.TextRect = {};
                                this.TextRect.Left = drawPoint[0].X - textWidth/2;
                                if (customBaseline === 'top') {
                                    this.TextRect.Top = drawPoint[0].Y;
                                } else if (customBaseline === 'middle') {
                                    this.TextRect.Top = drawPoint[0].Y - textHeight/2;
                                } else {
                                    this.TextRect.Top = drawPoint[0].Y - textHeight;
                                }
                                this.TextRect.Width = textWidth;
                                this.TextRect.Height = textHeight;
                                this.Canvas.restore();
                            };
                        }
                        // 中枢矩形（ChartDrawPictureRect）覆盖 Draw 方法：
                        // 原版 CalculateDrawPoint({IsCheckX:true}) 在矩形两个端点都超出可视范围时
                        // 返回 null 导致不绘制，但这正是长中枢跨整个可见范围的正常场景。
                        // 改用 IsCheckX:false 让 CalculateDrawPoint 始终返回坐标点，
                        // 再由 ClipFrame 将矩形裁剪到可视区域内，确保跨整个可见范围的中枢也能正确绘制。
                        if (drawObj.ClassName === 'ChartDrawPictureRect') {
                            picture.Draw = function () {
                                if (this.IsFrameMinSize()) return;
                                if (!this.IsShow) return;
                                var drawPoint = this.CalculateDrawPoint({ IsCheckX: false, IsCheckY: true });
                                if (!drawPoint || drawPoint.length != 2) return;
                                this.AreaColor = IChartDrawPicture.ColorToRGBA(this.LineColor, 0.3);
                                this.ClipFrame();
                                this.Canvas.strokeStyle = this.LineColor;
                                this.SetLineWidth();
                                this.Canvas.beginPath();
                                this.Canvas.rect(drawPoint[0].X, drawPoint[0].Y, drawPoint[1].X - drawPoint[0].X, drawPoint[1].Y - drawPoint[0].Y);
                                this.Canvas.stroke();
                                this.RestoreLineWidth();
                                this.Canvas.fillStyle = this.AreaColor;
                                this.Canvas.beginPath();
                                this.Canvas.fillRect(drawPoint[0].X, drawPoint[0].Y, drawPoint[1].X - drawPoint[0].X, drawPoint[1].Y - drawPoint[0].Y);
                                this.Canvas.restore();
                                this.DrawPoint(drawPoint);
                            };
                        }
                    }

                    // 关键：在添加到 ChartDrawPicture 后立即检查状态
                    // 如果验证失败，不仅清除 picture，还要记录日志
                    var needRemove = false;
                    if (!this.IsEnabled) {
                        zenLog('AddDrawPicture: 验证时 IsEnabled 为 false');
                        needRemove = true;
                    }
                    if (jobId && jobId !== this.LatestJobId) {
                        zenLog('AddDrawPicture: 验证时 jobId 不匹配');
                        needRemove = true;
                    }

                    if (needRemove) {
                        var index = hqchart.ChartDrawPicture.indexOf(picture);
                        if (index >= 0) {
                            hqchart.ChartDrawPicture.splice(index, 1);
                            zenLog('AddDrawPicture: 从 ChartDrawPicture 清除 picture, ChartDrawPicture.size=', hqchart.ChartDrawPicture.length);
                        }
                        return false;
                    }

                    // 添加类型标签用于按类型清除
                    if (drawType) {
                        picture._zenDrawType = drawType;
                    }
                    // 如果该类型当前处于隐藏状态（例如在分析异步执行过程中被用户取消勾选），新对象出生即隐藏
                    if (drawType && this._hiddenDrawTypes && this._hiddenDrawTypes[drawType]) {
                        picture.IsShow = false;
                    }
                    // 标记是否为增量绘制
                    if (this._incrementalMode === true) {
                        picture._zenIncremental = true;
                    }
                    this.DrawCache.push(picture);
                    zenLog('AddDrawPicture 成功: drawType=', drawType, 'incremental=', picture._zenIncremental, 'DrawCache.size=', this.DrawCache.length, 'ChartDrawPicture.size=', hqchart.ChartDrawPicture.length);
                    return true;
                }

                // 按类型清除绘图
                this.ClearDrawingsByType = function (drawTypes) {
                    if (!Array.isArray(drawTypes)) drawTypes = [drawTypes];

                    var klineChart = this.GetKLineChart();
                    if (!klineChart || !klineChart.Chart) return;
                    var hqchart = klineChart.Chart.JSChartContainer;
                    if (!hqchart) return;

                    // 清除匹配类型的图形
                    for (var i = this.DrawCache.length - 1; i >= 0; i--) {
                        var drawObj = this.DrawCache[i];
                        var drawType = drawObj._zenDrawType;
                        if (drawTypes.indexOf(drawType) >= 0) {
                            var index = hqchart.ChartDrawPicture.indexOf(drawObj);
                            if (index >= 0) {
                                hqchart.ChartDrawPicture.splice(index, 1);
                            }
                            this.DrawCache.splice(i, 1);
                        }
                    }

                    this.ScheduleChartDraw();
                };

                // 按类型设置绘图对象可见性（IsShow），用于图层毫秒级显隐控制且不破坏 z-order
                this.SetDrawingsVisibilityByType = function (drawTypes, isShow) {
                    if (!Array.isArray(drawTypes)) drawTypes = [drawTypes];
                    var count = 0;
                    if (!this.DrawCache) return 0;
                    for (var i = 0; i < this.DrawCache.length; i++) {
                        var drawObj = this.DrawCache[i];
                        if (drawObj && drawTypes.indexOf(drawObj._zenDrawType) >= 0) {
                            drawObj.IsShow = !!isShow;
                            count++;
                        }
                    }
                    return count;
                };

                // 检查 DrawCache 中是否存在指定类型的绘图对象
                this.HasDrawingsOfType = function (drawType) {
                    if (!this.DrawCache || this.DrawCache.length === 0) return false;
                    for (var i = 0; i < this.DrawCache.length; i++) {
                        if (this.DrawCache[i] && this.DrawCache[i]._zenDrawType === drawType) {
                            return true;
                        }
                    }
                    return false;
                };

                // 清除指定类型中"已不存在于新分析结果"的旧图形。
                // currentKeys 是本次绘制过程中收集的所有图形位置标识（XValue 拼接字符串）的 Set。
                // 遍历 DrawCache 中指定类型的旧图形，如果其位置标识不在 currentKeys 中，
                // 说明该图形在新分析结果中已消失，需要移除。
                // 仅在非增量模式下调用——增量模式只处理新增范围，不能清除范围外的旧图形。
                this.RemoveStaleDrawings = function (drawType, currentKeys) {
                    if (!drawType || !currentKeys || currentKeys.size === 0) return;
                    var klineChart = this.GetKLineChart();
                    if (!klineChart || !klineChart.Chart) return;
                    var hqchart = klineChart.Chart.JSChartContainer;
                    if (!hqchart) return;

                    var removed = 0;
                    for (var i = this.DrawCache.length - 1; i >= 0; i--) {
                        var drawObj = this.DrawCache[i];
                        if (drawObj._zenDrawType !== drawType) continue;
                        if (!drawObj.Value || drawObj.Value.length === 0) continue;
                        // 构建位置标识：所有 XValue 拼接
                        var posKey = '';
                        for (var vi = 0; vi < drawObj.Value.length; vi++) {
                            posKey += drawObj.Value[vi].XValue + ',';
                        }
                        if (!currentKeys.has(posKey)) {
                            var index = hqchart.ChartDrawPicture.indexOf(drawObj);
                            if (index >= 0) hqchart.ChartDrawPicture.splice(index, 1);
                            this.DrawCache.splice(i, 1);
                            removed++;
                        }
                    }
                    if (removed > 0) {
                        zenLog('RemoveStaleDrawings: drawType=', drawType, 'removed=', removed);
                        this.ScheduleChartDraw();
                    }
                }
                // 标签的 YValue 在绘制时通过 GetValueByPixelOffset 计算并固定，
                // 缩放后 span 变化导致偏移不适配；拖拽后新进入可见区的标签未绘制。
                // 此函数清除旧标签并用缓存的分析结果重新绘制。
                this._redrawAllLabels = function () {
                    if (!this.IsEnabled) return;
                    if (!this._jobIndexOffset) return;

                    var jobId = this._jobIndexOffset.jobId;
                    var indexOffset = this._jobIndexOffset.offset || 0;

                    // 从缓存获取分析结果
                    var klineChart = this.GetKLineChart();
                    if (!klineChart || !klineChart.Chart) return;
                    var hqchart = klineChart.Chart.JSChartContainer;
                    if (!hqchart) return;
                    var kData = hqchart.ChartPaint && hqchart.ChartPaint[0] ? hqchart.ChartPaint[0].Data : null;
                    if (!kData || !kData.Data) return;

                    // 查找缓存中的分析结果
                    var cacheKey = this._generateAnalysisCacheKey(hqchart, indexOffset, this._jobIndexOffset.sliceCount, kData);
                    var analysis = cacheKey ? this._zenAnalysisCache[cacheKey] : null;
                    if (!analysis) return;

                    // 收集需要重绘的标签类型
                    var typesToRedraw = [];

                    // 1. 笔端点价格标签
                    if (this._configValues.strokePrice && this._configValues.enableStroke && analysis.strokes && analysis.strokes.length > 0) {
                        typesToRedraw.push('stroke_price');
                    }
                    // 2. MACD背离标签
                    if (this._configValues.enableMacdDiv && analysis.macd_divergences && analysis.macd_divergences.length > 0) {
                        typesToRedraw.push('macd_div');
                    }
                    // 3. 笔买卖点信号标签
                    if (this._configValues.enableStrokePivot && analysis.trading_signals) {
                        var strokeSignals = analysis.trading_signals.filter(s => s.category === 'stroke');
                        if (strokeSignals.length > 0) {
                            typesToRedraw.push('stroke_signal');
                        }
                    }
                    // 4. 线段买卖点信号标签
                    if (this._configValues.enableSegmentPivot && analysis.trading_signals) {
                        var segmentSignals = analysis.trading_signals.filter(s => s.category === 'segment');
                        if (segmentSignals.length > 0) {
                            typesToRedraw.push('segment_signal');
                        }
                    }

                    if (typesToRedraw.length === 0) return;

                    // 重置标签计数器，确保重绘时标签堆叠位置正确
                    this._labelIndexCounter = { top: {}, bottom: {} };

                    // 清除旧的绘图对象
                    this.ClearDrawingsByType(typesToRedraw);

                    // 重新绘制各类标签（同步图层标志，保证 DrawAnalysisResult 分层diff判断准确）
                    // 1. 笔端点价格
                    if (typesToRedraw.indexOf('stroke_price') >= 0) {
                        this.DrawStrokePrice(analysis.strokes, kData, jobId, indexOffset);
                        this._drawnComponents.strokePrice = true;
                    }
                    // 2. MACD背离
                    if (typesToRedraw.indexOf('macd_div') >= 0) {
                        this.DrawSignals(analysis.macd_divergences, kData, jobId, 'macd', indexOffset, 'macd_div', null, null);
                        this._drawnComponents.macdDiv = true;
                    }
                    // 3. 笔买卖点信号
                    if (typesToRedraw.indexOf('stroke_signal') >= 0) {
                        var strokeSignals = analysis.trading_signals.filter(s => s.category === 'stroke');
                        this.DrawSignals(strokeSignals, kData, jobId, 'stroke', indexOffset, 'stroke_signal', null, null);
                    }
                    // 4. 线段买卖点信号
                    if (typesToRedraw.indexOf('segment_signal') >= 0) {
                        var segmentSignals = analysis.trading_signals.filter(s => s.category === 'segment');
                        this.DrawSignals(segmentSignals, kData, jobId, 'segment', indexOffset, 'segment_signal', null, null);
                    }
                    this.ScheduleChartDraw();
                };

                // === 显示开关专用：获取可安全分层补画的缓存上下文 ===
                // 仅当画面上的图层确实来自该缓存条目（_drawnComponents.key === cacheKey）时才允许补画，
                // 防止把缓存分析补画到其它来源的图层上（indexOffset 不一致导致坐标错位）
                this._getDisplayDrawContext = function () {
                    if (!this.IsEnabled) return null;
                    if (!this._jobIndexOffset) return null;
                    var klineChart = this.GetKLineChart();
                    if (!klineChart || !klineChart.Chart) return null;
                    var hqchart = klineChart.Chart.JSChartContainer;
                    if (!hqchart) return null;
                    var kData = hqchart.ChartPaint && hqchart.ChartPaint[0] ? hqchart.ChartPaint[0].Data : null;
                    if (!kData || !kData.Data) return null;
                    var indexOffset = this._jobIndexOffset.offset || 0;
                    var sliceCount = this._jobIndexOffset.sliceCount;
                    var cacheKey = this._generateAnalysisCacheKey(hqchart, indexOffset, sliceCount, kData);
                    if (!cacheKey) return null;
                    if (this._drawnComponents.key !== cacheKey) return null;
                    var analysis = this._zenAnalysisCache[cacheKey];
                    if (!analysis) return null;
                    return { analysis: analysis, cacheKey: cacheKey, kData: kData, indexOffset: indexOffset, jobId: this._jobIndexOffset.jobId };
                };

                // 是否有分析/绘制正在进行，或新分析已排队待执行。
                // 显示开关切换时若处于此状态：勾选框立即响应，等 DrawAnalysisResult
                // 开始绘制时按最新勾选状态决定各图层显隐（绘制代码实时读取 _configValues）
                this._isAnalysisBusy = function () {
                    if (this._analyzing || this._analysisState === 'analyzing' || this._analysisState === 'drawing') return true;
                    // 新分析已排队（_triggerReanalysis 已递增 LatestJobId 但新 job 尚未开始绘制）
                    if (this._jobIndexOffset && this.LatestJobId && this._jobIndexOffset.jobId !== this.LatestJobId) return true;
                    return false;
                };

                // === 按规范图层顺序重绘全部图形层（笔→笔中枢→线段→线段中枢）===
                // HQChart 按 ChartDrawPicture 数组顺序渲染（后加入的画在更上层），单独补画
                // 某个图形层会把该层追加到数组末尾、盖住本应在它之上的图层（如中枢区域盖住
                // 买卖点标签）。因此图形层开关勾选时清空全部图形层并按规范顺序整体重绘，
                // 保证 z-order 与全量绘制一致。数据全部来自缓存条目，无 WASM 重新分析
                this._redrawGraphicsLayers = async function (ctx) {
                    this.ClearDrawingsByType(['stroke', 'stroke_pivot', 'segment', 'segment_pivot']);
                    this._drawnComponents.stroke = false;
                    this._drawnComponents.strokePivot = false;
                    this._drawnComponents.segment = false;
                    this._drawnComponents.segmentPivot = false;
                    // 1. 笔（最底层）
                    if (this._configValues.enableStroke && ctx.analysis.strokes && ctx.analysis.strokes.length > 0) {
                        delete this._hiddenDrawTypes['stroke'];
                        await this.DrawStrokes(ctx.analysis.strokes, ctx.kData, ctx.jobId, ctx.indexOffset, null, null);
                        this._drawnComponents.stroke = true;
                    }
                    // 2. 笔中枢
                    if (this._configValues.enableStrokePivot && ctx.analysis.stroke_pivots && ctx.analysis.stroke_pivots.length > 0) {
                        delete this._hiddenDrawTypes['stroke_pivot'];
                        await this.DrawPivots(ctx.analysis.stroke_pivots, ctx.kData, 0, ctx.jobId, ctx.indexOffset, 'stroke_pivot', null, null);
                        this._drawnComponents.strokePivot = true;
                    }
                    // 3. 线段
                    if (this._configValues.enableSegment && ctx.analysis.segments && ctx.analysis.segments.length > 0) {
                        delete this._hiddenDrawTypes['segment'];
                        await this.DrawSegments(ctx.analysis.segments, ctx.kData, ctx.jobId, ctx.indexOffset, null, null);
                        this._drawnComponents.segment = true;
                    }
                    // 4. 线段中枢
                    if (this._configValues.enableSegmentPivot && ctx.analysis.segment_pivots && ctx.analysis.segment_pivots.length > 0) {
                        delete this._hiddenDrawTypes['segment_pivot'];
                        await this.DrawPivots(ctx.analysis.segment_pivots, ctx.kData, 1, ctx.jobId, ctx.indexOffset, 'segment_pivot', null, null);
                        this._drawnComponents.segmentPivot = true;
                    }
                };

                // === 显示开关勾选统一入口：从缓存重绘（无 WASM 分析），无缓存则兜底重新分析 ===
                // needGraphics: true=图形层开关（笔/线段/两类中枢），按规范顺序整体重绘图形层；
                //               false=纯标签开关（笔端点价格/MACD背离），仅全量重排标签
                //               （标签层永远在图形层之上，追加不会破坏 z-order）
                this._redrawFromCacheOrAnalyze = function (needGraphics) {
                    var self = this;
                    // 分析/绘制/排队中：不补画。进行中的分析完成后，DrawAnalysisResult
                    // 会读取实时 _configValues 按最新勾选状态绘制，无需干预
                    if (this._isAnalysisBusy()) return;
                    var ctx = this._getDisplayDrawContext();
                    if (ctx) {
                        // 命中缓存：图形层按序重绘 + 标签全量重排。
                        // 标签Y轴堆叠位置依赖所有已显示标签，必须整体重算，否则出现空档/重叠；
                        // 渲染挂起防止清除+重建期间出现中间帧（与 DrawAnalysisResult 同策略）
                        this._renderSuspended = true;
                        (async function () {
                            try {
                                if (needGraphics !== false) await self._redrawGraphicsLayers(ctx);
                                self._redrawAllLabels();
                            } finally {
                                self._renderSuspended = false;
                                self.ScheduleChartDraw();
                            }
                        })();
                    } else {
                        // 无缓存可复用（首次未分析/数据或模式已变化/缓存被LRU淘汰）：
                        // 兜底走全量重新分析，完成后按当前勾选状态绘制并写入缓存
                        this._triggerReanalysis();
                    }
                };

                this.GetValueByPixelOffset = function (frame, baseValue, pixelOffset, isUp) {
                    if (!frame || typeof frame.GetYFromData !== 'function') return baseValue;
                    if (!(pixelOffset > 0 || pixelOffset < 0)) return baseValue;

                    var y0 = frame.GetYFromData(baseValue);
                    if (!Number.isFinite(y0)) return baseValue; // 如果当前无法获取有效像素坐标，回退

                    // 根据 isUp 决定目标像素坐标
                    var targetY = isUp ? y0 - pixelOffset : y0 + pixelOffset;

                    // 优先尝试基于 frame 比例的基础公式（更稳健，尤其是在缩放过程中）
                    var min = Number(frame.HorizontalMin);
                    var max = Number(frame.HorizontalMax);
                    var span = max - min;
                    var frameHeight = frame.ChartBorder ? frame.ChartBorder.GetHeightEx() : 0;

                    // 如果比例可用且是线性坐标系，直接进行比例转换
                    if (!frame.Logarithmic && span > 0 && frameHeight > 0) {
                        var pricePerPixel = span / frameHeight;
                        // isUp=true: 向上偏移，价格增加
                        // isUp=false: 向下偏移，价格减少
                        return isUp ? baseValue + pixelOffset * pricePerPixel : baseValue - pixelOffset * pricePerPixel;
                    }

                    // 如果是对数坐标或没有简单比例，回退到二分查找
                    if (!(span > 0)) span = Math.max(1, Math.abs(baseValue) * 0.1);
                    if (!Number.isFinite(min) || !Number.isFinite(max)) return baseValue;
                    if (frame.Logarithmic) min = Math.max(min, 0.0000001);

                    var getY = (v) => frame.GetYFromData(v);
                    var yMin = getY(min);
                    var yMax = getY(max);
                    var yLow = Math.min(yMin, yMax);
                    var yHigh = Math.max(yMin, yMax);

                    if (!Number.isFinite(yLow) || !Number.isFinite(yHigh)) return baseValue;

                    // 限制 targetY 在当前 Frame 范围内，避免极端越界导致 clustering
                    if (targetY < yLow) targetY = yLow;
                    else if (targetY > yHigh) targetY = yHigh;

                    var lo = min;
                    var hi = max;
                    var yInc = (yMax > yMin);

                            this.DrawStrokePrice(analysis.strokes, kData, jobId, indexOffset);

                    if (!this.IsEnabled || jobId !== this.LatestJobId) return false;

                    zenLog('DrawAnalysisResult: enableMacdDiv=', this._configValues.enableMacdDiv, 'macd_divergences.length=', analysis.macd_divergences ? analysis.macd_divergences.length : 'null', 'enableStrokePivot=', this._configValues.enableStrokePivot, 'trading_signals.length=', analysis.trading_signals ? analysis.trading_signals.length : 'null');
                    if (this._configValues.enableMacdDiv && analysis.macd_divergences && analysis.macd_divergences.length > 0) {

                            var curFirstTime = kDataAfter.Data[0].Time || (Array.isArray(kDataAfter.Data[0]) ? kDataAfter.Data[0][1] : 0);

                                // 检查 Symbol 是否匹配
                                if (anchor.symbol && curSymbol !== anchor.symbol) {

                                }
                                // 检查锚点是否匹配
                                if (curFirstDate !== anchor.firstDate || curFirstTime !== anchor.firstTime) {
                                    zenLog('数据一致性验证失败: anchor expected=', anchor.firstDate, anchor.firstTime, 'actual=', curFirstDate, curFirstTime);

                this.DrawStrokes = async function (strokes, kData, jobId, indexOffset, newVisibleDataStart, newVisibleDataEnd) {
                    // 开始绘制前先获取当前股票和周期，确保绘制的是正确的数据
                    var klineChart = this.GetKLineChart();
                    if (!klineChart || !klineChart.Chart) {
                        zenLog('DrawStrokes: klineChart 或 Chart 为空，直接返回');
                        return;
                    }
                    var hqchart = klineChart.Chart.JSChartContainer;
                    if (!hqchart) {
                        zenLog('DrawStrokes: hqchart 为空，直接返回');
                        return;
                    }
                    var currentSymbol = hqchart.Symbol;
                    var currentPeriod = hqchart.Period;

                    zenLog('DrawStrokes 开始: strokes.length=', strokes.length, 'jobId=', jobId,
                        'currentSymbol=', currentSymbol, 'currentPeriod=', currentPeriod,
                        'newVisibleDataStart=', newVisibleDataStart, 'newVisibleDataEnd=', newVisibleDataEnd);

                    var yieldFrame = function () { return new Promise((resolve) => requestAnimationFrame(() => resolve())); };
                    var sliceStart = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;

                    var dataCount = kData.Data.length;
var analysisStart = indexOffset;

                    var skipReason = { empty: 0, invalidIdx: 0, outOfRange: 0, noItem: 0, addFailed: 0 };

                    var currentKeys = new Set();

                        if (!this.IsEnabled) { zenLog('DrawStrokes: IsEnabled 变为 false，停止'); return; }
                        if (jobId && jobId !== this.LatestJobId) { zenLog('DrawStrokes: jobId 不匹配，停止'); return; }
                        // 每次循环都重新获取 hqchart，确保使用最新状态
                        var hqchartNow = klineChart.Chart.JSChartContainer;
                        if (!hqchartNow) { skipReason.empty++; continue; }

                        if (hqchartNow.Symbol.toLowerCase() !== currentSymbol.toLowerCase()) {
                            zenLog('DrawStrokes: Symbol 变化，停止绘制');
                            return;

                            zenLog('DrawStrokes: Period 变化，停止绘制');
                            return;

                            var _kDataNow = hqchartNow && hqchartNow.ChartPaint && hqchartNow.ChartPaint[0] ? hqchartNow.ChartPaint[0].Data : null;
                            if (_kDataNow && _kDataNow.Data && _kDataNow.Data.length !== dataCount) {

                        var endIdx = this.ToChartIndex(s.end_k, indexOffset);

                        if (newVisibleDataStart != null && newVisibleDataEnd != null) {

                            var dataStartIdx = s.start_k;
                            var dataEndIdx = s.end_k;

                            // 检查笔是否与新增可见范围重叠
                            // 新增可见范围是 [newVisibleDataStart, newVisibleDataEnd)
                            var isInNewRange = (dataEndIdx >= newVisibleDataStart && dataEndIdx < newVisibleDataEnd) ||
                                (dataStartIdx >= newVisibleDataStart && dataStartIdx < newVisibleDataEnd);
                            var crossesBoundary = (dataStartIdx < newVisibleDataStart && dataEndIdx >= newVisibleDataStart);

                        // 注意：stroke.high/low 已经是基于 merged_high/merged_low 计算的

                        var startValue, endValue;
                        if (dir > 0) {

                            startValue = s.low;  // 使用笔对象的缠论K低点
                            endValue = s.high;   // 使用笔对象的缠论K高点
                        } else {
                            // 向下笔：起点取 high，终点取 low
                            startValue = s.high; // 使用笔对象的缠论K高点
                            endValue = s.low;    // 使用笔对象的缠论K低点
                        }

                        var color = 'rgb(255,0,255)';  // 紫色笔 (COLORMAGENTA)，与 Replay 一致

                            FrameID: 0,
                            LineColor: color,

                        if (result) {

                        } else {
                            skipReason.addFailed++;
                        }
                        // 收集位置标识（无论新增还是跳过，只要该笔有效就记录）

                    }

                }

                // 绘制笔端点价格标签（在笔的起止端点标注价格）

                this.DrawStrokePrice = function (strokes, kData, jobId, indexOffset) {
                    var klineChart = this.GetKLineChart();
                    if (!klineChart || !klineChart.Chart) return;
                    var hqchart = klineChart.Chart.JSChartContainer;
                    if (!hqchart) return;

                    // 清除旧的 stroke_price 标签，防止增量模式下重复绘制
                    this.ClearDrawingsByType(['stroke_price']);

                    // 获取可见范围
                    var vr = this.GetVisibleRange();
                    if (!vr || vr.Start == null || vr.End == null) return;
                    var visStart = Math.floor(vr.Start);
                    var visEnd = Math.ceil(vr.End);

                    // 计算可见区域最高最低价
                    var visMax = -Infinity, visMin = Infinity;
                    var visMaxIdx = -1, visMinIdx = -1;
                    for (var i = visStart; i <= Math.min(visEnd, kData.Data.length - 1); i++) {
                        var k = kData.Data[i];
                        if (!k) continue;
                        var mh = k.High || k.high || k.mh || 0;
                        var ml = k.Low || k.low || k.ml || 0;
                        if (mh > visMax) { visMax = mh; visMaxIdx = i; }
                        if (ml < visMin) { visMin = ml; visMinIdx = i; }
                    }

                    var frame = null;
                    if (hqchart.Frame && hqchart.Frame.SubFrame && hqchart.Frame.SubFrame[0]) {
                        frame = hqchart.Frame.SubFrame[0].Frame;
                    }
                    if (!frame && hqchart.ChartFrame) frame = hqchart.ChartFrame;

                    var pixelRatio = GetDevicePixelRatio ? GetDevicePixelRatio() : 2;
                    // 字号与信号标签一致（主图价格字号的80%）
                    var fontSize = 12 * 0.8;
                    var textHeightPx = fontSize * pixelRatio;
                    var gapPx = 1 * pixelRatio;
                    // baseOffsetPx = 间距（文字边缘到K线的空白），不含 textHeight（文字向远离K线方向延伸）
                    var baseOffsetPx = gapPx * 2;
                    var labelSpacingPx = textHeightPx * 0.15;
                    var strokeColor = 'rgb(219,220,220)';

                    var dataCount = kData.Data.length;

                    // 去重：记录已绘制的笔端点（idx_price_key），避免相邻笔共享端点时重复显示
                    var drawnPrices = {};

                    for (var i = 0; i < strokes.length; i++) {
                        var s = strokes[i];
                        var startIdx = this.ToChartIndex(s.start_k, indexOffset);
                        var endIdx = this.ToChartIndex(s.end_k, indexOffset);
                        var dir = Number(s.direction);
                        if (!Number.isFinite(startIdx) || !Number.isFinite(endIdx)) continue;
                        if (startIdx < 0 || endIdx < 0) continue;
                        if (startIdx >= dataCount || endIdx >= dataCount) continue;

                        var startPrice, endPrice;

                                var macdDir = sig.direction !== undefined ? sig.direction : (type > 0 ? 1 : -1);

                                    labelInfo.text = sig.text || (pivotDir < 0 ? '笔中枢顶背驰' : '笔中枢底背驰');
                                    if (pivotDir < 0) topLabels.push(labelInfo); else bottomLabels.push(labelInfo);

                                    // 基础背驰（只有卖信号）
                                    labelInfo.text = sig.text || '背驰';
                                    topLabels.push(labelInfo);
                                }
                            } else if (absType === 100) {
                                // 线段中枢背驰：signal_type=100 表示线段中枢背驰
                                // type > 0: 底背驰(买) → 下方; type < 0: 顶背驰(卖) → 上方; type=0: 默认底背驰(下方)
                                var pivotDir = sig.direction !== undefined ? sig.direction : (type > 0 ? 1 : (type < 0 ? -1 : 1));
                                labelInfo.text = sig.text || (pivotDir < 0 ? '线段中枢顶背驰' : '线段中枢底背驰');
                                if (pivotDir < 0) topLabels.push(labelInfo); else bottomLabels.push(labelInfo);
                            } else if (absType >= 1 && absType <= 3) {

                                if (type > 0) {

                        // 按类别优先级排序：优先级低的靠近K线
                        topLabels = sortLabelsByCategory(topLabels);

                        // 获取 frame 的可见区域边界

                        // 使用全局标签计数器，让同一天K线的多个标签自动错开
                        for (var k = 0; k < topLabels.length; k++) {
                            // 获取该K线当前顶部标签的数量，并递增
                            if (!this._labelIndexCounter.top[idx]) this._labelIndexCounter.top[idx] = 0;
                            var labelIdx = this._labelIndexCounter.top[idx]++;
                            // 标签 Y 值锚点始终用 K 线极值
                            // sig.price 仅用于白点位置，不影响标签文字的 Y 值
                            var topSig = topLabels[k].sig;
                            var topAnchorPrice = kHigh;
                            var yValue = topAnchorPrice;
                            var pixelOffset = baseOffsetPx + (textHeightPx + labelSpacingPx) * labelIdx;

                            // 检查偏移后的像素坐标是否超出可见区域
                            var needAdjustToKLine = false;
                            if (frame && frameYRange && typeof frame.GetYFromData === 'function') {
                                var yHighPixel = frame.GetYFromData(topAnchorPrice);
                                if (Number.isFinite(yHighPixel)) {
                                    var yPixel = yHighPixel - pixelOffset;  // 向上偏移（像素值减小）
                                    // 判断像素坐标是否超出可见区域
                                    if (yPixel < frameYRange.yLow || yPixel > frameYRange.yHigh) {
                                        needAdjustToKLine = true;
                                    }
                                }
                            }

                            if (frame && typeof this.GetValueByPixelOffset === 'function') {
                                // 超出可见区域时用较小偏移，避免文字覆盖在K线上
                                // 注意：不能用更大的 minOffset 替代 pixelOffset，否则标签反而离K线更远
                                var actualOffset = needAdjustToKLine ? Math.min(pixelOffset, textHeightPx + gapPx) : pixelOffset;
                                yValue = this.GetValueByPixelOffset(frame, topAnchorPrice, actualOffset, true);  // true = 向上偏移
                            }
                            // 顶部标签：卖出信号（S）
                            var sig = topLabels[k].sig;
                            var color;
                            if (isMacdType) {
                                color = macdColor;
                            } else if (isStrokeType) {
                                color = strokeSellColor;  // 笔中枢卖出：亮绿色
                            } else {
                                color = segmentSellColor; // 线段中枢卖出：浅蓝色
                            }

                            // 只在第一个标签时绘制白色醒目标识符号
                            // MACD顶背离：使用 K 线的 high
                            // 其他（笔中枢/线段中枢背驰、买卖点）：使用信号的 price 字段
                            if (labelIdx === 0) {
                                var dotPrice = (isMacdType) ? high : (sig.price || high);
                                
                                // 使用刚才定义的自研类 ChartDrawPictureSolidZenDot 进行绘图
                                // 这将绕开所有的内建文字对齐和字体渲染坑，直接在坐标原点画实心图形。
                                this.AddDrawPicture({

                        for (var k = 0; k < bottomLabels.length; k++) {

                            if (!this._labelIndexCounter.bottom[idx]) this._labelIndexCounter.bottom[idx] = 0;

                            // 标签 Y 值锚点始终用 K 线极值
                            // sig.price 仅用于白点位置，不影响标签文字的 Y 值
                            var bottomSig = bottomLabels[k].sig;
                            var bottomAnchorPrice = kLow;
                            var pointPrice = bottomAnchorPrice;
                            var yValue = bottomAnchorPrice;
                            // baseOffsetPx 已含文字高度，按 labelIdx 递增堆叠
                            var pixelOffset = baseOffsetPx + (textHeightPx + labelSpacingPx) * labelIdx;

                            // 检查偏移后的像素坐标是否超出可见区域
                            var needAdjustToKLine = false;
                            if (frame && frameYRange && typeof frame.GetYFromData === 'function') {
                                var yLowPixel = frame.GetYFromData(bottomAnchorPrice);
                                if (Number.isFinite(yLowPixel)) {
                                    var yPixel = yLowPixel + pixelOffset;  // 向下偏移（像素值增加）
                                    // 判断像素坐标是否超出可见区域
                                    if (yPixel < frameYRange.yLow || yPixel > frameYRange.yHigh) {
                                        needAdjustToKLine = true;
                                    }
                                }
                            }

                            if (frame && typeof this.GetValueByPixelOffset === 'function') {
                                // 超出可见区域时用较小偏移，避免文字覆盖在K线上

                                var actualOffset = needAdjustToKLine ? Math.min(pixelOffset, textHeightPx + gapPx) : pixelOffset;

                            if (labelIdx === 0) {

                this.DrawPivots = async function (pivots, kData, level, jobId, indexOffset, drawType, newVisibleDataStart, newVisibleDataEnd) {
                    if (level === undefined) level = 0;
                    // 开始绘制前先获取当前股票和周期，确保绘制的是正确的数据
                    var klineChart = this.GetKLineChart();
                    if (!klineChart || !klineChart.Chart) {
                        zenLog('DrawPivots: klineChart 或 Chart 为空，直接返回');
                        return;
                    }
                    var hqchart = klineChart.Chart.JSChartContainer;
                    if (!hqchart) {
                        zenLog('DrawPivots: hqchart 为空，直接返回');
                        return;
                    }
                    var currentSymbol = hqchart.Symbol;
                    var currentPeriod = hqchart.Period;

                    zenLog('DrawPivots 开始: pivots.length=', pivots.length, 'level=', level, 'jobId=', jobId,
                        'currentSymbol=', currentSymbol, 'currentPeriod=', currentPeriod);

                    var sliceStart = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;

                    var currentKeys = new Set();

                            zenLog('DrawPivots: IsEnabled 或 jobId 不匹配，停止');
                            return;
                        }
                        // 每次循环都重新获取 hqchart，确保使用最新状态
                        var hqchartNow = klineChart.Chart.JSChartContainer;
                        if (!hqchartNow) continue;
                        // 实时校验 Symbol 和 Period
                        if (hqchartNow.Symbol.toLowerCase() !== currentSymbol.toLowerCase()) {
                            zenLog('DrawPivots: Symbol 变化，停止绘制');
                            return;
                        }
                        if (hqchartNow.Period !== currentPeriod) {
                            zenLog('DrawPivots: Period 变化，停止绘制');
                            return;
                        }
                        // 每400次或每6ms让出一次主线程（保持UI响应）
                        if (i > 0 && (i % 400 === 0 || (performance && performance.now() - sliceStart > 6))) {
                            await yieldFrame();

                            }
                        }
                        var p = pivots[i];
                        var startK = p.start_k_idx != null ? p.start_k_idx : (p.start_k != null ? p.start_k : p.start);
                        var endK = p.end_k_idx != null ? p.end_k_idx : (p.end_k != null ? p.end_k : p.end);

                        if (newVisibleDataStart != null && newVisibleDataEnd != null) {
