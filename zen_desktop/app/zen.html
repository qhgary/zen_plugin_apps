                        currentKeys.add(startIdx + ',' + endIdx + ',');

                // incrementalClear: true - 只清除增量绘制的内容（保留原有绘制）
                // incrementalClear: false - 完全清除所有绘制（默认行为）
                this.ClearDrawings = function (incrementalClear) {
                    zenLog('ClearDrawings called: incrementalClear=', incrementalClear, 'DrawCache.size=', this.DrawCache.length);
                    var klineChart = this.GetKLineChart();
                    if (!klineChart || !klineChart.Chart) return;
                    var hqchart = klineChart.Chart.JSChartContainer;

                    if (incrementalClear === true && this.DrawCache.length > 0) {

                        // Set + 单趟原地压缩（O(N)），替代逐个 indexOf+splice 的 O(N²)
                        var incSet = new Set();

<script>
    // ========== 设备ID显示模块 ==========
    const DeviceIdUI = {
        _listenerAdded: false,

        init() {
            const container = document.getElementById('LicenseMachineID');
            if (!container) return;

            // 只注册一次监听器
            if (!this._listenerAdded) {
                this._listenerAdded = true;
                window.addEventListener('message', (e) => {
                    if (e.data.id === 'device_id') {
                        this.show(e.data.deviceId, container);
                        // 同时更新主线程的 MachineID
                        if (window.ChartContainer && window.ChartContainer.MachineID !== undefined) {
                            window.ChartContainer.MachineID = e.data.deviceId;
                        }
                    } else if (e.data.id === 'device_id_set_success') {
                        this.show(e.data.deviceId, container);
                    } else if (e.data.id === 'device_id_error') {
                        console.warn('[DeviceIdUI] 获取设备ID失败:', e.data.error);
                    }
                });
            }
            
            // 直接从服务器获取机器码显示
            if (window.ChartContainer && typeof window.ChartContainer.InitMachineIDFromServer === 'function') {
                window.ChartContainer.InitMachineIDFromServer((id) => {
                    if (id) this.show(id, container);
                });
            }
        },

        show(deviceId, container) {
            if (!deviceId || !container) return;
            container.innerHTML = `
            <span class="device-id-label">机器码:</span>
            <span class="device-id-value" title="点击复制" onclick="DeviceIdUI.copy('${deviceId}', this)">${deviceId}</span>
            <span class="copy-hint">已复制!</span>
        `;
            container.classList.add('show');
        },

        copy(text, element) {
            navigator.clipboard.writeText(text).then(() => {
                const hint = element.parentElement.querySelector('.copy-hint');
                if (hint) hint.classList.add('show');
                setTimeout(() => hint && hint.classList.remove('show'), 2000);
            }).catch(err => {
                console.warn('[DeviceIdUI] 复制失败:', err);
                // 降级方案
                const textarea = document.createElement('textarea');
                textarea.value = text;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                const hint = element.parentElement.querySelector('.copy-hint');
                if (hint) hint.classList.add('show');
                setTimeout(() => hint && hint.classList.remove('show'), 2000);
            });
        }
    };

    // ========== 弹窗组件 ==========
    const ModalUI = {
        show(title, message, isWarning = false) {
            // 移除旧弹窗
            const old = document.getElementById('ZenNoticeModal');
            if (old) old.remove();

            const modal = document.createElement('div');
            modal.id = 'ZenNoticeModal';
            modal.style = `
                position: fixed; top: 0; left: 0; width: 100%; height: 100%;
                background: rgba(0,0,0,0.6); display: flex; align-items: center;
                justify-content: center; z-index: 100001; backdrop-filter: blur(4px);
                animation: fadeIn 0.3s ease-out;
            `;

            const content = document.createElement('div');
            content.style = `
                background: #fff; width: 90%; max-width: 400px; max-height: 80vh;
                border-radius: 12px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.3);
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
                animation: slideUp 0.3s ease-out;
            `;

            const headerColor = isWarning ? '#f44336' : '#2196f3';
            content.innerHTML = `
                <div style="background: ${headerColor}; padding: 14px; color: #fff; text-align: center; font-size: 16px; font-weight: bold;">
                    ${title}
                </div>
                <div style="padding: 20px; color: #333; line-height: 1.5; text-align: left; font-size: 13px; max-height: 50vh; overflow-y: auto; word-wrap: break-word;">
                    ${message.replace(/\n/g, '<br>')}
                </div>
                <div style="padding: 12px; text-align: center; border-top: 1px solid #eee;">
                    <button id="ZenModalClose" style="
                        background: ${headerColor}; color: #fff; border: none;
                        padding: 8px 28px; border-radius: 6px; cursor: pointer;
                        font-size: 13px; font-weight: bold; transition: opacity 0.2s;
                    ">知道了</button>
                </div>
            `;

            modal.appendChild(content);
            document.body.appendChild(modal);

            document.getElementById('ZenModalClose').onclick = () => {
                modal.style.opacity = '0';
                setTimeout(() => modal.remove(), 200);
            };

            // 添加动画
            const style = document.createElement('style');
            style.innerHTML = `
                @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
                @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
                #ZenModalClose:hover { opacity: 0.9; }
            `;
            document.head.appendChild(style);
        },

        shouldShowToday(id) {
            const now = new Date();
            const today = now.getFullYear() + '-' + (now.getMonth() + 1) + '-' + now.getDate();
            const last = localStorage.getItem('last_notice_' + id);
            if (last === today) return false;
            localStorage.setItem('last_notice_' + id, today);
            return true;
        }
    };

    // ========== Worker 初始化增强 ==========
    function initZenWorker() {
        if (window.zenWorker) return;

        var globalWorkerUrl = "zen_analysis_worker.js";
        window.zenWorker = new Worker(globalWorkerUrl, { type: "module" });

        window.zenWorker.onmessage = function (e) {
            const msg = e.data;

            // Worker 就绪消息 - 触发授权检查
            if (msg.id === 'ready') {
                zenLog('Worker 就绪，触发授权检查');
                // 尝试从 ZenChartCtrl 获取授权检查函数
                var ctrl = window.ChartContainer && window.ChartContainer.ZenChartCtrl;
                if (ctrl && typeof ctrl.CheckLicense === 'function' && !ctrl._licenseChecked) {
                    ctrl._licenseChecked = true;
                    ctrl.CheckLicense();
                    // 启动定时检查（每10秒一次），防止授权到期或文件异常
                    if (!window.__zen_check_timer) {
                        window.__zen_check_timer = setInterval(function() {
                            zenLog('执行周期性授权检查...');
                            ctrl.CheckLicense();
                        }, 10000);
                    }
                }
                return;
            }

            // 授权结果
            if (msg.id === 'auth_result') {
                const { valid, message, expire_ts, expire_str, features, is_trial, days_left, machine_code } = msg.result;
                const safeMessage = (function () {
                    if (!message) return '未授权';
                    var text = String(message);
                    if (text.indexOf('过期') >= 0) return '授权已过期';
                    if (text.indexOf('机器码') >= 0) return '机器码不匹配';
                    if (text.indexOf('无效' ) >= 0 || text.indexOf('失败') >= 0 || text.indexOf('损坏') >= 0) return '授权码无效';
                    if (text.indexOf('试用') >= 0) return '试用提醒';
                    return text;
                })();
                const badge = document.getElementById('LicenseBadge');
                const info = document.getElementById('LicenseInfo');

                if (valid) {
                    var isPermanent = expire_ts === 0;
                    var authTypeText;
                    if (is_trial) {
                        authTypeText = '授权类型：试用，剩余' + days_left + '天';
                    } else if (isPermanent) {
                        authTypeText = '授权类型：永久';
                    } else {
                        authTypeText = '授权类型：正式，剩余' + days_left + '天';
                    }
                    badge.textContent = authTypeText;
                    badge.className = 'LicenseValid';
                    info.innerHTML = '';
                    // 授权成功后初始化设备ID显示
                    DeviceIdUI.init();

                    // 试用期提醒（每日一次）
                    if (is_trial && ModalUI.shouldShowToday('trial')) {
                        ModalUI.show('试用提醒', `这是缠论插件试用证书，还剩 ${days_left} 天到期。\n请联系缠论插件作者 <qhgary@sina.com> 获取正式授权。`);
                    }
                } else {
                    var ec = msg.result.error_code || 0;
                    badge.textContent = _zenErrorBadgeText(ec);
                    badge.className = 'LicenseInvalid';
                    if (machine_code) {
                        info.innerHTML = `${safeMessage || '未授权'} [机器码: ${machine_code}]`;
                    } else {
                        info.innerHTML = safeMessage || '未授权';
                    }
                    // 授权类错误自动弹出授权面板（不弹 ModalUI）
                    if (_zenIsAuthError(ec) && typeof window.showZenAuthPanel === 'function') {
                        window.showZenAuthPanel();
                    }
                }
            }

            // 其他消息透传
            if (msg.id === 'error' || msg.id === 'analyze_result' || msg.id === 'version') {
                window.dispatchEvent(new CustomEvent('zen_message', { detail: msg }));
            }
        };

        window.zenWorker.onerror = function (err) {
            console.error('[Zen] Worker错误:', err);
        };

        var _wkToken = new URLSearchParams(window.location.search).get('token') || '';
        window.zenWorker.postMessage({ id: 'init', token: _wkToken });

        // 【新增】Worker 初始化后，将主线程生成的设备ID同步给 Worker
        // 这确保了 Worker 中的设备ID与主线程一致（即使清空缓存也能保持稳定）
        syncDeviceIdToWorker();
    }

    // 将主线程的设备ID同步到 Worker
    async function syncDeviceIdToWorker() {
        try {
            // 等待主线程的设备ID初始化完成
            const ctrl = window.ChartContainer && window.ChartContainer.ZenChartCtrl;
            if (!ctrl) {
                zenLog('syncDeviceIdToWorker: ZenChartCtrl 未就绪，稍后重试');
                setTimeout(syncDeviceIdToWorker, 1000);
                return;
            }

            // 从主线程的 localStorage 获取设备ID
            const cached = localStorage.getItem('zen_machine_id');
            if (cached && cached.startsWith('zen-')) {
                zenLog('syncDeviceIdToWorker: 同步设备ID到 Worker:', cached);
                window.zenWorker.postMessage({ id: 'set_device_id', deviceId: cached });
            } else {
                // 主线程还没有生成设备ID，触发生成
                zenLog('syncDeviceIdToWorker: 主线程设备ID不存在，触发初始化');
                ctrl.InitMachineID();
                // 等待生成完成后再同步
                setTimeout(async () => {
                    const newId = localStorage.getItem('zen_machine_id');
                    if (newId && window.zenWorker) {
                        zenLog('syncDeviceIdToWorker: 延迟同步设备ID:', newId);
                        window.zenWorker.postMessage({ id: 'set_device_id', deviceId: newId });
                    }
                }, 500);
            }
        } catch (e) {
            console.warn('[Zen] syncDeviceIdToWorker 失败:', e);
        }
    }

    // 页面加载时初始化Worker
    document.addEventListener('DOMContentLoaded', () => {
        setTimeout(function () {
            initZenWorker();
            // 第一次刷新清空全部缓存
            if (window.ChartContainer && window.ChartContainer.ZenChartCtrl) {
                window.ChartContainer.ZenChartCtrl.ClearAnalysisCache();
            }
            // Close button click behavior
            const closeBtn = document.getElementById('BtnAndroidClose');
            if (closeBtn) {
                const tryCloseCurrentTab = () => {
                    // Preferred path for script-opened pages.
                    window.open('', '_self');
                    window.close();

                    // Fallback for browsers that require a navigation step first.
                    setTimeout(() => {
                        window.location.replace('about:blank');
                        window.close();
                    }, 120);
                };

                closeBtn.onclick = async () => {
                    try {
                        if (navigator.sendBeacon) {
                            navigator.sendBeacon('/api/stop?token=' + (new URLSearchParams(window.location.search).get('token') || ''));
                        } else {
                            await fetch('/api/stop', { method: 'POST', keepalive: true, headers: _zenApiHeaders() });
                        }
                    } catch (e) {
                        console.warn('[Zen] Failed to notify backend stop API:', e);
                    } finally {
                        tryCloseCurrentTab();
                    }
                };
            }
        }, 500); // 延迟确保DOM就绪
    });
</script>
<script>
(function() {
    'use strict';
    // SSE 长连接存活检测：通过 EventSource 建立 SSE 连接到 /alive
    // 后端通过连接断开感知页面关闭，不受标签页节流影响
    // 同时检测后端是否已退出：EventSource onerror 触发时更新 badge 并弹窗
    // onerror 可能原因：后端进程退出（连接被拒绝）或网络不可用（连接超时）
    // 通过 navigator.onLine 区分：离线=网络不可用，在线=后台已退出
    var _token = new URLSearchParams(window.location.search).get('token') || '';
    var _aliveUrl = '/alive' + (_token ? '?token=' + encodeURIComponent(_token) : '');
    var _aliveES = new EventSource(_aliveUrl);
    var _sseError = false;
    var _sseErrorTimer = null;

    function _showSSEErrorDialog(verStr, ec) {
        var titleSuffix, msgText;
        if (Number(ec) === 8) {
            titleSuffix = '网络不可用';
            msgText = '当前网络不可用，无法连接到后台服务。\n请检查网络连接后重试。';
        } else {
            titleSuffix = '后台程序已退出';
            msgText = '后台程序已退出，无法继续使用，请重新启动程序。';
        }
        if (typeof ModalUI !== 'undefined') {
            ModalUI.show('禅中看缠 - ' + titleSuffix, msgText, true);
        }
    }

    _aliveES.onerror = function() {
        if (_sseError) return;
        // SSE 断开可能是浏览器后台节流导致，延迟弹窗，给 EventSource 自动重连的机会
        _sseErrorTimer = setTimeout(function() {
            // 3 秒内 SSE 未重连，先探测 Go server 是否还活着（127.0.0.1 本地，不存在网络问题）
            fetch('/api/health', { method: 'HEAD' }).then(function(resp) {
                if (resp.ok) {
                    // Go server 还活着，SSE 只是临时断开，不弹窗，继续等待重连
                    _sseError = false;
                    return;
                }
                throw new Error('health check failed');
            }).catch(function() {
                // Go server 进程已退出
                _sseError = true;
                _zenAuthValid = false;
                var ec = _EC.BACKEND_DOWN;
                _zenAuthErrorCode = ec;
                var badge = document.getElementById('LicenseBadge');
                if (badge) {
                    badge.textContent = _zenErrorBadgeText(ec);
                    badge.className = 'LicenseInvalid';
                }
                var infoElem = document.getElementById('LicenseInfo');
                if (infoElem) {
                    infoElem.textContent = '';
                }
                _showSSEErrorDialog('', ec);
            });
        }, 3000); // 3 秒后仍未重连才探测
    };

    _aliveES.onopen = function() {
        // 重连成功，取消待弹窗和错误状态
        if (_sseErrorTimer) { clearTimeout(_sseErrorTimer); _sseErrorTimer = null; }
        _sseError = false;
    };

    // 监听网络状态变化：网络恢复后，如果弹窗显示的是"网络不可用"，切换为"后台已退出"
    window.addEventListener('online', function() {
        if (_sseError) {
            _zenAuthErrorCode = _EC.BACKEND_DOWN; // 网络恢复后仍连不上 → 后台已退出
            var badge = document.getElementById('LicenseBadge');
            if (badge) {
                badge.textContent = _zenErrorBadgeText(_EC.BACKEND_DOWN);
                badge.className = 'LicenseInvalid';
            }
            var verElem = document.getElementById('AppVersion');
            var verStr = verElem ? verElem.textContent : '';
            _showSSEErrorDialog(verStr, _EC.BACKEND_DOWN);
        }
    });
    // 监听网络断开：如果 SSE 还没报错，主动更新状态
    window.addEventListener('offline', function() {
        if (!_sseError) {
            _sseError = true;
            _zenAuthValid = false;
            _zenAuthErrorCode = _EC.NETWORK_UNAVAILABLE; // 网络不可用
            var badge = document.getElementById('LicenseBadge');
            if (badge) {
                badge.textContent = _zenErrorBadgeText(_EC.NETWORK_UNAVAILABLE);
                badge.className = 'LicenseInvalid';
            }
            var verElem = document.getElementById('AppVersion');
            var verStr = verElem ? verElem.textContent : '';
            _showSSEErrorDialog(verStr, _EC.NETWORK_UNAVAILABLE);
        }
    });

    // onbeforeunload：浏览器即将关闭时关闭 SSE 连接
    // 不发 /api/stop（会误触发刷新），依赖 SSE 断开 + 后端宽限期
    window.addEventListener('beforeunload', function() {
        _aliveES.close();
    });
})();
</script>
