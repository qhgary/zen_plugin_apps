<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:,">
<title>禅中看缠回测工具</title>
<style>
:root{--bg:#0d1117;--panel:#161b22;--border:#30363d;--text:#c9d1d9;--muted:#8b949e;--accent:#58a6ff;--up:#26a69a;--down:#ef5350;--buy:#00e676;--sell:#ff1744}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;overflow:hidden;height:100vh;display:flex;flex-direction:column}
.topbar{background:var(--panel);border-bottom:1px solid var(--border);padding:6px 12px;padding-right:34px;display:flex;align-items:center;gap:12px;flex-shrink:0;flex-wrap:wrap;position:relative}
.topbar h1{font-size:15px;font-weight:600;white-space:nowrap}
.file-btn{background:#1f6feb;border:1px solid #1f6feb;color:#fff;padding:4px 12px;border-radius:6px;cursor:pointer;font-size:12px}
.file-btn:hover{background:#388bfd}
.file-btn input{display:none}
.info{font-size:11px;color:var(--muted)}
.stock-sep{color:var(--border);margin:0 4px}
.btn-close{position:absolute;right:5px;top:50%;transform:translateY(-50%);width:24px;height:24px;line-height:22px;text-align:center;background:#CC0000;color:white;border:none;border-radius:4px;font-size:18px;font-weight:bold;padding:0;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:1000}
.btn-close:hover{background:#e60000}
.layers{display:flex;align-items:center;gap:6px;font-size:11px;flex-wrap:wrap}
.layers label{display:flex;align-items:center;gap:2px;cursor:pointer;padding:2px 6px;border-radius:4px;background:#21262d;border:1px solid var(--border)}
.layers label:hover{background:#30363d}
.layers label .lbl2{display:flex;flex-direction:column;align-items:center;line-height:1.3;text-align:center}
.layers input{accent-color:var(--accent);margin:0}
.layers input:disabled{opacity:.3;cursor:not-allowed}
.layers label:has(input:disabled){opacity:.4;cursor:not-allowed}
.layers label:has(input:disabled):hover{background:#21262d}
.chk-group{display:flex;align-items:center;gap:0}
.chk-group label{border-radius:0}
.chk-group label:first-child{border-radius:4px 0 0 4px}
.chk-group label:last-child{border-radius:0 4px 4px 0}
.chk-group label+.chk-group label{margin-left:-1px}
.no-border-group{display:flex;align-items:center;gap:0}
.no-border-group label{border:none;background:none;padding:2px 4px}
.no-border-group label:hover{background:var(--panel)}
.canvas-wrap{flex:1;position:relative;overflow:hidden;cursor:grab}
.canvas-wrap.grabbing{cursor:grabbing}
canvas{display:block;width:100%;height:100%}
.controls{background:var(--panel);border-top:1px solid var(--border);padding:6px 12px;display:flex;align-items:center;gap:8px;flex-shrink:0;flex-wrap:wrap}
.btn{background:#21262d;border:1px solid var(--border);color:var(--text);padding:4px 10px;border-radius:6px;cursor:pointer;font-size:12px;transition:.15s}
.btn:hover{background:#30363d}
.btn:active{transform:scale(.95)}
.btn.primary{background:#1f6feb;border-color:#1f6feb}
.btn.primary:hover{background:#388bfd}
.btn:disabled{opacity:.4;cursor:not-allowed}
.sel{background:#21262d;border:1px solid var(--border);color:var(--text);padding:3px 6px;border-radius:4px;font-size:11px}
.step-info{font-size:12px;color:var(--accent);min-width:130px;text-align:center;white-space:nowrap}
.btn-sep{width:1px;height:20px;background:var(--border);margin:0 4px}
.mode-group{display:flex;border:1px solid var(--border);border-radius:6px;overflow:hidden}
.mode-radio{display:flex;align-items:center;cursor:pointer}
.mode-radio input{display:none}
.mode-radio span{padding:4px 10px;font-size:12px;background:#21262d;color:var(--muted);transition:.15s}
.mode-radio input:checked + span{background:var(--accent);color:#fff}
.mode-radio span:hover{background:#30363d}
.mode-radio input:checked + span:hover{background:var(--accent)}
.help{font-size:10px;color:var(--muted)}
.layers .info{display:flex;align-items:center}
.mode-label{display:flex;align-items:center;font-size:11px;color:var(--muted);white-space:nowrap}
.mode-input{width:50px;background:#0d1117;border:1px solid var(--border);color:var(--accent);padding:2px 6px;border-radius:4px;font-size:11px;font-family:monospace;text-align:center;outline:none}
.mode-input:focus{border-color:var(--accent)}
.mode-input.invalid{border-color:var(--down);color:var(--down)}
.mode-switches{display:flex;align-items:center;gap:0}
.msw{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:11px;padding:2px 6px;background:#21262d;color:var(--muted);border:1px solid var(--border);transition:.15s;white-space:nowrap;line-height:1.3;cursor:pointer;user-select:none}
.msw:first-child{border-radius:4px 0 0 4px}
.msw:last-child{border-radius:0 4px 4px 0}
.msw:not(:first-child){border-left:none}
.msw.on{background:rgba(88,166,255,.15);color:var(--accent);border-color:var(--accent)}
.msw.on:not(:first-child){border-left:1px solid var(--accent)}
.range-group{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted)}
.range-slider{position:relative;width:200px;height:22px;display:flex;align-items:center}
.range-track{position:relative;width:100%;height:4px;background:#21262d;border-radius:2px;cursor:pointer}
.range-fill{position:absolute;height:4px;background:rgba(88,166,255,.3);border-radius:2px;pointer-events:none}
.range-handle{position:absolute;width:14px;height:14px;border-radius:50%;background:var(--accent);border:2px solid #0d1117;cursor:grab;top:50%;transform:translate(-50%,-50%);z-index:2;box-shadow:0 0 3px rgba(0,0,0,.4)}
.range-handle:hover{background:#79c0ff}
.range-handle.active{background:#79c0ff;box-shadow:0 0 6px rgba(88,166,255,.6)}
.range-handle-label{position:absolute;top:-16px;transform:translateX(-50%);font-size:9px;color:var(--muted);white-space:nowrap;pointer-events:none}
.progress-track{flex:1;min-width:200px;height:16px;display:flex;align-items:center}
.progress-bar{flex:1;height:5px;background:#21262d;border-radius:3px;position:relative;overflow:visible;cursor:pointer}
.progress-range{position:absolute;top:0;height:5px;background:rgba(31,111,235,.15);border-left:1.5px solid #1f6feb;border-right:1.5px solid #1f6feb}
.progress-fill{height:100%;background:#58a6ff;border-radius:3px;width:0%;transition:width .06s linear}
.progress-cursor{position:absolute;top:-3px;width:2px;height:11px;background:#f0883e;border-radius:1px}
.empty-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:var(--muted)}
.empty-overlay .big{font-size:16px;color:var(--text)}
.auth-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:99;display:none}
.auth-overlay.active{display:block}
.auth-panel{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:16px 20px 8px;min-width:400px;max-width:500px;width:auto;z-index:100;box-shadow:0 8px 32px rgba(0,0,0,.5)}
.auth-panel h2{font-size:14px;margin-bottom:10px;color:var(--accent)}
.auth-panel>div{font-size:13px}
.auth-panel .machine-code{font-family:monospace;font-size:12px;margin-bottom:6px;color:var(--text);display:flex;align-items:stretch;gap:8px;line-height:1.3}
.auth-panel .machine-code .mc-label{flex-shrink:0;display:flex;align-items:center}
.auth-panel .machine-code .mc-text{flex:1;min-width:0;display:flex;align-items:center;background:#0d1117;border:1px solid var(--border);padding:6px 10px;border-radius:4px;word-break:break-all}
.auth-panel .machine-code .mc-copy-btn{font-size:10px;padding:4px 0;background:#21262d;color:#ccc;border:1px solid var(--border);border-radius:3px;cursor:pointer;flex-shrink:0;width:64px;text-align:center}
.auth-panel .machine-code .mc-copy-btn:hover{background:#30363d}
.auth-panel .contact-row{display:flex;align-items:stretch;gap:8px;margin-bottom:6px;line-height:1.3}
.auth-panel .contact-row .contact-text{flex:1;min-width:0;font-size:12px;color:#fff;display:flex;align-items:center}
.auth-panel .contact-row .copy-email-btn{font-size:10px;padding:4px 0;background:#21262d;color:#ccc;border:1px solid var(--border);border-radius:3px;cursor:pointer;flex-shrink:0;width:64px;text-align:center}
.auth-panel .contact-row .copy-email-btn:hover{background:#30363d}
.auth-panel .auth-status-info{font-size:12px;margin-bottom:6px;padding:2px 0;display:flex;align-items:center;justify-content:center;gap:12px;white-space:nowrap;line-height:1.3}
.auth-panel .auth-status-info .sep{color:var(--muted)}
.auth-panel .auth-status-info .zen-expired{color:var(--sell)}
.auth-panel textarea{width:100%;height:112px;background:#0d1117;border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:4px;font-size:11px;margin-bottom:0;resize:vertical;font-family:monospace;box-sizing:border-box;line-height:1.3}
.auth-panel .auth-buttons{display:flex;gap:10px;justify-content:center;margin-top:8px;margin-bottom:0}
.auth-panel .auth-btn{background:#1f6feb;border:1px solid #1f6feb;color:#fff;padding:6px 0;border-radius:6px;cursor:pointer;font-size:12px;flex:1;max-width:100px;text-align:center}
.auth-panel .auth-btn:hover{background:#388bfd}
.auth-panel .auth-btn.cancel-btn{background:#333;border:1px solid #555;color:#ccc}
.auth-panel .auth-btn.cancel-btn:hover{background:#444}
.auth-panel .trial-info{font-size:11px;color:var(--muted);margin-top:6px;text-align:center;line-height:1.3}
.auth-panel .error-msg:empty{display:none}.auth-panel .error-msg{color:var(--sell);font-size:11px;margin-top:2px;margin-bottom:2px;line-height:1.3}
.trade-bar{background:var(--panel);border-top:1px solid var(--border);padding:6px 12px;display:flex;align-items:center;gap:6px;flex-shrink:0;flex-wrap:wrap}
.tier-btn{background:#21262d;border:1px solid var(--border);color:var(--text);padding:3px 8px;border-radius:4px;cursor:pointer;font-size:11px;transition:.15s}
.tier-btn:hover{background:#30363d}
.tier-btn:active{transform:scale(.95)}
.tier-btn:disabled{opacity:.4;cursor:not-allowed}
.tier-btn.buy{background:#3d0d0d;border-color:#ff1744;color:#ff1744}
.tier-btn.buy:hover{background:#4d1a1a}
.tier-btn.buy:disabled{opacity:.4;cursor:not-allowed}
.tier-btn.sell{background:#0d3320;border-color:#00e676;color:#00e676}
.tier-btn.sell:hover{background:#1a4a30}
.tier-btn.sell:disabled{opacity:.4;cursor:not-allowed}
.trade-info{font-size:11px;color:var(--muted);white-space:nowrap}
.trade-info b{color:var(--text);font-weight:600;font-family:monospace}
.profit{color:#ef5350!important}
.loss{color:#26a69a!important}
.trade-ctx-menu{position:absolute;background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:4px;display:flex;gap:4px;z-index:200;box-shadow:0 4px 16px rgba(0,0,0,.5)}
.trade-ctx-menu button{padding:4px 10px;border-radius:4px;font-size:11px;cursor:pointer;border:1px solid var(--border);background:#21262d;color:var(--text);white-space:nowrap}
.trade-ctx-menu button.del{background:#3d0d0d;border-color:var(--sell);color:var(--sell)}
.trade-ctx-menu button.del:hover{background:#4d1a1a}
.trade-ctx-menu button.cancel:hover{background:#30363d}
.stroke-info{position:absolute;background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:4px 10px;z-index:200;box-shadow:0 4px 16px rgba(0,0,0,.5);font-size:11px;color:var(--text);white-space:nowrap;pointer-events:none}
.stroke-info .si-label{color:var(--muted);margin-right:4px}
.stroke-info .si-num{color:var(--accent);font-weight:bold;font-family:monospace}
</style>
</head>
<body>

<div class="topbar">
  <!-- 禅中看缠回测工具：需要 0.4.0 及以上版本内核 -->
  <h1 id="app-title" style="white-space:nowrap">禅中看缠回测工具 <span id="app-version"></span></h1>
  <span class="info" id="auth-status" style="color:#fa0">授权检查中...</span>
  <button class="btn" id="btn-auth">授权</button>
  <label class="file-btn">📂 加载数据<input type="file" id="file-input" accept=".txt"></label>
  <span class="info" id="data-info" style="white-space:nowrap">未加载数据</span>
  <span class="info" id="stock-info" style="margin-left:0"></span>
  <span class="info" style="color:var(--border)">|</span>
  <span class="info" id="k-info" style="color:#58a6ff;font-family:monospace;white-space:nowrap;margin-left:auto"></span>
  <button class="btn-close" id="btn-close" title="退出">×</button>
</div>

<div class="layers" style="background:var(--panel);border-bottom:1px solid var(--border);padding:4px 12px;flex-wrap:wrap">
  <div class="no-border-group">
  <label title="勾选显示经包含关系合并后的缠论K线，取消则显示原始K线"><input type="checkbox" id="L-kline" checked>缠K</label>
  <label title="勾选显示顶底分型，取消则隐藏"><input type="checkbox" id="L-fractal">分型</label>
  <label title="勾选显示笔，取消则隐藏"><input type="checkbox" id="L-stroke" checked>笔</label>
  <label title="勾选在笔端点显示价格标签，与可见区最高/最低点重叠的不显示。受笔开关联动：笔未勾选时此项禁用（默认关闭）"><input type="checkbox" id="L-strokeprice"><span class="lbl2"><span>笔端点</span><span>价格</span></span></label>
  <label title="勾选显示笔级别中枢，取消则隐藏"><input type="checkbox" id="L-pivot" checked>笔中枢</label>
  <label title="勾选显示线段，取消则隐藏"><input type="checkbox" id="L-segment" checked>线段</label>
  <label title="勾选显示线段级别中枢，取消则隐藏"><input type="checkbox" id="L-segpivot" checked><span class="lbl2"><span>线段</span><span>中枢</span></span></label>
  <label title="勾选显示MACD背离，取消则隐藏"><input type="checkbox" id="L-macd" checked><span class="lbl2"><span>MACD</span><span>背离</span></span></label>
  <label title="勾选显示缠论各类买卖点，取消则隐藏"><input type="checkbox" id="L-tp" checked><span class="lbl2"><span>缠论</span><span>BS点</span></span></label>
  <label title="勾选显示中枢背驰，取消则隐藏"><input type="checkbox" id="L-div" checked><span class="lbl2"><span>中枢</span><span>背驰</span></span></label>
  </div>
  <div class="btn-sep"></div>
  <span class="mode-label" title="通达信模式值（9000+位掩码），编码下方各识别开关，修改开关自动同步">通达信MODE值：</span>
  <input type="text" id="mode-input" class="mode-input" value="9004" maxlength="4" inputmode="numeric">
    <span class="mode-switches" id="mode-switches">
<span class="msw" data-bit="1" title="缺口且彻底破坏前一笔方向时，不受最少K线数限制直接成笔"><span>缺口</span><span>成笔</span></span>
<span class="msw" data-bit="2" title="缠论第62课+第77课：顶底极点之间原始K线≥3且顶底分型不共用K线（独立K线≥4）即可成笔，不要求独立K线≥5"><span>新笔</span><span>成笔</span></span>
<span class="msw" data-bit="4" title="后续笔回落进中枢区间时延伸本体而非新建中枢"><span>中枢</span><span>拓展</span></span>
<span class="msw" data-bit="8" title="相邻同向中枢合并为更大中枢（自动启用拓展）"><span>中枢</span><span>扩张</span></span>
<span class="msw" data-bit="16" title="开启后笔中枢的延伸/扩张可跨越线段边界进行（信号更少）；关闭时则只能在线段内进行（推荐关闭）"><span>允许</span><span>跨界</span></span>
  </span>
  <div class="btn-sep"></div>
  <div class="no-border-group">
  <label title="勾选显示5/10/20/34/60日均线，取消则隐藏"><input type="checkbox" id="L-ma" checked>均线</label>
  <label title="勾选显示成交额(元)，取消则隐藏"><input type="checkbox" id="L-amount">成交额</label>
  <label title="勾选显示成交量(手)，取消则隐藏"><input type="checkbox" id="L-vol" checked>成交量</label>
  </div>
  <div class="btn-sep" style="margin-left:auto"></div>
  <span class="info" id="layer-info" style="color:#8b949e;font-family:monospace;text-align:right;line-height:1.3"></span>
</div>

<div class="canvas-wrap" id="cv-wrap">
  <canvas id="cv"></canvas>
  <div class="trade-ctx-menu" id="trade-ctx-menu" style="display:none">
<button class="del" id="trade-ctx-del">删除此交易</button>
<button class="cancel" id="trade-ctx-cancel">取消</button>
</div>
<div class="stroke-info" id="stroke-info" style="display:none">
<span class="si-label" id="si-label">笔</span><span class="si-num" id="si-num">0</span>
</div>
<div class="empty-overlay" id="empty">
    <div>点击「加载数据」选择 .txt 数据文件（通达信导出的 txt 数据格式）</div>
  </div>
  <div class="auth-overlay" id="auth-overlay"></div>
  <div class="auth-panel" id="auth-panel" style="display:none">
    <h2>🔐 授权验证</h2>
    <div class="machine-code" id="machine-code"><span class="mc-label">机器码：</span><span class="mc-text">获取中...</span><button class="mc-copy-btn" id="btn-copy-mc">复制机器码</button></div>
    <div class="auth-status-info" id="auth-status-info" style="display:none"></div>
    <div class="contact-row"><span class="contact-text">联系缠论插件作者获取授权码: qhgary@sina.com</span><button class="copy-email-btn" id="btn-copy-email">复制邮箱</button></div>
    <textarea id="license-input" placeholder="请粘贴授权内容..."></textarea>
    <div class="error-msg" id="auth-error"></div>
    <div class="auth-buttons">
      <button class="auth-btn" id="btn-activate">关闭</button>
    </div>
    <div class="trial-info" id="trial-info"></div>
  </div>
</div>

<div class="trade-bar">
  <span class="trade-info">买入</span>
  <button class="tier-btn buy" id="btn-buy-25" disabled title="投入总资金的 25% 买入，总仓位上限 100%">25%</button>
  <button class="tier-btn buy" id="btn-buy-50" disabled title="投入总资金的 50% 买入，总仓位上限 100%">50%</button>
  <button class="tier-btn buy" id="btn-buy-100" disabled title="投入总资金的 100% 买入，总仓位上限 100%">100%</button>
  <div class="btn-sep"></div>
  <span class="trade-info">卖出</span>
  <button class="tier-btn sell" id="btn-sell-25" disabled title="减仓总资金的 25%，不可超过当前仓位">25%</button>
  <button class="tier-btn sell" id="btn-sell-50" disabled title="减仓总资金的 50%，不可超过当前仓位">50%</button>
  <button class="tier-btn sell" id="btn-sell-100" disabled title="清空全部持仓（卖出当前全部仓位）">100%</button>
  <div class="btn-sep"></div>
  <button class="btn" id="btn-clear" disabled title="一次性清空全部持仓，相当于按当前价格全部卖出">清仓</button>
  <button class="btn" id="btn-reset-trade" disabled title="清空所有交易记录，仓位归零，资金恢复初始值">重置</button>
  <div class="btn-sep"></div>
  <span class="trade-info">投入<b id="pos-pct">0%</b></span>
  <span class="trade-info">当前收益<b id="pos-unrealized" class="profit">+0.00%</b></span>
  <span class="trade-info">总收益<b id="pos-total-return" class="profit">+0.00%</b></span>
  <span class="help">（点击买卖标记可删除 | 双击笔/线段显示编号）</span>
</div>

<div class="controls">
  <button class="btn" id="btn-first" title="跳到起点" disabled>⏮</button>
  <button class="btn" id="btn-prev" title="上一步 (←)" disabled>◀◀</button>
  <button class="btn primary" id="btn-play" title="播放/暂停 (空格)" disabled>▶</button>
  <button class="btn" id="btn-next" title="下一步 (→)" disabled>▶▶</button>
  <button class="btn" id="btn-last" title="跳到终点" disabled>⏭</button>
  <div class="step-info"><span id="cur-step">0</span>/<span id="total-steps">0</span> (K0为起点)</div>
  <div class="btn-sep"></div>
  <div class="mode-group">
    <label class="mode-radio" title="逐根推送K线增量识别，注重局部最优和当下性，已确认将不可被更改，适合回测"><input type="radio" name="analyze-mode" value="streaming" checked><span>逐根推送</span></label>
    <label class="mode-radio" title="一次性读取全部K线统一分析，注重全局最优"><input type="radio" name="analyze-mode" value="batch"><span>整体推送</span></label>
  </div>

<script src="zen_error_codes.js"></script>
<script>
// ====== 版本号（各端独立维护）======
var ZEN_REPLAY_VERSION = "1.3";
// 设置初始版本号显示（内核版本由 WASM 返回后追加）
document.addEventListener('DOMContentLoaded', function() {
    var el = document.getElementById('app-version');
    if (el) el.textContent = 'V' + ZEN_REPLAY_VERSION;
});
// ====== 全局状态 ======
let wasmReady = false;
let authValid = false;
let backendDown = false;  // 标记后台服务器是否已退出（网络不可达）
let _zenAuthErrorCode = 0; // 当前错误码
let _zenAuthPanelDismissed = false; // 用户手动关闭授权面板后设为 true，定时检查不再自动弹出
let _zenCheckTimer = null;      // 10 秒定时授权检查定时器

// ====== 安全 Token ======
// 从 URL 查询参数中提取 serverToken，用于 API 认证
// 防止本机其他进程或恶意网站未授权调用 API
const _serverToken = new URLSearchParams(window.location.search).get('token') || '';
function _apiUrl(path) {
  return path + (path.includes('?') ? '&' : '?') + 'token=' + encodeURIComponent(_serverToken);
}
function _apiHeaders(extra) {
  return Object.assign({ 'X-Zen-Token': _serverToken }, extra || {});
}

// ====== Badge 辅助函数（_EC / _zenErrorBadgeText / _zenIsAuthError / _zenErrMsg 已由 zen_error_codes.js 提供）======
// 更新 auth-status badge 显示
function _setAuthBadge(ec, customText) {
  _zenAuthErrorCode = Number(ec) || 0;
  const el = document.getElementById('auth-status');
  if (!el) return;
  el.textContent = customText || _zenErrorBadgeText(ec);
  el.style.color = '#ef5350';
}
// 自动弹出授权面板（模拟点击授权按钮）
// 如果用户已手动关闭面板（_zenAuthPanelDismissed=true），则不再自动弹出
function _zenAutoShowAuthPanel(machineCode, authResult) {
  if (_zenAuthPanelDismissed) return;
  const panel = document.getElementById('auth-panel');
  if (!panel || panel.style.display === 'block') return;
  // 优先直接显示面板并展示当前授权错误信息，避免走 btn-auth 的异步流程只回显旧授权
  showAuthPanel(machineCode || '', null, authResult || null);
  // 异步获取机器码和已保存的授权码，如果有授权码则自动触发一次解码以显示 auth-error
  fetch(_apiUrl('/api/auth/status'), { headers: _apiHeaders() })
    .then(r => r.json())
    .then(data => {
      if (data && data.machine_code) {
        var mcT = document.querySelector('#machine-code .mc-text');
        if (mcT) mcT.textContent = data.machine_code;
        var cpBtn = document.getElementById('btn-copy-mc');
        if (cpBtn) cpBtn.dataset.machineCode = data.machine_code;
      }
      // 回显已有授权码并触发解码，让 auth-error 显示验证结果
      if (data && data.license_key) {
        document.getElementById('license-input').value = _smartExtractKey(data.license_key);
        _decodeLicenseKey(false);
      }
    })
    .catch(() => {});
}
// 10 秒定时授权检查（与 desktop/apk 一致）
// 定时检查授权状态，授权失败时更新 badge 并按需弹面板
// 如果用户已手动关闭面板，则不再自动弹出
function startAuthCheckTimer() {
  if (_zenCheckTimer) clearInterval(_zenCheckTimer);
  _zenCheckTimer = setInterval(async () => {
    if (!wasmReady || !wasmModule) return;
    try {
      const nonce = Math.random().toString(36).substring(2) + Date.now().toString(36);
      const resp = await fetch(_apiUrl('/api/auth/session'), {
        method: 'POST',
        headers: _apiHeaders({ 'Content-Type': 'application/json' }),
        body: JSON.stringify({ nonce, app_id: 'tdx_zen', platform: 'replay' })
      });
      const data = await resp.json();
      if (data && data.success && data.auth_result && data.auth_result.valid) {
        // 授权有效（可能用户在外部更新了 license）
        if (!authValid) {
          authValid = true;
          _zenAuthPanelDismissed = false;
          hideAuthPanel();
          if (wasmModule && data.attestation) {
            wasmModule.init_auth_attestation(data.attestation, nonce, 'tdx_zen', 'replay');
            enableControls();
            startAuthRefreshTimer();
          }
          formatAuthStatus(data.auth_result);
        }
      } else {
        // 授权不通过
        const ec = (data && data.auth_result) ? (data.auth_result.error_code || 0) : 0;
        if (authValid) {
          authValid = false;
          disablePlaybackControls();
        }
        _setAuthBadge(ec);
        if (_zenIsAuthError(ec)) {
          _zenAutoShowAuthPanel(data && data.machine_code, data && data.auth_result);
        }
      }
      backendDown = false;
    } catch (e) {
      // 网络错误：后台服务器可能已退出或网络不可用
      if (authValid) {
        authValid = false;
        disablePlaybackControls();
      }
      backendDown = true;
      _setAuthBadge(navigator.onLine ? _EC.BACKEND_DOWN : _EC.NETWORK_UNAVAILABLE);
    }
  }, 10000);
}
// 从可能包含格式化边框/标题的文本中提取纯授权码（与 Rust smart_extract_key 逻辑一致）
// 授权文件中可能存储的是带 === 边框的完整文本，这里只提取 Base64 那一行
function _smartExtractKey(input) {
  if (!input) return '';
  var lines = input.split(/\r?\n/).map(function(l) { return l.trim(); }).filter(function(l) { return l.length > 0; });
  if (lines.length === 0) return '';
  var bestLine = '';
  var maxLen = 0;
  for (var i = 0; i < lines.length; i++) {
    var line = lines[i];
    // 跳过装饰行（主要是 = - * # 字符）
    var decorCount = (line.match(/[=\-*#]/g) || []).length;
    if (decorCount > line.length / 2) continue;
    // 跳过元数据行
    var lower = line.toLowerCase();
    if (lower.indexOf('key for') >= 0 || lower.indexOf('device:') >= 0 ||
        lower.indexOf('features:') >= 0 || lower.indexOf('valid:') >= 0 ||
        lower.indexOf('expires:') >= 0 || lower.indexOf('type:') >= 0 ||
        lower.indexOf('user:') >= 0) continue;
    // 选最长的有效行
    if (line.length > maxLen) {
      maxLen = line.length;
      bestLine = line;
    }
  }
  // 去除所有空白字符
  return bestLine.replace(/\s/g, '');
}
let allKlines = [];     // 全部 K 线原始数据 [{d,o,h,l,c}]
let snapshots = [];     // 逐根推送后的快照数组
let rangeStart = 0, rangeEnd = 0, currentStep = 0;
let playing = false, playTimer = null, speed = 5;
let panOffset = 0;
let currentMode = 'streaming';
let batchFullSnap = null;
let batchKlineCount = 0;
let tdxMode = 9004;  // 通达信 MODE 值（9000-9031），控制缺口/新笔/拓展/扩张/跨界

let KW = 5;       // K-line width (spacing). Default smaller for more bars per screen.
let BAR_W = 5;    // K-line body width, derived from KW (≈2/3 of KW).
const PAD_L = 56, PAD_R = 8, PAD_T = 8;
let PAD_B = 80; // 数据含成交量时 80（底部量能区26px，辅助显示不喧宾夺主），不含时收缩为 28

const canvas = document.getElementById('cv');
const ctx = canvas.getContext('2d');
const cvWrap = document.getElementById('cv-wrap');
const dpr = window.devicePixelRatio || 1;

// 图层开关
const layers = {};
['ma','amount','vol','kline','fractal','stroke','strokeprice','segment','pivot','segpivot','tp','div','macd'].forEach(k => {
  const el = document.getElementById('L-' + k);
  if (!el) { layers[k] = false; return; }
  layers[k] = el.checked;
  el.addEventListener('change', () => {
    layers[k] = el.checked;
    // amount 与 vol 互斥：勾选一个自动取消另一个
    if (k === 'amount' && el.checked) {
      const volEl = document.getElementById('L-vol');
      if (volEl && volEl.checked) { volEl.checked = false; layers.vol = false; }
    } else if (k === 'vol' && el.checked) {
      const amtEl = document.getElementById('L-amount');
      if (amtEl && amtEl.checked) { amtEl.checked = false; layers.amount = false; }
    }
    // 笔联动笔端点价格：笔取消时 disable 笔端点价格（不清空状态），笔勾选时恢复
    if (k === 'stroke') {
      const spEl = document.getElementById('L-strokeprice');
      if (spEl) {
        spEl.disabled = !el.checked;
        if (el.checked) {
          // 恢复笔端点价格到保存的状态
          spEl.checked = layers.strokeprice !== undefined ? layers.strokeprice : spEl.checked;
        }
      }
    }
    // 量能/成交额开关影响 PAD_B，需要重算 canvas 尺寸
    if (k === 'amount' || k === 'vol') {
      const hasVolData = allKlines.some(kk => kk.v > 0);
      const hasAmtData = allKlines.some(kk => kk.a > 0);
      const showVol = (layers.vol && hasVolData) || (layers.amount && hasAmtData);
      PAD_B = showVol ? 80 : 28;
      resizeCanvas();
    } else {
      draw();
    }
    _saveZenConfig();
  });
});

// ====== MODE 输入框 ======
const modeInput = document.getElementById('mode-input');
// 根据 tdxMode 更新开关指示器
function updateModeSwitches(mode) {
  const bits = (mode || tdxMode) - 9000;
  document.querySelectorAll('#mode-switches .msw').forEach(el => {
    const bit = parseInt(el.dataset.bit);
    if (bits & bit) el.classList.add('on');
    else el.classList.remove('on');
  });
}
// 输入时：只允许数字，最多4位，填满4位且有效时自动应用
modeInput.addEventListener('input', async () => {
  // 过滤非数字字符，截断到4位
  modeInput.value = modeInput.value.replace(/\D/g, '').slice(0, 4);
  const v = modeInput.value;
  if (v.length < 4) {
    // 不足4位：不应用，移除错误样式
    modeInput.classList.remove('invalid');
    return;
  }
  // 满4位：校验范围
  const n = parseInt(v);
  if (n < 9000 || n > 9031) {
    modeInput.classList.add('invalid');
    return;
  }
  modeInput.classList.remove('invalid');
  // 有效且与当前值不同：自动应用
    if (n !== tdxMode) {
    tdxMode = n;
    updateModeSwitches();
    _saveZenConfig();
    if (allKlines.length > 0) {
      // 保持当前位置不变，只更新分析结果
      const savedStep = currentStep;
      const savedPan = panOffset;
      await analyzeRange();
      currentStep = Math.min(savedStep, getTotalSteps());
      panOffset = savedPan;
      clampPan();
      draw();
      updateStats();
    }
  }
});
// 失焦时：如果不足4位或无效，回退到上次有效值
modeInput.addEventListener('blur', () => {
  const v = modeInput.value;
  const n = parseInt(v);
  if (v.length < 4 || n < 9000 || n > 9031) {
    modeInput.value = String(tdxMode);
    modeInput.classList.remove('invalid');
    updateModeSwitches();
  }
});
// 阻止非数字按键（允许退格、删除、方向键等控制键）
modeInput.addEventListener('keydown', (e) => {
  if (e.ctrlKey || e.metaKey) return; // 允许复制粘贴等快捷键
  if (e.key.length === 1 && !/\d/.test(e.key)) e.preventDefault();
});
// 初始化开关指示器
updateModeSwitches();
// 点击开关按钮：切换对应位，与 MODE 值联动
document.querySelectorAll('#mode-switches .msw').forEach(el => {
  el.addEventListener('click', async () => {
    const bit = parseInt(el.dataset.bit);
    let newMode = 9000 + ((tdxMode - 9000) ^ bit);

    // 中枢扩张(bit3=8)联动逻辑（与 desktop/apk 前端一致）：
    // - 打开扩张时，如果拓展(bit2=4)未开，自动打开拓展
    // - 关闭拓展时，自动关闭扩张（扩张依赖拓展）
    // - 打开扩张时拓展已开，不影响拓展状态
    // - 关闭扩张不影响拓展状态
    const BIT_MERGE = 4, BIT_EXPAND = 8;
    const oldBits = tdxMode - 9000;
    const newBits = newMode - 9000;
    // 拓展从开→关：自动关闭扩张
    if ((oldBits & BIT_MERGE) && !(newBits & BIT_MERGE) && (newBits & BIT_EXPAND)) {
      newMode = 9000 + (newBits & ~BIT_EXPAND);
    }
    // 扩张从关→开：自动打开拓展
    if (!(oldBits & BIT_EXPAND) && (newBits & BIT_EXPAND) && !(newBits & BIT_MERGE)) {
      newMode = 9000 + (newBits | BIT_MERGE);
    }

    tdxMode = newMode;
    modeInput.value = String(newMode);
    modeInput.classList.remove('invalid');
    updateModeSwitches();
    _saveZenConfig();
    if (allKlines.length > 0) {
      // 保持当前位置不变，只更新分析结果
      const savedStep = currentStep;
      const savedPan = panOffset;
      await analyzeRange();
      currentStep = Math.min(savedStep, getTotalSteps());
      panOffset = savedPan;
      clampPan();
      draw();
      updateStats();
    }
  });
});

// ====== 模式辅助函数 ======
function getTotalSteps() {
  if (currentMode === 'batch') return Math.max(0, batchKlineCount - 1);
  return Math.max(0, snapshots.length - 1);
}
function hasData() {
  if (currentMode === 'batch') return batchFullSnap !== null;
  return snapshots.length > 0;
}
function getCurrentSnapshot() {
if (currentMode === 'batch' && batchFullSnap) {
// 整体推送模式：直接返回完整分析结果，不做逐步截取
return batchFullSnap;
}
return snapshots[currentStep];
}
function resizeCanvas() {
  canvas.width = cvWrap.clientWidth * dpr;
  canvas.height = cvWrap.clientHeight * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (allKlines.length > 0) draw();
}
window.addEventListener('resize', resizeCanvas);

// ====== SSE 长连接存活检测 ======
// 通过 EventSource 建立 SSE 长连接，后端通过连接断开感知页面关闭。
// 不受浏览器标签页节流影响——TCP 连接由 OS 维持，不依赖 JS 定时器。
// 同时检测后端是否已退出：EventSource onerror 触发时弹窗提示
// onerror 可能原因：后端进程退出（连接被拒绝）或网络不可用（连接超时）
// 通过 navigator.onLine 区分：离线=网络不可用，在线=后台已退出
(function() {
  var _aliveES = new EventSource(_apiUrl('/alive'));
  var _sseError = false;
  var _sseErrorTimer = null;
  _aliveES.onerror = function() {
    if (_sseError) return;
    // SSE 断开可能是浏览器后台节流导致，延迟弹窗，给 EventSource 自动重连的机会
    _sseErrorTimer = setTimeout(function() {
      // 3 秒内 SSE 未重连，先探测 Go server 是否还活着（127.0.0.1 本地，不存在网络问题）
      fetch(_apiUrl('/api/health'), { method: 'HEAD' }).then(function(resp) {
        if (resp.ok) {
          // Go server 还活着，SSE 只是临时断开，不弹窗，继续等待重连
          _sseError = false;
          return;
        }
        throw new Error('health check failed');
      }).catch(function() {
        // Go server 进程已退出
        _sseError = true;
        authValid = false;
        disablePlaybackControls();
        _setAuthBadge(_EC.BACKEND_DOWN);
        _showErrorDialog('', _EC.BACKEND_DOWN);
      });
    }, 3000); // 3 秒后仍未重连才探测
  };
  _aliveES.onopen = function() {
    // 重连成功，取消待弹窗和错误状态
    if (_sseErrorTimer) { clearTimeout(_sseErrorTimer); _sseErrorTimer = null; }
    _sseError = false;
  };
  // 监听网络状态变化：网络恢复后，如果弹窗显示的是"网络不可用"，切换为"后台已退出"
  window.addEventListener('online', function() {
    if (_sseError) {
      var oldModal = document.getElementById('ZenNoticeModal');
      if (oldModal) oldModal.remove();
      _setAuthBadge(_EC.BACKEND_DOWN); // 网络恢复后仍连不上 → 后台已退出
      _showErrorDialog('', _EC.BACKEND_DOWN);
    }
  });
  // 监听网络断开：如果 SSE 还没报错，主动更新状态
  window.addEventListener('offline', function() {
    if (!_sseError) {
      _sseError = true;
      authValid = false;
      disablePlaybackControls();
      _setAuthBadge(_EC.NETWORK_UNAVAILABLE); // 网络不可用
      var ver = (document.getElementById('app-version') || {}).textContent || '';
      _showErrorDialog(ver, _EC.NETWORK_UNAVAILABLE);
    }
  });
  window.addEventListener('beforeunload', function() {
    _aliveES.close();
  });
})();

// ====== 统一弹窗组件（与 Desktop 版样式一致）======
// 根据错误码动态显示对应的标题和消息

    '<div style="padding:12px;text-align:center;border-top:1px solid #eee;"><button id="ZenModalClose" style="background:' + bgColor + ';color:#fff;border:none;padding:8px 28px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:bold;transition:opacity 0.2s;">知道了</button></div>';

  document.head.appendChild(style);

// ====== WASM 加载 ======
let wasmModule = null;

async function initWasm() {
  try {
    const wasm = await import('./pkg/tdx_zen.js');
    await wasm.default();
    wasmModule = wasm;
    wasmReady = true;
    // 显示内核版本号（与桌面版格式一致）
    try {
      const ver = wasm.get_plugin_version();

      var verElem = document.getElementById('app-version');
      if (verElem) verElem.textContent = verElem.textContent + ' (' + ver + ')';
    } catch (e) { /* 忽略版本获取失败 */ }
    initAuth();
  } catch (err) {
    console.error('[replay] WASM load failed:', err);
    document.getElementById('empty').innerHTML = '<div class="big">❌ WASM 加载失败</div><div>' + err.message + '</div>';
  }

// ====== 主动令牌刷新 ======
// WASM 内部令牌和 attestation 均有 60 秒 TTL，
// 用户暂停超过 60 秒后重新操作会导致令牌过期。
// 此定时器每 50 秒主动刷新 attestation，确保令牌不过期。
let authRefreshTimer = null;
function startAuthRefreshTimer() {
  if (authRefreshTimer) clearInterval(authRefreshTimer);
  authRefreshTimer = setInterval(async () => {
    if (!wasmReady || !wasmModule || !authValid) return;
    try {
      const nonce = Math.random().toString(36).substring(2) + Date.now().toString(36);
      const resp = await fetch(_apiUrl('/api/auth/session'), {
        method: 'POST',
        headers: _apiHeaders({ 'Content-Type': 'application/json' }),
        body: JSON.stringify({ nonce, app_id: 'tdx_zen', platform: 'replay' })
      });
      const data = await resp.json();
      if (data && data.success && data.attestation) {
        const ar = wasmModule.init_auth_attestation(data.attestation, nonce, 'tdx_zen', 'replay');
        if (!ar || !ar.valid) {
          console.warn('[replay] 主动刷新令牌：attestation 验证失败', ar);
        }
      }
      // 请求成功，后台存活
      backendDown = false;
      // 如果之前是后台退出状态，恢复授权状态显示
      if (_zenAuthErrorCode === _EC.BACKEND_DOWN) {
        _zenAuthErrorCode = _EC.NONE;
        const el = document.getElementById('auth-status');
        if (el && authValid) {
          el.textContent = '授权有效';
          el.style.color = '#26a69a';
        }
      }
    } catch (e) {
      // 网络错误：后台服务器可能已退出或网络不可用
      backendDown = true;
      console.warn('[replay] 主动刷新令牌异常（后台可能已退出）:', e.message);
      _setAuthBadge(navigator.onLine ? _EC.BACKEND_DOWN : _EC.NETWORK_UNAVAILABLE);
    }
  }, 50000); // 50秒刷新一次，留 10 秒余量
}

// ====== 授权流程 ======
// 格式化授权状态显示（与桌面版格式一致）
function formatAuthStatus(ar) {

  var statusEl = document.getElementById('auth-status');
  if (ar.is_trial) {

  }
}

// 启动时静默检查授权（试用/正式），不弹窗
async function initAuth() {
  try {
    // 1. 先尝试 session（包含试用检查）
    const nonce = Math.random().toString(36).substring(2) + Date.now().toString(36);
    const sessionResp = await fetch(_apiUrl('/api/auth/session'), {
      method: 'POST',
      headers: _apiHeaders({ 'Content-Type': 'application/json' }),
      body: JSON.stringify({ nonce, app_id: 'tdx_zen', platform: 'replay' })
    });
    const sessionData = await sessionResp.json();

    if (sessionData && sessionData.success && sessionData.auth_result && sessionData.auth_result.valid) {
      // 试用或正式授权通过
      authValid = true;
      _zenAuthPanelDismissed = false;
      hideAuthPanel();
      // 初始化 WASM 授权
      if (wasmModule && sessionData.attestation) {
        wasmModule.init_auth_attestation(sessionData.attestation, nonce, 'tdx_zen', 'replay');
        enableControls();
        // 启动主动令牌刷新，防止 60 秒 TTL 过期
        startAuthRefreshTimer();
      }
      // 显示授权状态
      formatAuthStatus(sessionData.auth_result);
      // 启动 10 秒定时授权检查（与 desktop/apk 一致）
      startAuthCheckTimer();
      return;
    }

    // 2. 授权不通过，显示提示和授权按钮（不弹窗）
    const ec = (sessionData && sessionData.auth_result) ? (sessionData.auth_result.error_code || 0) : 0;
    _setAuthBadge(ec);
    // 授权类错误自动弹出授权面板
    if (_zenIsAuthError(ec)) {
      _zenAutoShowAuthPanel(sessionData && sessionData.machine_code);
    }
    // 启动 10 秒定时授权检查（与 desktop/apk 一致）
    startAuthCheckTimer();
    return;
  } catch (err) {
    // 区分网络错误（后台退出/网络不可用）与真正的授权失败
    if (err instanceof TypeError && (err.message.includes('Failed to fetch') || err.message.includes('NetworkError'))) {
      backendDown = true;
      _setAuthBadge(navigator.onLine ? _EC.BACKEND_DOWN : _EC.NETWORK_UNAVAILABLE);
    } else {
      _setAuthBadge(_EC.NONE, '授权服务连接失败: ' + err.message);
      // 非网络错误，可能是授权问题，自动弹授权面板
      _zenAutoShowAuthPanel();
    }
    // 即使初始检查失败也启动定时检查，授权恢复后可自动检测到
    startAuthCheckTimer();
  }
}

// ====== 授权码自动解码 ======
// 保存最近一次解码结果，关闭按钮使用此结果
let _lastDecodeResult = null;
let _decodeTimer = null;

// 渲染授权面板解码信息：有 user 即成功解码（有效绿色 / 过期红色），解析失败（无 user）隐藏
function _renderAuthStatusInfo(authResult) {
  const el = document.getElementById('auth-status-info');
  if (!el) return;
  if (!authResult || !authResult.user) { el.textContent = ''; el.style.display = 'none'; return; }
  const expired = !authResult.valid && Number(authResult.error_code) === _EC.EXPIRED;
  const isPermanent = authResult.expire_ts === 0;
  const isTrial = authResult.is_trial === true;
  const parts = [];
  parts.push('授权类型：' + (isTrial ? '试用' : '正式'));
  parts.push('授权给：' + (isTrial ? '试用用户' : authResult.user));
  if (expired) {
    parts.push('<span class="zen-expired">授权已过期</span>');
    el.style.color = 'var(--muted)';
  } else if (isTrial) {
    parts.push('剩余 ' + authResult.days_left + ' 天');
    el.style.color = '#fa0';
  } else if (isPermanent) {
    parts.push('有效期：永久');
    el.style.color = 'var(--buy)';
  } else {
    parts.push('剩余 ' + authResult.days_left + ' 天');
    el.style.color = 'var(--buy)';
  }
  el.innerHTML = parts.join('<span class="sep">|</span>');
  el.style.display = 'flex';
}

// 更新授权状态信息显示（授权给谁/剩余天数）
// 有 user 即已成功解码：有效正常显示，已过期时剩余天数位显示红色"授权已过期"；
// 解析失败（无 user）则隐藏
function _updateAuthStatusInfo(authResult) {
  _renderAuthStatusInfo(authResult);
}

function _decodeLicenseKey(showSaveMessage) {
  const key = document.getElementById('license-input').value.trim();
  const errorEl = document.getElementById('auth-error');

  if (!key) {
    _lastDecodeResult = null;
    errorEl.textContent = '';
    _updateAuthStatusInfo(null);
    return;
  }

  // 调用 license API 进行解码
  fetch(_apiUrl('/api/auth/license'), {
    method: 'POST',
    headers: _apiHeaders({ 'Content-Type': 'application/json' }),
    body: JSON.stringify({ license_key: key })
  })
  .then(function(r) {
    // 无论 HTTP 状态码如何，都尝试解析 JSON 响应体；
    // 只有 fetch 本身失败（网络不可达/超时）才进入 catch。
    return r.json().catch(function() { return null; }).then(function(data) {
      if (!r.ok && !data) {
        // HTTP 非 2xx 且无 JSON body（如 503 纯文本），才算认证模块不可用
        throw new Error('认证模块不可用');
      }
      return data || {};
    });
  })
  .then(data => {
    const ar = data && data.auth_result;
    // 解码出 user 即说明授权已成功解析（无论是否过期）；解析失败则无 user
    if (ar && ar.user) {
      if (ar.valid) {
        _lastDecodeResult = data;
        // 只有用户主动修改授权码时才显示"授权已保存"等后端消息
        errorEl.textContent = (showSaveMessage && data.message) ? data.message : '';
        errorEl.style.color = 'var(--buy)';
      } else {
        // 已过期：不改用成功流程，底部不再重复提示"授权已过期"
        _lastDecodeResult = null;
        errorEl.textContent = '';
      }
      _updateAuthStatusInfo(ar);
    } else {
      _lastDecodeResult = null;
      // 授权无效（解析失败等），显示错误信息
      var errMsg;
      if (ar && !ar.valid) {
        var ec = Number(ar.error_code) || 0;
        errMsg = _zenErrMsg(ec, ar.message);
      } else {
        errMsg = (data && data.message) || '解码失败';
      }
      errorEl.textContent = errMsg;
      errorEl.style.color = 'var(--sell)';
      _updateAuthStatusInfo(ar || null);
    }
  })
  .catch(err => {
    _lastDecodeResult = null;
    // 只有 fetch 本身失败（网络不可达/超时/连接被拒）才算网络错误；
    var isNetworkError = err && (err.name === 'TypeError' || /fetch|network|timeout/i.test(err.message || ''));
    errorEl.textContent = isNetworkError ? '网络错误' : (err.message || '请求失败');
    errorEl.style.color = 'var(--sell)';
    _updateAuthStatusInfo(null);
  });
}
