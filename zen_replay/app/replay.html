function parseTdxText(text) {
  if (!text || text.trim().length === 0) throw new Error('文件内容为空');
  const lines = text.split(/\r?\n|\r/);
  if (lines.length < 3) throw new Error('文件行数不足');
  
  // 解析股票基本信息（从标题行提取）
  let stockName = '';
  let stockCode = '';
  let periodType = '';
  
  try {
    if (lines.length > 0 && lines[0]) {
      const titleLine = lines[0];
      const titleStr = titleLine.trim();
      // 尝试解析 "股票名称 (股票代码)" 格式
      if (titleStr.includes('(') && titleStr.includes(')')) {
        const openParen = titleStr.lastIndexOf('(');
        const closeParen = titleStr.lastIndexOf(')');
        if (openParen < closeParen) {
          stockCode = titleStr.substring(openParen + 1, closeParen).trim();
          stockName = titleStr.substring(0, openParen).trim();
        }
      } else {
        stockName = titleStr;
      }
    }
  } catch (e) {
    console.warn('[parse] Failed to parse stock info from title line:', e.message);
  }
  
  const klines = [];

  // 从表头识别真实成交额列：仅当 成交量 列紧跟之后一列是 成交额 才算真实成交额。
  // 表头可能比数据行多出空列（如指数文件 999999：表头第2列空、成交额在表头 idx7 但数据 idx6），
  // 因此表头列索引不能直接当数据列索引用——成交额在数据行中始终是 成交量数据列 + 1。
  // 扫描所有行找 成交量 单元格（数据行无中文标签，不会误匹配），
  // 否则（如 TDX 多指标导出，紧跟成交量的是 ZEN.BI 等指标价格）不当作成交额，
  // 避免把指标价格误读为成交额导致 A: 显示错误。
  let hasAmtCol = false; // 是否识别到真实成交额列
  for (let i = 0; i < lines.length; i++) {
    const hd = (lines[i] || '').trim();
    if (!hd) continue;
    const hp = hd.split('\t');
    if (hp.length < 5) continue;
    for (let c = 0; c < hp.length; c++) {
      const hc = (hp[c] || '').trim().toLowerCase();
      if (hc.includes('成交量') || hc === '量') {
        const nx = (hp[c + 1] || '').trim().toLowerCase();
        if (nx.includes('成交额') || nx.includes('金额') || nx.includes('amount') || nx === '额') {
          hasAmtCol = true;
        }
        break; // 找到 成交量 列即可，其后是否成交额已判定
      }
    }
    if (hasAmtCol) break;
  }

  // 自动检测数据格式：日K 或 分钟K（两种分钟格式：日期\t时间 或 日期-时间 合并）
  let isMinuteData = null; // null=未确定, true=分钟级, false=日级
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i].replace(/\r$/, '');
    if (!line || line.trim().length === 0) continue;
    const parts = line.split('\t');
    if (parts.length < 5) continue;
    // 跳过表头等非数据行（开盘列非数字），不参与格式判定也不作为 K 线
    if (isNaN(parseFloat(parts[1])) || parts[1].trim() === '') continue;

    // 首次有效数据行决定数据格式
    if (isMinuteData === null) {
      // 通达信分钟数据检测：
      // 格式1: 日期\t时间\t开\t高\t低\t收...（第2列含":"）
      // 格式2: 日期-时间\t开\t高\t低\t收...（第1列含":"，如 2026/04/10-11:00）
      isMinuteData = (parts.length >= 6 && parts[1].trim().includes(':')) ||
                     (parts[0].trim().includes(':'));
    }

    let date, o, h, l, c, v = 0, a = 0;
    if (isMinuteData) {
      if (parts[1].trim().includes(':')) {
        // 格式1: 日期\t时间\t开\t高\t低\t收 [量] [额] (额可选)
        date = parts[0].trim() + ' ' + parts[1].trim();
        o = parseFloat(parts[2]);
        h = parseFloat(parts[3]);
        l = parseFloat(parts[4]);
        c = parseFloat(parts[5]);
        v = parseFloat(parts[6]) || 0;
        a = hasAmtCol ? (parseFloat(parts[7]) || 0) : 0;  // 成交额(可选，成交量数据列+1)
      } else {
        // 格式2: 日期-时间\t开\t高\t低\t收 [量] [额] (额可选)
        date = parts[0].trim();
        o = parseFloat(parts[1]);
        h = parseFloat(parts[2]);
        l = parseFloat(parts[3]);
        c = parseFloat(parts[4]);
        v = parseFloat(parts[5]) || 0;
        a = hasAmtCol ? (parseFloat(parts[6]) || 0) : 0;  // 成交额(可选，成交量数据列+1)
      }
      periodType = '分钟K线';
    } else {
      // 日级数据：日期 开 高 低 收 [量] [额]
      date = parts[0].trim();
      o = parseFloat(parts[1]);
      h = parseFloat(parts[2]);
      l = parseFloat(parts[3]);
      c = parseFloat(parts[4]);
      v = parseFloat(parts[5]) || 0;
      a = hasAmtCol ? (parseFloat(parts[6]) || 0) : 0;  // 成交额(元)，成交量数据列+1
      periodType = '日K线';
    }
    if (isNaN(o) || isNaN(h) || isNaN(l) || isNaN(c)) continue;
    if (h === 0 || l === 0) continue;
    klines.push({ d: date, o, h, l, c, v, a });
  }
  if (klines.length === 0) throw new Error('未解析到有效数据行');
  
  // 保存股票信息供外部使用
  window.zenStockInfo = {
    name: stockName || '未识别',
    code: stockCode || 'N/A',
    period: periodType || '未知周期'
  };
  
  return klines;
}

// 显示股票信息，带适当的分隔符和错误/截断处理
function updateStockInfoDisplay(stockInfo) {
  const stockEl = document.getElementById('stock-info');
  if (!stockEl) return;
  
  try {
    if (!stockInfo || (!stockInfo.name && !stockInfo.code && !stockInfo.period)) {
      // 没有股票信息时显示分隔符和提示
      stockEl.innerHTML = '<span style="color:var(--border)">|</span> 未能解析股票代码/周期';
      return;
    }
    
    // 格式化股票信息: 名称/代码/周期，用竖线分隔
    let stockName = (stockInfo.name || '未识别').trim();
    let stockCode = (stockInfo.code || 'N/A').trim();
    let period = (stockInfo.period || '未知').trim();
    
    // 截断过长信息（保留最多12字符）
    if (stockName.length > 12) {
      stockName = stockName.substring(0, 12) + '...';
    }
    if (stockCode.length > 10) {
      stockCode = stockCode.substring(0, 10) + '...';
    }
    if (period.length > 8) {
      period = period.substring(0, 8) + '...';
    }
    
    // 构建显示内容，用竖线分隔
    stockEl.innerHTML = 
      '<span style="color:var(--border)">|</span>' +
      ' ' + stockName + 
      '<span style="color:var(--border)"> | </span>' + stockCode +
      '<span style="color:var(--border)"> | </span>' + period;
      
  } catch (e) {
    console.error('[stock-info] Failed to update display:', e);
    stockEl.innerHTML = '<span style="color:var(--border)">|</span> <span style="color:var(--sell)">解析错误</span>';
  }
}

async function loadAndAnalyze(text, fileName) {
  resetTrades();
  allKlines = parseTdxText(text);
  _klineDataVersion++;
  _fullRangeCache = null;
  // 根据数据有无成交额/成交量，设置勾选框的 enable/disable 和默认勾选状态
  const hasVolData = allKlines.some(k => k.v > 0);
  const hasAmtData = allKlines.some(k => k.a > 0);
  const volEl = document.getElementById('L-vol');
  const amtEl = document.getElementById('L-amount');
  // disable 无数据的勾选框
  if (volEl) { volEl.disabled = !hasVolData; }
  if (amtEl) { amtEl.disabled = !hasAmtData; }
  // 默认勾选成交量（如有数据），否则勾选成交额（如有数据），都不行就都不选
  if (volEl && hasVolData) {
    volEl.checked = true; layers.vol = true;
    if (amtEl) { amtEl.checked = false; layers.amount = false; }
  } else if (amtEl && hasAmtData) {
    amtEl.checked = true; layers.amount = true;
    if (volEl) { volEl.checked = false; layers.vol = false; }
  } else {
    if (volEl) { volEl.checked = false; layers.vol = false; }
    if (amtEl) { amtEl.checked = false; layers.amount = false; }
  }
  const showVol = (layers.vol && hasVolData) || (layers.amount && hasAmtData);
  PAD_B = showVol ? 80 : 28;
  const n = allKlines.length;
  document.getElementById('data-info').textContent = fileName;
  document.getElementById('empty').style.display = 'none';
  
  // 显示股票信息相关的分隔符和内容
  updateStockInfoDisplay(window.zenStockInfo || {});

  rangeStart = 0; rangeEnd = n - 1; currentStep = 0;
  updateRangeSlider();
  await analyzeRange();
}

// ====== 坐标映射 ======
// xOf 中的 i 是 snapshots 中的局部索引（0-based），
// 但 allKlines 是全局的，需要偏移
function xOf(i) {
  if (currentMode === 'batch') return PAD_L + i * KW + KW / 2 - panOffset;
  return PAD_L + (i + rangeStart) * KW + KW / 2 - panOffset;
}

function getVisibleRange() {
const W = canvas.width / dpr;
const total = getTotalSteps() + 1;
if (currentMode === 'batch') {
const firstK = Math.max(0, Math.floor((panOffset - PAD_L) / KW));
const lastK = Math.min(total - 1, Math.ceil((panOffset + W - PAD_L - PAD_R) / KW));
return [Math.max(0, firstK), Math.max(0, lastK)];
}
const firstK = Math.max(0, Math.floor((panOffset - PAD_L) / KW) - rangeStart);
// streaming 模式下只显示到 currentStep，K 线逐根出现
const lastK = Math.min(currentStep, Math.ceil((panOffset + W - PAD_L - PAD_R) / KW) - rangeStart);
return [Math.max(0, firstK), Math.max(0, lastK)];
}

function autoScroll() {
const W = canvas.width / dpr;
const x = xOf(currentStep);
const base = currentMode === 'batch' ? 0 : rangeStart * KW;
if (x > W - PAD_R - KW * 2) {
panOffset = base + PAD_L + currentStep * KW + KW / 2 - (W - PAD_R - KW * 2);
} else if (x < PAD_L + KW * 2) {
panOffset = base + PAD_L + currentStep * KW + KW / 2 - KW * 8;
}
clampPan();
}

function clampPan() {
const W = canvas.width / dpr;
if (currentMode === 'batch') {
const contentW = (getTotalSteps() + 1) * KW;
const maxPan = Math.max(0, contentW - (W - PAD_L - PAD_R));
panOffset = Math.max(0, Math.min(maxPan, panOffset));
} else {
// streaming 模式下，内容宽度只到 currentStep
const contentW = (currentStep + 1) * KW;
const minPan = rangeStart * KW;
const maxPan = Math.max(minPan, minPan + contentW - (W - PAD_L - PAD_R));
panOffset = Math.max(minPan, Math.min(maxPan, panOffset));
}
}

// ====== 价格范围 ======
// 全量范围极值缓存：只依赖 rangeStart/rangeEnd/allKlines（播放期间不变），
// 避免每次重绘都全范围遍历。数据重载时通过版本号失效。
let _klineDataVersion = 0;
let _fullRangeCache = null; // { ver, start, end, min, max }
function getGMinMax() {
  let mn = Infinity, mx = -Infinity;
  // streaming 模式下只考虑已显示的 K 线（到 currentStep）
  const lastK = currentMode === 'batch' ? rangeEnd : Math.min(rangeEnd, rangeStart + currentStep);
  for (let i = rangeStart; i <= lastK && i < allKlines.length; i++) {
    const k = allKlines[i]; if (!k) continue;
    if (k.l < mn) mn = k.l; if (k.h > mx) mx = k.h;
  }
  // 只用当前快照的中枢价格范围（而非全部快照）
  const snap = getCurrentSnapshot();
  if (snap) {
    snap.pivots.forEach(p => { if (p.dd < mn) mn = p.dd; if (p.gg > mx) mx = p.gg; });
    snap.seg_pivots.forEach(p => { if (p.dd < mn) mn = p.dd; if (p.gg > mx) mx = p.gg; });
  }
  // 限制价格范围：当 K 线很少时，单根 K 线的振幅可能很大，
  // 导致整根 K 线撑满屏幕。用全量数据的振幅作为参考下限，
  // 确保早期阶段不会因为只有 1-2 根 K 线而过度放大。
  let c = _fullRangeCache;
  if (!c || c.ver !== _klineDataVersion || c.start !== rangeStart || c.end !== rangeEnd) {
    let fullMin = Infinity, fullMax = -Infinity;
    for (let i = rangeStart; i <= rangeEnd && i < allKlines.length; i++) {
      const k = allKlines[i]; if (!k) continue;
      if (k.l < fullMin) fullMin = k.l; if (k.h > fullMax) fullMax = k.h;
    }
    c = { ver: _klineDataVersion, start: rangeStart, end: rangeEnd, min: fullMin, max: fullMax };
    _fullRangeCache = c;
  }
  const fullMin = c.min, fullMax = c.max;
  const fullRange = fullMax - fullMin;
  if (fullRange > 0) {
    // 如果当前范围不到全量范围的 1/4，就以全量范围的 1/4 作为最小范围
    const curRange = mx - mn;
    const minRange = fullRange * 0.25;
    if (curRange < minRange) {
      const center = (mn + mx) / 2;
      mn = center - minRange / 2;
      mx = center + minRange / 2;
    }
  }
  const pad = (mx - mn) * 0.06;
  return [mn - pad, mx + pad];
}

// 可见范围价格极值：只统计当前屏幕内可见的 K 线，平移/缩放时坐标自适应。
// 缓存键为 (数据版本, 可见首尾)，播放推进/平移/缩放时按需重算。
let _visRangeCache = null; // { ver, vs, ve, min, max }
function getVisibleMinMax() {
  const [vs, ve] = getVisibleRange();
  if (ve < vs) return getGMinMax();
  let c = _visRangeCache;
  if (!c || c.ver !== _klineDataVersion || c.vs !== vs || c.ve !== ve) {
    let mn = Infinity, mx = -Infinity;
    for (let i = vs; i <= ve; i++) {
      const k = allKlines[rangeStart + i]; if (!k) continue;
      if (k.l < mn) mn = k.l; if (k.h > mx) mx = k.h;
    }
    if (!isFinite(mn)) return getGMinMax();
    // 与可见窗口有重叠的中枢：ZG/ZD 界线纳入范围，避免中枢框线被裁出画面
    const snap = getCurrentSnapshot();
    if (snap) {
      const inWin = (s, e) => e >= vs && s <= ve;
      snap.pivots.forEach(p => { if (inWin(p.s, p.e)) { if (p.zd < mn) mn = p.zd; if (p.zg > mx) mx = p.zg; } });
      snap.seg_pivots.forEach(p => { if (inWin(p.s, p.e)) { if (p.zd < mn) mn = p.zd; if (p.zg > mx) mx = p.zg; } });
    }
    // 可见 K 线过少时限制放大倍数：以全量振幅的 15% 为最小范围，
    // 防止缩放到只剩一两根 K 线时单根 K 线被拉得过长
    let fc = _fullRangeCache;
    if (!fc || fc.ver !== _klineDataVersion || fc.start !== rangeStart || fc.end !== rangeEnd) {
      getGMinMax(); // 副作用：刷新 _fullRangeCache
      fc = _fullRangeCache;
    }
    const fullRange = fc.max - fc.min;
    if (fullRange > 0) {
      const minRange = fullRange * 0.15;
      if (mx - mn < minRange) {
        const center = (mn + mx) / 2;
        mn = center - minRange / 2; mx = center + minRange / 2;
      }
    }
    c = { ver: _klineDataVersion, vs, ve, min: mn, max: mx };
    _visRangeCache = c;
  }
  const pad = (c.max - c.min) * 0.08;
  return [c.min - pad, c.max + pad];
}

// 格式化日期/时间标签
// 日级数据 "2025/04/01" → "04/01"
// 分钟级数据 "2025/04/01 09:35" → "04/01 09:35"
function fmtDate(s) {
  if (!s) return '';
  // 检测是否包含时间部分
  const spaceIdx = s.indexOf(' ');
  if (spaceIdx > 0) {
    // 分钟级数据：日期 + 时间
    const datePart = s.substring(0, spaceIdx);
    const timePart = s.substring(spaceIdx + 1);
    const dp = datePart.split('/');
    const dateStr = dp.length >= 3 ? dp[1] + '/' + dp[2] : datePart;
    return dateStr + ' ' + timePart;
  }
  // 日级数据
  const p = s.split('/');
  return p.length >= 3 ? p[1] + '/' + p[2] : s;
}

// ====== 绘制 ======
function draw() {
  if (!hasData()) return;
  const W = canvas.width / dpr;
  const H = canvas.height / dpr;
  ctx.clearRect(0, 0, W, H);

  const [visFirst, visLast] = getVisibleRange();
  const snap = getCurrentSnapshot();
  if (!snap) return;
  const klines = snap.klines;
  const [gMin, gMax] = getVisibleMinMax();
  const range = Math.max(gMax - gMin, 0.001);
  const yOf = (price) => PAD_T + (gMax - price) / range * (H - PAD_T - PAD_B);

  // Y 轴刻度（只画左右侧短线+数字，不画跨画面的浅灰横线，保持 replay 原生视觉风格）
  const nTicks = 8;
  // 选「优美步长」：1,2,2.5,5,10 × 10^n
  const rawStep = range / nTicks;
  const pow10 = Math.pow(10, Math.floor(Math.log10(rawStep)));
  const m = rawStep / pow10;
  let step = pow10;
  if (m < 1.5) step = pow10;
  else if (m < 3.5) step = 2 * pow10;
  else if (m < 7.5) step = 5 * pow10;
  else step = 10 * pow10;
  const digits = Math.max(0, -Math.floor(Math.log10(step)) + 1); // 小数位数
  ctx.lineWidth = 1;
  // 左轴：13px 数字 + 6px 刻度短线
  ctx.font = '13px monospace';
  for (let p = Math.ceil(gMin / step) * step; p <= gMax; p += step) {
    if (step === 0) break;
    const y = yOf(p);
    ctx.strokeStyle = 'rgba(139,148,158,0.55)';
    ctx.beginPath(); ctx.moveTo(PAD_L, y); ctx.lineTo(PAD_L - 6, y); ctx.stroke();
    ctx.fillStyle = '#a9b2bd';
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    let label = (digits > 0) ? p.toFixed(digits) : String(Math.round(p));
    if (Math.abs(p) >= 1000) label = String(Math.round(p));
    ctx.fillText(label, PAD_L - 10, y);
  }
  // 右轴：12px 辅助数字 + 4px 刻度短线
  ctx.font = '12px monospace';
  for (let p = Math.ceil(gMin / step) * step; p <= gMax; p += step) {
    if (step === 0) break;
    const y = yOf(p);
    ctx.strokeStyle = 'rgba(139,148,158,0.45)';
    ctx.beginPath(); ctx.moveTo(W - PAD_R, y); ctx.lineTo(W - PAD_R + 4, y); ctx.stroke();
    ctx.fillStyle = '#7b8490'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    let label = (digits > 0) ? p.toFixed(digits) : String(Math.round(p));
    if (Math.abs(p) >= 1000) label = String(Math.round(p));
    ctx.fillText(label, W - PAD_R + 8, y);
  }
  // 基线：仅在 0 价（K 线底部）画一条横托
  ctx.strokeStyle = 'rgba(139,148,158,0.40)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(PAD_L, H - PAD_B); ctx.lineTo(W - PAD_R, H - PAD_B); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(PAD_L, H - PAD_B); ctx.lineTo(W - PAD_R, H - PAD_B); ctx.stroke();

  // 裁剪到图表绘制区域，防止左移时 K 线等元素覆盖 Y 轴（纵向 0 轴）
  ctx.save();
  ctx.beginPath();
  ctx.rect(PAD_L, 0, W - PAD_L - PAD_R, H);
  ctx.clip();

  // K 线
  // 注意：layers.kline 开关控制缠论K（合并K线）vs 原始K线的显示模式
  //   - 开启时：用 merged_high/merged_low (k.mh/k.ml) 绘制合并后的缠论K线
  //   - 关闭时：用原始 high/low (k.h/k.l) 绘制 OHLC 红绿柱
  // 笔的端点价格由 Rust 核心库决定，与此处独立
  // 桌面版/安卓版使用 HQChart 框架原生 K 线绘制，不存在此问题
  if (layers.kline) {
    // 缠论K：显示合并后的 K 线，独立 K 线用实心柱，被合并的用虚线框
    for (let i = visFirst; i <= Math.min(visLast, klines.length - 1); i++) {
      const k = klines[i]; if (!k) continue;
      const x = xOf(i);
      const yMH = yOf(k.mh), yML = yOf(k.ml);
      if (k.ind) {
        // 独立 K 线：实心柱（用合并后的高低）
        ctx.fillStyle = '#26a69a';
        ctx.fillRect(x - BAR_W/2, yMH, BAR_W, Math.max(yML - yMH, 1));
      } else {
        // 被合并的 K 线：虚线框
        ctx.strokeStyle = 'rgba(110,118,129,0.5)'; ctx.lineWidth = 1; ctx.setLineDash([2, 2]);
        ctx.strokeRect(x - BAR_W/2, yMH, BAR_W, Math.max(yML - yMH, 1));
        ctx.setLineDash([]);
      }
    }
  } else {
    // 原始K：OHLC 实心红绿柱（必须使用 k.h/k.l 原始价格，不能用 k.mh/k.ml 合并价格）
    for (let i = visFirst; i <= Math.min(visLast, klines.length - 1); i++) {
      const k = klines[i]; if (!k) continue;
      const raw = allKlines[rangeStart + i]; if (!raw) continue;
      const x = xOf(i);
      const yH = yOf(k.h), yL = yOf(k.l);
      const yO = yOf(raw.o), yC = yOf(raw.c);
      const isUp = raw.c >= raw.o;
      const color = isUp ? '#26a69a' : '#ef5350';
      ctx.fillStyle = color;
      const bodyTop = Math.min(yO, yC);
      const bodyH = Math.max(Math.abs(yC - yO), 1);
      ctx.fillRect(x - BAR_W/2, bodyTop, BAR_W, bodyH);
      ctx.strokeStyle = color; ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(x, yH); ctx.lineTo(x, bodyTop);
      ctx.moveTo(x, bodyTop + bodyH); ctx.lineTo(x, yL);
      ctx.stroke();
    }

    // 缺口显示（仅原始K线模式，与通达信一致）
    // 缺口在被回补之前一直向右延伸，而非只画在两根K之间
    // 注意：必须使用 allKlines 的原始 OHLC，不能用 snap.klines 的 h/l（那是缠论合并后的值）
    const visEnd = Math.min(visLast, klines.length - 1);
    for (let i = Math.max(visFirst, 1); i <= visEnd; i++) {
      const prevRaw = allKlines[rangeStart + i - 1]; if (!prevRaw) continue;
      const curRaw = allKlines[rangeStart + i]; if (!curRaw) continue;
      const prevLow = prevRaw.l, prevHigh = prevRaw.h;
      const curLow = curRaw.l, curHigh = curRaw.h;

      let gapType = null, gapTop, gapBot;
      if (prevLow > curHigh) {
        // 向下缺口：缺口区间 [curHigh, prevLow]
        gapType = 'down'; gapTop = prevLow; gapBot = curHigh;
      } else if (prevHigh < curLow) {
        // 向上缺口：缺口区间 [prevHigh, curLow]
        gapType = 'up'; gapTop = curLow; gapBot = prevHigh;
      }
      if (!gapType) continue;

      // 从缺口位置向右扫描，检测缺口是否已被回补
      // 向下缺口 [gapBot, gapTop]：后续某根K的 high >= gapTop → 回补
      // 向上缺口 [gapBot, gapTop]：后续某根K的 low <= gapBot → 回补
      let closed = false;
      for (let j = i + 1; j <= visEnd; j++) {
        const k = allKlines[rangeStart + j]; if (!k) break;
        if (gapType === 'down' && k.h >= gapTop) { closed = true; break; }
        if (gapType === 'up' && k.l <= gapBot) { closed = true; break; }
      }
      // 已回补的缺口不再是缺口，跳过不画
      if (closed) { console.log('[GAP] K'+i+' '+gapType+' closed, skip'); continue; }
      console.log('[GAP] K'+i+' '+gapType+' ['+gapBot.toFixed(2)+','+gapTop.toFixed(2)+'] NOT closed, DRAWING x1='+xOf(i-1).toFixed(0)+' x2='+(W-PAD_R).toFixed(0));

      // 未回补的缺口：从缺口位置一直延伸到画面右侧
      const x1 = xOf(i - 1) + KW / 2;
      const x2 = W - PAD_R;
      const yTop = yOf(gapTop);
      const yBot = yOf(gapBot);
      const color = (gapType === 'down') ? [239, 83, 80] : [38, 166, 154];
      ctx.fillStyle = `rgba(${color[0]},${color[1]},${color[2]},0.12)`;
      ctx.fillRect(x1, yBot, x2 - x1, yTop - yBot);
      // 缺口边界虚线（上边和下边）
      ctx.strokeStyle = `rgba(${color[0]},${color[1]},${color[2]},0.4)`;
      ctx.lineWidth = 1; ctx.setLineDash([3, 2]);
      ctx.beginPath(); ctx.moveTo(x1, yTop); ctx.lineTo(x2, yTop); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x1, yBot); ctx.lineTo(x2, yBot); ctx.stroke();
      ctx.setLineDash([]);
    }
  }

  // 均线 (MA5/MA10/MA20/MA34/MA60)
  if (layers.ma) {
    const maPeriods = [5, 10, 20, 34, 60];
    const maColors = ['#e1e4e8', '#ffb74d', '#4fc3f7', '#ab47bc', '#66bb6a'];
    ctx.lineWidth = 1;
    for (let mi = 0; mi < maPeriods.length; mi++) {
      const period = maPeriods[mi];
      ctx.strokeStyle = maColors[mi];
      ctx.globalAlpha = 0.8;
      ctx.beginPath();
      let started = false;
      for (let i = visFirst; i <= Math.min(visLast, klines.length - 1); i++) {
        const globalIdx = rangeStart + i;
        if (globalIdx < period - 1) continue; // 不足 period 根，跳过
        // 计算收盘价均值
        let sum = 0;
        let valid = true;
        for (let j = 0; j < period; j++) {
          const k = allKlines[globalIdx - j];
          if (!k) { valid = false; break; }
          sum += k.c;
        }
        if (!valid) continue;
        const ma = sum / period;
        const x = xOf(i);
        const y = yOf(ma);
        if (!started) { ctx.moveTo(x, y); started = true; }
        else { ctx.lineTo(x, y); }
      }
      ctx.stroke();
    }
    ctx.globalAlpha = 1.0;
  }

  // 分型（最底层）
  if (layers.fractal) {
    ctx.font = '8px sans-serif';
    ctx.textAlign = 'center';
    snap.fractals.forEach(f => {
      const idx = f[0], dir = f[1], k = klines[idx];
      if (!k || idx < visFirst || idx > visLast) return;
      const x = xOf(idx);
      if (dir > 0) {
        const y = yOf(k.mh);
        ctx.fillStyle = '#ff9800'; ctx.beginPath(); ctx.arc(x, y, 3, 0, Math.PI*2); ctx.fill();
        ctx.textBaseline = 'bottom'; ctx.fillText('顶', x, y - 4);
      } else {
        const y = yOf(k.ml);
        ctx.fillStyle = '#2196f3'; ctx.beginPath(); ctx.arc(x, y, 3, 0, Math.PI*2); ctx.fill();
        ctx.textBaseline = 'top'; ctx.fillText('底', x, y + 4);
      }
    });
  }

  // 中枢 (笔=COLORMAGENTA, 线段=COLORYELLOW) — 先画中枢，再画笔/线段，确保笔/线段在上层可被点击
  if (layers.pivot) drawPivots(snap.pivots, xOf, yOf, '255,0,255', 1.5, visFirst, visLast);
  if (layers.segpivot) drawPivots(snap.seg_pivots, xOf, yOf, '255,255,0', 2.5, visFirst, visLast);
  // 价格标签收集器（带优先级和像素位置，绘制时按视觉位置去重）
  // 优先级：visMax/visMin=3 > 线段=2 > 笔=1
  // 数据结构：{ below: [{idx, x, y, label, color, priority}], above: [...] }
  const priceCollector = { below: [], above: [] };
  // 线段 (COLORYELLOW=#FFFF00) — 先画线段，优先级 2
  strokeHitCache = []; // 清空命中缓存
  if (layers.segment) drawStrokes(snap.segments, xOf, yOf, klines, '#FFFF00', 2.5, visFirst, visLast, false, null, 'segment', snap.segments);
  // 笔 (COLORMAGENTA=#FF00FF) — 后画笔，优先级 1
  if (layers.stroke) drawStrokes(snap.strokes, xOf, yOf, klines, '#FF00FF', 1.5, visFirst, visLast, layers.strokeprice, priceCollector, 'stroke', snap.strokes);
  // 走势背景
  if (layers.mv) {
    drawMovements(snap.movements, xOf, yOf, PAD_T, H - PAD_B, visFirst, visLast);
    drawMovements(snap.seg_movements, xOf, yOf, PAD_T, H - PAD_B, visFirst, visLast);
  }
  // 收集每根 K 线的信号标签，分下方（买侧）和上方（卖侧）堆叠显示，互不重叠
  const belowLabels = new Map(); // idx -> [{label, color}]
  const aboveLabels = new Map(); // idx -> [{label, color}]

  // 买卖点（通达信公式：买=COLORWHITE=#FFFFFF, 卖=COLORGREEN=#00AA00）
  if (layers.tp && snap && snap.tp) {
    const tpMap = new Map();
    snap.tp.forEach(t => tpMap.set(t.i + ':' + t.seg, t));
    tpMap.forEach(t => {
      if (t.i < visFirst || t.i > visLast) return;
      const isBuy = t.d > 0;
      const bStr = String(t.b);
      const label = (isBuy ? bStr + 'B' : bStr + 'S') + (t.seg ? '-XD' : '');
      const color = isBuy ? '#FFFFFF' : '#00AA00';
      const map = isBuy ? belowLabels : aboveLabels;
      if (!map.has(t.i)) map.set(t.i, []);
      map.get(t.i).push({ label, color });
    });
  }

  // 中枢背驰（底背驰=COLORWHITE下方, 顶背驰=COLORGREEN上方, 盘整背驰=COLORYELLOW）
  if (layers.div && snap && snap.divs) {
    snap.divs.forEach(d => {
      if (d.kind === 'macd') return; // MACD背离由 L-macd 单独控制
      if (d.i < visFirst || d.i > visLast) return;
      const isBottom = d.d > 0;
      const xdSuffix = d.seg ? '-XD' : '';
      let label, color;
      if (d.kind === 'consolidation') {
        label = '盘整背驰' + xdSuffix;
        if (d.s) label += '(' + d.s + ')';
        color = '#FFFF00';
      } else {
        label = (isBottom ? '底背驰' : '顶背驰') + xdSuffix;
        if (d.s) label += '(' + d.s + ')';
        color = isBottom ? '#FFFFFF' : '#00AA00';
      }
      const map = isBottom ? belowLabels : aboveLabels;
      if (!map.has(d.i)) map.set(d.i, []);
      map.get(d.i).push({ label, color });
    });
  }

  // MACD背离（底背=COLORWHITE下方, 顶背=COLORGREEN上方）
  if (layers.macd && snap && snap.divs) {
    snap.divs.forEach(d => {
      if (d.kind !== 'macd') return;
      if (d.i < visFirst || d.i > visLast) return;
      const isBottom = d.d > 0;
      let label = 'MACD' + (isBottom ? '底背' : '顶背');
      if (d.s) label += '(' + d.s + ')';
      const color = isBottom ? '#FFFFFF' : '#00AA00';
      const map = isBottom ? belowLabels : aboveLabels;
      if (!map.has(d.i)) map.set(d.i, []);
      map.get(d.i).push({ label, color });
    });
  }

  // 计算可见区域最高/最低价，优先级最高（3），覆盖同位置的笔/线段端点
  {
    let visMax = -Infinity, visMin = Infinity;
    let visMaxIdx = -1, visMinIdx = -1;
    for (let i = visFirst; i <= Math.min(visLast, klines.length - 1); i++) {
      const k = klines[i]; if (!k) continue;
      if (k.mh > visMax) { visMax = k.mh; visMaxIdx = i; }
      if (k.ml < visMin) { visMin = k.ml; visMinIdx = i; }
    }
    if (visMaxIdx >= 0) priceCollector.above.push({ idx: visMaxIdx, x: xOf(visMaxIdx), y: yOf(klines[visMaxIdx].mh), label: visMax.toFixed(2), color: '#26a69a', priority: 3 });
    if (visMinIdx >= 0) priceCollector.below.push({ idx: visMinIdx, x: xOf(visMinIdx), y: yOf(klines[visMinIdx].ml), label: visMin.toFixed(2), color: '#ef5350', priority: 3 });
  }

  // 按视觉位置去重：同方向（above/below）内，如果两个标签的 x 像素距离 <= 3px 且 y 像素距离 <= 12px，
  // 只保留优先级高的；优先级相同时保留先加入的（线段先于笔）
  function dedupByPosition(arr) {
    const result = [];
    for (const item of arr) {
      let dominated = false;
      for (let j = 0; j < result.length; j++) {
        const ex = result[j];
        if (Math.abs(ex.x - item.x) <= 3 && Math.abs(ex.y - item.y) <= 12) {
          // 位置重叠：保留优先级高的
          if (item.priority > ex.priority) {
            result[j] = item; // 替换为高优先级的
          }
          // 不管谁赢，当前 item 都被处理了（要么被丢弃，要么替换了已有的）
          dominated = true;
          break;
        }
      }
      if (!dominated) result.push(item);
    }
    return result;
  }
  priceCollector.below = dedupByPosition(priceCollector.below);
  priceCollector.above = dedupByPosition(priceCollector.above);

  // 把去重后的数组转为 Map<idx, {label, color}> 供堆叠绘制使用
  const priceBelowMap = new Map();
  priceCollector.below.forEach(p => { if (!priceBelowMap.has(p.idx)) priceBelowMap.set(p.idx, { label: p.label, color: p.color }); });
  const priceAboveMap = new Map();
  priceCollector.above.forEach(p => { if (!priceAboveMap.has(p.idx)) priceAboveMap.set(p.idx, { label: p.label, color: p.color }); });

  // 堆叠绘制：价格最靠近 K 线，然后是信号标签，无占位空行
  const STACK_GAP = 12;   // 每行间距（px）
  const STACK_START = 16; // 距 K 线高低点的起始偏移（textBaseline=middle，需 > 半个文字高度）
  // 合并所有需要堆叠的 idx（价格 + 信号）
  const allBelowIdx = new Set([...belowLabels.keys(), ...priceBelowMap.keys()]);
  const allAboveIdx = new Set([...aboveLabels.keys(), ...priceAboveMap.keys()]);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  allBelowIdx.forEach(idx => {
    const k = klines[idx]; if (!k) return;
    const x = xOf(idx);
    let y = yOf(k.ml) + STACK_START;
    // 价格标签放最前面（最靠近 K 线）
    const pl = priceBelowMap.get(idx);
    if (pl) { ctx.font = 'bold 10px monospace'; ctx.fillStyle = pl.color; ctx.fillText(pl.label, x, y); y += STACK_GAP; }
    // 信号标签
    const sigs = belowLabels.get(idx);
    if (sigs) { ctx.font = 'bold 9px sans-serif'; sigs.forEach(l => { ctx.fillStyle = l.color; ctx.fillText(l.label, x, y); y += STACK_GAP; }); }
  });
  allAboveIdx.forEach(idx => {
    const k = klines[idx]; if (!k) return;
    const x = xOf(idx);
    let y = yOf(k.mh) - STACK_START;
    const pl = priceAboveMap.get(idx);
    if (pl) { ctx.font = 'bold 10px monospace'; ctx.fillStyle = pl.color; ctx.fillText(pl.label, x, y); y -= STACK_GAP; }
    const sigs = aboveLabels.get(idx);
    if (sigs) { ctx.font = 'bold 9px sans-serif'; sigs.forEach(l => { ctx.fillStyle = l.color; ctx.fillText(l.label, x, y); y -= STACK_GAP; }); }
  });

  // 回测交易标记（买入：红色▲在K线下方信号堆叠之后，卖出：绿色▼在K线上方信号堆叠之后）
  tradeMarkers = [];
  if (trades.length > 0) {
    trades.forEach(t => {
      const localIdx = t.globalIdx - rangeStart;
      if (localIdx < visFirst || localIdx > visLast) return;
      const k = klines[localIdx];
      if (!k) return;
      const x = xOf(localIdx);
      const pctLabel = Math.round(t.pct * 100) + '%';
      if (t.type === 'buy') {
        const belowCnt = (belowLabels.get(localIdx) || []).length + (priceCollector.below.has(localIdx) ? 1 : 0);
        const y = yOf(k.ml) + STACK_START + belowCnt * STACK_GAP + 6;
        ctx.fillStyle = '#ff1744';
        ctx.beginPath();
        ctx.moveTo(x, y); ctx.lineTo(x - 5, y + 8); ctx.lineTo(x + 5, y + 8);
        ctx.closePath(); ctx.fill();
        ctx.font = 'bold 8px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
        ctx.fillText('买 ' + pctLabel, x, y + 10);
        tradeMarkers.push({ id: t.id, x, y: y + 4 });
      } else {
        const aboveCnt = (aboveLabels.get(localIdx) || []).length + (priceCollector.above.has(localIdx) ? 1 : 0);
        const y = yOf(k.mh) - STACK_START - aboveCnt * STACK_GAP - 6;
        ctx.fillStyle = '#00e676';
        ctx.beginPath();
        ctx.moveTo(x, y); ctx.lineTo(x - 5, y - 8); ctx.lineTo(x + 5, y - 8);
        ctx.closePath(); ctx.fill();
        ctx.font = 'bold 8px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
        ctx.fillText('卖 ' + pctLabel, x, y - 10);
        tradeMarkers.push({ id: t.id, x, y: y - 4 });
      }
    });
  }

  // 恢复裁剪区域，后续元素（指示线、X轴标签、十字架）不受限制
  ctx.restore();

  // 量能柱（底部，根据勾选成交额或成交量显示）
  // layers.amount 优先于 layers.vol（互斥关系已在UI层保证）
  const _volMode = layers.amount ? 'amount' : (layers.vol ? 'vol' : null);
  if (_volMode) {
  const _volField = _volMode === 'amount' ? 'a' : 'v';
  let _hasVol = false, _maxVol = 0;
  for (let i = visFirst; i <= Math.min(visLast, klines.length - 1); i++) {
    const raw = allKlines[rangeStart + i];
    if (raw && raw[_volField] > 0) { _hasVol = true; if (raw[_volField] > _maxVol) _maxVol = raw[_volField]; }
  }
  if (_hasVol && _maxVol > 0) {
    const volTop = H - PAD_B + 4, volBot = H - 6;
    ctx.strokeStyle = 'rgba(139,148,158,0.15)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(PAD_L, volTop - 4); ctx.lineTo(W - PAD_R, volTop - 4); ctx.stroke();
    ctx.fillStyle = '#8b949e'; ctx.font = '9px monospace'; ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
    ctx.fillText(_volMode === 'amount' ? 'AMT' : 'VOL', PAD_L + 2, volTop - 6);
    ctx.save();
    ctx.beginPath();
    ctx.rect(PAD_L, volTop - 2, W - PAD_L - PAD_R, volBot - volTop + 2);
    ctx.clip();
    for (let i = visFirst; i <= Math.min(visLast, klines.length - 1); i++) {
      const raw = allKlines[rangeStart + i]; if (!raw || !raw[_volField]) continue;
      const x = xOf(i);
      const up = raw.c >= raw.o;
      ctx.fillStyle = up ? 'rgba(38,166,154,0.75)' : 'rgba(239,83,80,0.75)';
      const bh = Math.max(Math.round(raw[_volField] / _maxVol * (volBot - volTop)), 1);
      ctx.fillRect(x - BAR_W/2, volBot - bh, Math.max(BAR_W, 1), bh);
    }
    ctx.restore();
  }
  }

  // 当前步指示线（仅在播放时显示）
  if (playing) {
    ctx.strokeStyle = '#f0883e'; ctx.lineWidth = 1.5; ctx.setLineDash([4, 3]);
    const cx = xOf(currentStep);
    if (cx >= PAD_L && cx <= W - PAD_R) {
      ctx.beginPath(); ctx.moveTo(cx, PAD_T); ctx.lineTo(cx, H - PAD_B); ctx.stroke();
    }
    ctx.setLineDash([]);
  }

  // X轴时间标签：每周一标注 + 最后一天标注
  if (allKlines.length > 0) {
    ctx.fillStyle = '#8b949e';
    ctx.font = '9px monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    const lastIdx = Math.min(visLast, allKlines.length - 1 - rangeStart);
    let lastLabelX = -Infinity; // 记录上一个已标注标签的x坐标，避免重叠
    for (let i = visFirst; i <= lastIdx; i++) {
      const k = allKlines[rangeStart + i];
      if (!k) continue;
      const x = xOf(i);
      if (x < PAD_L || x > W - PAD_R) continue;
      // 判断星期几
      const p = k.d.split('/');
      let weekday = -1;
      if (p.length >= 3) {
        const dt = new Date(parseInt(p[0]), parseInt(p[1]) - 1, parseInt(p[2]));
        weekday = dt.getDay(); // 0=周日, 1=周一, ..., 6=周六
      }
      const isMonday = (weekday === 1);
      const isLast = (i === lastIdx);
      // 规则：标注每周一 + 最后一天
      // 但最后一天如果是周一或周二且离上一个周一太近，则不重复标注
      if (!isMonday && !isLast) continue;
      if (isLast && !isMonday) {
        // 最后一天不是周一：周二离上周一太近不标，周三及以后才标
        if (weekday >= 1 && weekday <= 2) continue;
      }
      // 避免与上一个标签像素重叠
      if (x - lastLabelX < 35) continue;
      ctx.fillText(fmtDate(k.d), x, H - PAD_B + 4);
      lastLabelX = x;
    }
  }

  // 步数 + 日期 + 十字架价格信息显示在顶栏（合并到 k-info，避免单独 span 换行）
  const kInfoEl = document.getElementById('k-info');
  if (kInfoEl) {
    if (crosshair.active && crosshair.kIdx >= 0 && allKlines[crosshair.kIdx]) {
      const globalIdx = crosshair.kIdx;
      const k = allKlines[globalIdx];
      const localIdx = globalIdx - rangeStart;
      const ckK = snap && snap.klines ? snap.klines[localIdx] : null;
      if (layers.kline && ckK) {
        kInfoEl.textContent = 'K' + globalIdx + ' ' + k.d + ' | MH=' + ckK.mh.toFixed(2) + ' ML=' + ckK.ml.toFixed(2);
      } else {
        kInfoEl.textContent = 'K' + globalIdx + ' ' + k.d + ' | O=' + k.o.toFixed(2) + ' H=' + k.h.toFixed(2) + ' L=' + k.l.toFixed(2) + ' C=' + k.c.toFixed(2);
      }
    } else {
      kInfoEl.textContent = 'K' + (rangeStart + currentStep) + ' ' + (allKlines[rangeStart + currentStep] ? allKlines[rangeStart + currentStep].d : '');
    }
  }

  // 均线/量能数值显示（layers 行右侧 layer-info，均线分两行，量能放第二行末尾）
  const layerInfoEl = document.getElementById('layer-info');
  if (layerInfoEl) {
    const refIdx = crosshair.active && crosshair.kIdx >= 0 ? crosshair.kIdx : (rangeStart + currentStep);
    const maParts = [];
    if (layers.ma) {
      const maPeriods = [5, 10, 20, 34, 60];
      for (const p of maPeriods) {
        if (refIdx >= p - 1) {
          let sum = 0, valid = true;
          for (let j = 0; j < p; j++) {
            const k = allKlines[refIdx - j];
            if (!k) { valid = false; break; }
            sum += k.c;
          }
          if (valid) maParts.push(p + ':' + (sum / p).toFixed(2));
        }
      }
    }
    let volStr = '';
    if (layers.amount) {
      // 成交额(元)：≥1万亿显示"X.XX万亿"，≥1亿显示"X.XX亿"，≥1万显示"X.XX万"
      const k = allKlines[refIdx];
      if (k && k.a > 0) {
        const amt = k.a;
        if (amt >= 1e12) volStr = 'A:' + (amt / 1e12).toFixed(2) + '万亿';
        else if (amt >= 1e8) volStr = 'A:' + (amt / 1e8).toFixed(2) + '亿';
        else if (amt >= 1e4) volStr = 'A:' + (amt / 1e4).toFixed(2) + '万';
        else volStr = 'A:' + amt.toFixed(2) + '元';
      }
    } else if (layers.vol) {
      // 成交量(股→手)：÷100转手，≥1亿手显示"X.XX亿手"，≥1万手显示"X.XX万手"
      const k = allKlines[refIdx];
      if (k && k.v > 0) {
        const vol = k.v / 100;  // 股→手
        if (vol >= 100000000) volStr = 'V:' + (vol / 100000000).toFixed(2) + '亿手';
        else if (vol >= 10000) volStr = 'V:' + (vol / 10000).toFixed(2) + '万手';
        else volStr = 'V:' + vol.toFixed(0) + '手';
      }
    }
    // 第一行: MA5 MA10 MA20; 第二行: MA34 MA60 V:xx
    const line1 = maParts.slice(0, 3).join('  ');
    const line2Parts = maParts.slice(3);
    if (volStr) line2Parts.push(volStr);
    const line2 = line2Parts.join('  ');
    layerInfoEl.innerHTML = (line1 ? line1 : '') + (line1 && line2 ? '<br>' : '') + (line2 ? line2 : '');
  }

  // 十字架
  if (crosshair.active && crosshair.x >= 0 && crosshair.y >= 0) {
    ctx.strokeStyle = '#58a6ff88'; ctx.lineWidth = 1; ctx.setLineDash([3, 3]);
    ctx.beginPath();
    ctx.moveTo(crosshair.x, PAD_T); ctx.lineTo(crosshair.x, H - PAD_B);
    ctx.moveTo(PAD_L, crosshair.y); ctx.lineTo(W - PAD_R, crosshair.y);
    ctx.stroke();
    ctx.setLineDash([]);
    // 十字架交叉点小圆
    ctx.fillStyle = '#58a6ff';
    ctx.beginPath(); ctx.arc(crosshair.x, crosshair.y, 2, 0, Math.PI*2); ctx.fill();
  }
}

function drawPivots(pivots, xOf, yOf, rgb, borderW, vf, vl) {
  pivots.forEach(p => {
    if (p.e < vf || p.s > vl) return;
    const x1 = xOf(p.s), x2 = xOf(p.e);
    const yZG = yOf(p.zg), yZD = yOf(p.zd);
    ctx.fillStyle = 'rgba(' + rgb + ',0.3)';
    ctx.fillRect(x1, yZG, x2 - x1, yZD - yZG);
    ctx.strokeStyle = 'rgba(' + rgb + ',0.7)'; ctx.lineWidth = borderW;
    ctx.beginPath();
    ctx.moveTo(x1, yZG); ctx.lineTo(x2, yZG);
    ctx.moveTo(x1, yZD); ctx.lineTo(x2, yZD);
    ctx.moveTo(x1, yZG); ctx.lineTo(x1, yZD);
    ctx.moveTo(x2, yZG); ctx.lineTo(x2, yZD);
    ctx.stroke();
  });
}

function drawStrokes(strokes, xOf, yOf, klines, color, lw, vf, vl, showPrice, priceCollector, hitType, hitSource) {
  strokes.forEach((s, i) => {
    if (s.e < vf || s.s > vl) return;
    const k1 = klines[s.s], k2 = klines[s.e];
    if (!k1 || !k2) return;
    const x1 = xOf(s.s), x2 = xOf(s.e);
    const isUp = s.d > 0;
    // 使用 WASM 返回的笔高低点
    const y1 = isUp ? yOf(s.l) : yOf(s.h);
    const y2 = isUp ? yOf(s.h) : yOf(s.l);
    ctx.strokeStyle = color; ctx.lineWidth = lw;
    // 待定笔用虚线，确认笔和虚拟笔用实线
    if (s.st === 'pending') { ctx.setLineDash([4, 3]); } else { ctx.setLineDash([]); }
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    ctx.setLineDash([]);
    // 缓存命中检测数据
    if (hitType && hitSource) {
      strokeHitCache.push({ type: hitType, idx: i, x1, y1, x2, y2 });
    }
    // 标注端点价格（仅笔标注，线段端点即笔端点不重复标注）
    if (showPrice) {
      const price1 = isUp ? s.l : s.h;
      const price2 = isUp ? s.h : s.l;
      if (priceCollector) {
        // 收集价格标签（数组形式，附带优先级和像素位置）
        // 线段优先级=2，笔优先级=1
        const priority = (color === '#FFFF00') ? 2 : 1;
        // 起点：上涨笔在下方，下跌笔在上方
        const startArr = isUp ? priceCollector.below : priceCollector.above;
        startArr.push({ idx: s.s, x: x1, y: y1, label: price1.toFixed(2), color, priority });
        // 终点：上涨笔在上方，下跌笔在下方
        const endArr = isUp ? priceCollector.above : priceCollector.below;
        endArr.push({ idx: s.e, x: x2, y: y2, label: price2.toFixed(2), color, priority });
      } else {
        ctx.fillStyle = color; ctx.font = '9px monospace'; ctx.textAlign = 'center';
        // 起点价格：上涨笔在下方，下跌笔在上方
        ctx.textBaseline = isUp ? 'top' : 'bottom';
        ctx.fillText(price1.toFixed(2), x1, y1 + (isUp ? 4 : -4));
        // 终点价格：上涨笔在上方，下跌笔在下方
        ctx.textBaseline = isUp ? 'bottom' : 'top';
        ctx.fillText(price2.toFixed(2), x2, y2 + (isUp ? -4 : 4));
      }
    }
  });
}

function drawMovements(movements, xOf, yOf, top, bot, vf, vl) {
  movements.forEach(m => {
    if (m.e < vf || m.s > vl) return;
    const x1 = xOf(m.s), x2 = xOf(m.e);
    const colors = {1:'rgba(38,166,154,0.05)', '-1':'rgba(239,83,80,0.05)', 0:'rgba(255,193,7,0.03)'};
    ctx.fillStyle = colors[m.t] || colors[0];
    ctx.fillRect(x1, top, x2 - x1, bot - top);
    const label = m.t === 1 ? '↑' : m.t === -1 ? '↓' : '~';
    ctx.fillStyle = m.t === 1 ? '#26a69a' : m.t === -1 ? '#ef5350' : '#ffc107';
    ctx.font = 'bold 9px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    ctx.fillText(label + (m.pc > 0 ? '(' + m.pc + ')' : ''), (x1 + x2) / 2, top + 2);
  });
}

// ====== 统计 ======
function updateStats() {
  if (!hasData()) return;
  // 统计数字始终反映整个时间范围内的识别总量，不受 currentStep 影响
  // 逐根推送模式使用最后一个快照（包含全部累计数据），整体推送模式使用 batchFullSnap
  let s;
  if (currentMode === 'batch' && batchFullSnap) {
    s = batchFullSnap;
  } else if (snapshots.length > 0) {
    s = snapshots[snapshots.length - 1];
  } else {
    s = getCurrentSnapshot();
  }
  if (!s) return;
  document.getElementById('cur-step').textContent = currentStep;
  document.getElementById('total-steps').textContent = getTotalSteps();

  // 进度条：基于 snapshots 内部步数
  const total = getTotalSteps();
  const cp = total > 0 ? (currentStep / total) * 100 : 0;
  document.getElementById('pfill').style.width = cp + '%';
  document.getElementById('pcursor').style.left = cp + '%';
  // 范围标记基于 allKlines 全局索引
  const allTotal = allKlines.length - 1;
  const sp = allTotal > 0 ? (rangeStart / allTotal) * 100 : 0;
  const ep = allTotal > 0 ? (rangeEnd / allTotal) * 100 : 100;
  const pr = document.getElementById('prange');
  pr.style.left = sp + '%'; pr.style.width = (ep - sp) + '%';
  // 更新交易信息（浮动盈亏随当前价格变化）
  updateTradeInfo();
}

// ====== 范围滑块 ======
function updateRangeSlider() {
  const total = allKlines.length - 1;
  const sp = total > 0 ? (rangeStart / total) * 100 : 0;
  const ep = total > 0 ? (rangeEnd / total) * 100 : 100;
  document.getElementById('handle-start').style.left = sp + '%';
  document.getElementById('handle-end').style.left = ep + '%';
  document.getElementById('label-start').textContent = allKlines[rangeStart] ? allKlines[rangeStart].d : '--';
  document.getElementById('label-end').textContent = allKlines[rangeEnd] ? allKlines[rangeEnd].d : '--';
  const fill = document.getElementById('range-fill');
  fill.style.left = sp + '%';
  fill.style.width = (ep - sp) + '%';
}

let activeHandle = null;
const slider = document.getElementById('range-slider');

function handlePosFromEvent(e) {
  const rect = slider.querySelector('.range-track').getBoundingClientRect();
  const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
  return Math.round(pct * (allKlines.length - 1));
}

function onHandleStart(e, handle) {
  e.preventDefault();
  activeHandle = handle;
  document.getElementById('handle-' + handle).classList.add('active');
  document.body.style.cursor = 'grabbing';
}

function onHandleMove(e) {
  if (!activeHandle || allKlines.length === 0) return;
  const idx = handlePosFromEvent(e);
  if (activeHandle === 'start') rangeStart = Math.min(idx, rangeEnd);
  else rangeEnd = Math.max(idx, rangeStart);
  updateRangeSlider();
}

function onHandleEnd() {
  if (activeHandle) {
    document.getElementById('handle-start').classList.remove('active');
    document.getElementById('handle-end').classList.remove('active');
    activeHandle = null;
    document.body.style.cursor = '';
    // 范围改变后，从新起点重新分析
    analyzeRange();
  }
}

// 将 calculate_zen 的 WasmOutput 转换为 StreamSnapshot 格式
function convertWasmToSnapshot(wasmResult, count) {
  const statusStr = s => s === 1 ? 'confirmed' : s === 2 ? 'pending' : 'virtual';
  const klines = (wasmResult.klines || []).map(k => ({
    i: k.index, h: k.high, l: k.low,
    mh: k.merged_high, ml: k.merged_low, ind: k.is_independent
  }));
  const fractals = wasmResult.fractals || [];
  const strokes = (wasmResult.strokes || []).map(s => ({
    s: s.start_k, e: s.end_k, d: s.direction, h: s.high, l: s.low, st: statusStr(s.status)
  }));
  const segments = (wasmResult.segments || []).map(s => ({
    s: s.start_k, e: s.end_k, d: s.direction, h: s.high, l: s.low, st: statusStr(s.status)
  }));
  const convertPivot = p => ({
    s: p.start_k, e: p.end_k, zg: p.zg, zd: p.zd, gg: p.gg, dd: p.dd,
    ext: p.extended, lvl: p.level
  });
  const pivots = (wasmResult.stroke_pivots || []).map(convertPivot);
  const seg_pivots = (wasmResult.segment_pivots || []).map(convertPivot);
  // 转换买卖信号为 StreamTP 格式（跳过背驰信号）
  const tpMap = new Map();
  (wasmResult.trading_signals || []).forEach(sig => {
    if (sig.is_beichi || sig.category === 'macd') return;
    const absType = Math.abs(sig.signal_type);
    const seg = absType >= 100;
    const base = seg ? absType - 100 : absType;
    const key = sig.k_index + ':' + seg;
    tpMap.set(key, { i: sig.k_index, p: sig.price, b: base, d: sig.direction, seg });
  });
  const tp = Array.from(tpMap.values());
  // 转换背驰/背离信号为 divs 格式
  const divs = [];
  (wasmResult.trading_signals || []).forEach(sig => {
    if (!sig.is_beichi) return;
    const seg = sig.category === 'segment';
    let kind = 'trend';
    if (sig.text && sig.text.includes('盘整')) kind = 'consolidation';
    divs.push({ i: sig.k_index, p: sig.price, d: sig.direction, seg, kind, s: sig.strength || '' });
  });
  (wasmResult.macd_divergences || []).forEach(sig => {
    divs.push({ i: sig.k_index, p: sig.price, d: sig.direction, seg: false, kind: 'macd', s: sig.strength || '' });
  });
  return { step: count - 1, klines, fractals, strokes, segments, pivots, seg_pivots, tp, divs };
}

// 通用分析函数：根据 currentMode 选择整体推送或逐根推送模式
async function analyzeRange() {
  if (allKlines.length === 0 || !wasmReady || !wasmModule) return;

  async function refreshAttestation() {
    try {
      const nonce = Math.random().toString(36).substring(2) + Date.now().toString(36);
      const resp = await fetch(_apiUrl('/api/auth/session'), {
        method: 'POST',
        headers: _apiHeaders({ 'Content-Type': 'application/json' }),
        body: JSON.stringify({ nonce, app_id: 'tdx_zen', platform: 'replay' })
      });
      if (!resp.ok) {
        console.error('[replay] refreshAttestation: HTTP', resp.status);
        backendDown = false;  // 收到了 HTTP 响应，后台存活
        return false;
      }
      const data = await resp.json();
      if (data && data.success && data.attestation) {
        const ar = wasmModule.init_auth_attestation(data.attestation, nonce, 'tdx_zen', 'replay');
        if (ar && ar.valid) {
          backendDown = false;
          return true;
        }
        console.error('[replay] refreshAttestation: init_auth_attestation 返回 invalid', ar);
      } else {
        console.error('[replay] refreshAttestation: 服务器返回失败', data);
      }
    } catch (e) {
      // 网络错误：后台服务器已退出或网络不可用
      backendDown = true;
      console.error('[replay] refreshAttestation: 后台服务器不可达:', e.message);
      _setAuthBadge(navigator.onLine ? _EC.BACKEND_DOWN : _EC.NETWORK_UNAVAILABLE);
    }
    return false;
  }

  // 保存十字线状态，范围变更后尝试恢复
  const savedCrosshairActive = crosshair.active;
  const savedKIdx = crosshair.kIdx;
  // 重置十字线状态，避免阻塞拖拽
  crosshair.active = false;
  crosshair.x = -1; crosshair.y = -1; crosshair.kIdx = -1;

  snapshots = [];
  batchFullSnap = null;
  batchKlineCount = 0;
  const count = rangeEnd - rangeStart + 1;

  if (currentMode === 'batch') {
    // ===== 整体推送模式：使用 calculate_zen 走整体分析路径 =====
    wasmModule.set_processing_mode('batch');
    const highs = new Float32Array(count);
    const lows = new Float32Array(count);
    const opens = new Float32Array(count);
    const closes = new Float32Array(count);
    for (let i = 0; i < count; i++) {
      const ki = rangeStart + i;
      highs[i] = allKlines[ki].h;
      lows[i] = allKlines[ki].l;
      opens[i] = allKlines[ki].o;
      closes[i] = allKlines[ki].c;
    }
    let result = wasmModule.calculate_zen(highs, lows, opens, closes, null, tdxMode);
    if (!result) {
      if (await refreshAttestation()) {
        result = wasmModule.calculate_zen(highs, lows, opens, closes, null, tdxMode);
      }
    }
    if (!result) {
      if (backendDown) {
        _setAuthBadge(navigator.onLine ? _EC.BACKEND_DOWN : _EC.NETWORK_UNAVAILABLE);
      } else {
        _setAuthBadge(_EC.EXPIRED);
        _zenAutoShowAuthPanel();
      }
      return;
    }
    // calculate_zen 返回 JSON 字符串，需要解析为 JS 对象
    try {
      if (typeof result === 'string') result = JSON.parse(result);
    } catch (e) {
      console.error('整体推送分析结果 JSON 解析失败:', e);
      _setAuthBadge(_EC.NONE, '分析结果解析失败');
      return;
    }
    // 转换为 StreamSnapshot 格式并存储
    batchFullSnap = convertWasmToSnapshot(result, count);
    batchKlineCount = count;
    // 恢复默认处理模式
    wasmModule.set_processing_mode('streaming');
  } else {
    // ===== 逐根推送模式：使用 zen_stream_push 逐步推送 =====
    wasmModule.set_processing_mode('streaming');
    // 清理上一个分析会话的状态（防止切换数据文件时残留状态干扰）
    wasmModule.zen_stream_reset();
    let ok = wasmModule.zen_stream_init(tdxMode);
    if (!ok) {
      if (await refreshAttestation()) {
        ok = wasmModule.zen_stream_init(tdxMode);
      }
    }
    if (!ok) {
      if (backendDown) {
        _setAuthBadge(navigator.onLine ? _EC.BACKEND_DOWN : _EC.NETWORK_UNAVAILABLE);
      } else {
        _setAuthBadge(_EC.EXPIRED);
        _zenAutoShowAuthPanel();
      }
      return;
    }
    for (let i = 0; i < count; i++) {
      const ki = rangeStart + i;
      const snap = wasmModule.zen_stream_push(allKlines[ki].h, allKlines[ki].l, allKlines[ki].c);
      if (snap) {
        snapshots.push(snap);
      } else {
        // 尝试刷新令牌后重试一次
        if (await refreshAttestation()) {
          const snap2 = wasmModule.zen_stream_push(allKlines[ki].h, allKlines[ki].l, allKlines[ki].c);
          if (snap2) {
            snapshots.push(snap2);
            continue;
          }
        }
        if (backendDown) {
          _setAuthBadge(navigator.onLine ? _EC.BACKEND_DOWN : _EC.NETWORK_UNAVAILABLE);
        } else {
          _setAuthBadge(_EC.NONE); // AUTH_FAILED
          _zenAutoShowAuthPanel();
        }
        break;
      }
    }
  }

  // 整体推送模式直接跳到最后一步，展示全部结果；重置 panOffset 让数据从最左侧开始
  currentStep = currentMode === 'batch' ? getTotalSteps() : 0;
  panOffset = 0;
  clampPan();
  playing = false;
  setPlayIcon(true);
  if (hasData()) {
    resizeCanvas();
    updateStats();
    updateTradeButtons();
    // 恢复十字线：如果之前的 K 线索引仍在有效范围内，重新激活十字线
    if (savedCrosshairActive && savedKIdx >= rangeStart && savedKIdx <= rangeEnd) {
      const localIdx = savedKIdx - rangeStart;
      const restoreSnap = getCurrentSnapshot();
      if (restoreSnap && restoreSnap.klines && restoreSnap.klines[localIdx]) {
        crosshair.active = true;
        crosshair.kIdx = savedKIdx;
        crosshair.x = xOf(localIdx);
        // 用收盘价（或缠K最低价）作为 y 坐标
        const restoreK = allKlines[savedKIdx];
        const restoreCkK = restoreSnap.klines[localIdx];
        const [gMin, gMax] = getVisibleMinMax();
        const restoreRange = Math.max(gMax - gMin, 0.001);
        const H = canvas.height / dpr;
        const restorePrice = layers.kline ? restoreCkK.ml : restoreK.c;
        crosshair.y = PAD_T + (gMax - restorePrice) / restoreRange * (H - PAD_T - PAD_B);
      }
    }
    draw();
  }
}

document.getElementById('handle-start').addEventListener('mousedown', (e) => onHandleStart(e, 'start'));
document.getElementById('handle-end').addEventListener('mousedown', (e) => onHandleStart(e, 'end'));

document.getElementById('pbar').addEventListener('click', (e) => {
  if (!hasData()) return;
  const r = e.currentTarget.getBoundingClientRect();
  const pct = (e.clientX - r.left) / r.width;
  const step = Math.round(pct * getTotalSteps());

});

// ====== 播放 ======
function setPlayIcon(showPlay) {
  document.getElementById('btn-play').textContent = showPlay ? '▶' : '⏸';
}
function play() {
  // 如果已到末尾，从头开始播放；否则从当前位置继续播放
  if (currentStep >= getTotalSteps()) {
    currentStep = 0;
    panOffset = currentMode === 'batch' ? 0 : rangeStart * KW;
    clampPan();
  }
  playing = true;
  setPlayIcon(false);
  draw(); updateStats();
  scheduleNext();
}
function pause() {
  playing = false;
  setPlayIcon(true);
  if (playTimer) { clearTimeout(playTimer); playTimer = null; }
}
function scheduleNext() {
  if (!playing) return;
  playTimer = setTimeout(() => {
    if (currentStep < getTotalSteps()) {
      currentStep++;
      autoScroll(); draw(); updateStats();
      scheduleNext();
    } else pause();
  }, 1000 / speed);
}
function step(d) { pause(); currentStep = Math.max(0, Math.min(getTotalSteps(), currentStep + d)); autoScroll(); draw(); updateStats(); }
function seek(s) { pause(); currentStep = s; autoScroll(); draw(); updateStats(); }

document.getElementById('btn-play').addEventListener('click', () => playing ? pause() : play());
document.getElementById('btn-prev').addEventListener('click', () => step(-1));
document.getElementById('btn-next').addEventListener('click', () => step(1));
document.getElementById('btn-first').addEventListener('click', () => seek(0));
document.getElementById('btn-last').addEventListener('click', () => seek(getTotalSteps()));

document.getElementById('speed-preset').addEventListener('change', (e) => {
  // 显示值与实际速度映射：0.5x→2.5, 1x→5, 2x→10, 4x→20
  const labelToSpeed = { '0.5': 2.5, '1': 5, '2': 10, '4': 20 };
  speed = labelToSpeed[e.target.value] || 5;
  if (playing) { clearTimeout(playTimer); scheduleNext(); }
});

// ====== K线缩放 ======
// ZOOM_STEP: 单次缩放幅度（0.5 = 比 1 更平滑，对齐 apk 的细粒度缩放级别）
const ZOOM_STEP = 0.5;
function setZoom(newKW) {
    newKW = Math.max(1, Math.min(15, newKW));
    if (newKW === KW) return;
    // 优先使用十字线位置作为锚点；若十字线未激活，则使用当前步进位置
    // 这样即使没有激活十字线，缩放也会以当前 K 线位置为中心
    let anchorLocalIdx = null, anchorScreenX = null;
    // 十字线激活时，缩放后把十字线所在 K 平移到视口水平中心（对标 desktop 的 adjustZoomToCenter）
    const crosshairActive = (typeof crosshair !== 'undefined' && crosshair.active && crosshair.kIdx >= 0 && allKlines[crosshair.kIdx]);
    const centerKIdx = crosshairActive
        ? crosshair.kIdx
        : (rangeStart + currentStep);
    if (centerKIdx >= 0 && centerKIdx < allKlines.length) {
        anchorLocalIdx = currentMode === 'batch' ? centerKIdx : centerKIdx - rangeStart;
        if (anchorLocalIdx >= 0 && !crosshairActive) anchorScreenX = xOf(anchorLocalIdx); // 非十字线场景：保持原屏幕 x 位置
    }
    KW = newKW;
    BAR_W = Math.max(2, Math.round(KW * 2 / 3));
    document.getElementById('zoom-level').textContent = (KW % 1 === 0) ? KW : KW.toFixed(1);
    if (anchorLocalIdx != null && anchorLocalIdx >= 0) {
        if (crosshairActive) {
            // 十字线场景：把锚点 K 平移到视口水平中心，并同步更新十字线屏幕 x，
            // 使十字线（仍在同一根 K 上，kIdx 不变）也显示在中间
            const W = canvas.width / dpr;
            const centerX = PAD_L + (W - PAD_L - PAD_R) / 2;
            const base = currentMode === 'batch' ? 0 : rangeStart * KW;
            panOffset = base + PAD_L + anchorLocalIdx * KW + KW / 2 - centerX;
            clampPan();
            // clamp 后锚点 K 的实际 x 即十字线应处的位置
            crosshair.x = xOf(anchorLocalIdx);
        } else if (anchorScreenX != null && anchorScreenX >= 0) {
            // 非十字线场景：保持锚点 K 在原屏幕 x 位置
            const newX = xOf(anchorLocalIdx);
            panOffset += newX - anchorScreenX;
            clampPan();
        }
    } else {
        clampPan();
    }
    draw();
}
document.getElementById('btn-zoom-in').addEventListener('click', () => setZoom(KW + ZOOM_STEP));
document.getElementById('btn-zoom-out').addEventListener('click', () => setZoom(KW - ZOOM_STEP));

// ====== 模式切换 ======
document.querySelectorAll('input[name="analyze-mode"]').forEach(radio => {
  radio.addEventListener('change', async () => {
    if (!radio.checked) return;
    const newMode = radio.value;
    if (newMode === currentMode) return;
    // 保存切换前的位置，以便切换后恢复
    const savedStep = currentStep;
    const savedPanOffset = panOffset;
    const hadData = allKlines.length > 0;
    currentMode = newMode;
    _saveZenConfig();
    // 整体推送模式禁用播放控制按钮，逐根推送模式恢复
    if (currentMode === 'batch') {
      disablePlaybackControls();
    } else if (authValid) {
      enableControls();
    }
    if (allKlines.length > 0) {
      await analyzeRange();
      // 切换模式后恢复平移位置（两种模式都恢复）
      if (hadData) {
        if (currentMode === 'streaming' && snapshots.length > 0) {
          currentStep = Math.min(savedStep, snapshots.length - 1);
        }
        panOffset = savedPanOffset;
        clampPan();
        updateStats();
        draw();
      }
    }
  });
});

document.addEventListener('keydown', (e) => {
  if (!hasData()) return;
  switch(e.key) {
    case ' ': e.preventDefault(); playing ? pause() : play(); break;
    case 'ArrowLeft': e.preventDefault(); step(-1); break;
    case 'ArrowRight': e.preventDefault(); step(1); break;
    case 'ArrowUp': e.preventDefault(); setZoom(KW + ZOOM_STEP); break;
    case 'ArrowDown': e.preventDefault(); setZoom(KW - ZOOM_STEP); break;
    case '+': case '=': e.preventDefault(); setZoom(KW + ZOOM_STEP); break;
    case '-': case '_': e.preventDefault(); setZoom(KW - ZOOM_STEP); break;
  }
});

// ====== 十字架 ======
const crosshair = { active: false, x: -1, y: -1, kIdx: -1 };
// crosshair-info span removed; crosshair price info is now merged into k-info by draw()

// ====== 笔/线段编号显示 ======
const strokeInfoEl = document.getElementById('stroke-info');
const siLabelEl = document.getElementById('si-label');
const siNumEl = document.getElementById('si-num');

// 点到线段的最短距离
function distToSegment(px, py, x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1;
  const lenSq = dx * dx + dy * dy;
  if (lenSq === 0) return Math.hypot(px - x1, py - y1);
  let t = ((px - x1) * dx + (py - y1) * dy) / lenSq;
  t = Math.max(0, Math.min(1, t));
  const cx = x1 + t * dx, cy = y1 + t * dy;
  return Math.hypot(px - cx, py - cy);
}

// 双击：优先检测笔/线段命中，命中则显示编号；否则切换十字架
cvWrap.addEventListener('dblclick', (e) => {
  if (!hasData()) return;
  // 先检测是否双击在笔/线段上
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  let bestHit = null, bestDist = 8; // 8px 命中半径
  for (const h of strokeHitCache) {
    const d = distToSegment(mx, my, h.x1, h.y1, h.x2, h.y2);
    if (d < bestDist) { bestDist = d; bestHit = h; }
  }
  if (bestHit) {
    // 显示编号
    siLabelEl.textContent = bestHit.type === 'stroke' ? '笔 #' : '线段 #';
    siNumEl.textContent = bestHit.idx;
    strokeInfoEl.style.left = (mx + 10) + 'px';
    strokeInfoEl.style.top = (my - 20) + 'px';
    strokeInfoEl.style.display = 'block';
    return;
  }
  // 未命中笔/线段，走十字架逻辑
  crosshair.active = !crosshair.active;
  if (!crosshair.active) {
    crosshair.x = -1; crosshair.y = -1; crosshair.kIdx = -1;
    draw();
  } else {
    updateCrosshair(e);
  }
});

function updateCrosshair(e) {
  if (!crosshair.active || !hasData()) return;
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  const W = canvas.width / dpr;
  const H = canvas.height / dpr;
  // 计算当前最后一根可见 K 线的右边缘 x 坐标，限制十字线不超过最后一根 K
  // batch 模式: 最后一根是 rangeEnd；streaming 模式: 最后一根是 rangeStart + currentStep
  const lastVisGlobalIdx = currentMode === 'batch'
    ? Math.min(getTotalSteps(), rangeEnd)
    : Math.min(rangeEnd, rangeStart + currentStep);
  const lastVisLocalIdx = currentMode === 'batch' ? lastVisGlobalIdx : lastVisGlobalIdx - rangeStart;
  const lastKRightEdge = xOf(lastVisLocalIdx) + KW / 2;
  if (mx < PAD_L || mx > lastKRightEdge || my < PAD_T || my > H - PAD_B) {
    crosshair.x = -1; crosshair.y = -1; crosshair.kIdx = -1;
    draw();
    return;
  }
  crosshair.x = mx; crosshair.y = my;
  // 根据 x 坐标反算 K 线索引
  // batch 模式: xOf(i) = PAD_L + i * KW + KW/2 - panOffset, 反算得到 localIdx = rawIdx
  // streaming 模式: xOf(i) = PAD_L + (i + rangeStart) * KW + KW/2 - panOffset, 反算 rawIdx = i + rangeStart
  const rawIdx = Math.round((mx - PAD_L + panOffset - KW/2) / KW);
  const localIdx = currentMode === 'batch' ? rawIdx : rawIdx - rangeStart;
  const globalIdx = rangeStart + localIdx;
  if (globalIdx >= rangeStart && globalIdx <= lastVisGlobalIdx && allKlines[globalIdx]) {
    crosshair.kIdx = globalIdx;
  } else {
    crosshair.kIdx = -1;
  }
  // k-info 文本由 draw() 统一更新
  draw();
}

cvWrap.addEventListener('mousemove', (e) => {
  if (crosshair.active) updateCrosshair(e);
});

// ====== 鼠标拖拽平移 ======
let dragging = false, dragX = 0, dragPan = 0;
cvWrap.addEventListener('mousedown', (e) => {
  if (!hasData() || crosshair.active) return;
  dragging = true; dragX = e.clientX; dragPan = panOffset;
  cvWrap.classList.add('grabbing');
});
window.addEventListener('mousemove', (e) => {
  if (!dragging || !hasData()) return;
  panOffset = dragPan - (e.clientX - dragX);
  clampPan(); draw();
});
window.addEventListener('mouseup', () => { dragging = false; cvWrap.classList.remove('grabbing'); });

cvWrap.addEventListener('wheel', (e) => {
  if (!hasData()) return;
  e.preventDefault();
  if (e.ctrlKey) {
    // Ctrl+Wheel = zoom K-line width
    setZoom(KW + (e.deltaY > 0 ? -ZOOM_STEP : ZOOM_STEP));
  } else {
    // 优先用 deltaX（macOS trackpad 水平双指滑动），否则用 deltaY（鼠标滚轮/垂直滑动）
    const delta = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
    panOffset += delta > 0 ? KW * 5 : -KW * 5;
    clampPan(); draw();
  }
}, { passive: false });

// ====== 回测交易系统（百分比模式）======
const INITIAL_CAPITAL = 100000; // 内部虚拟资金，不展示
let trades = []; // { id, type:'buy'|'sell', pct, globalIdx, step, price, shares, date, cost }
let position = { shares: 0, totalCost: 0, avgCost: 0 };
let realizedPnL = 0;
let availableCash = INITIAL_CAPITAL;
let posPctAccum = 0; // 投入仓位：简单加减百分比（买加卖减），不通过股数×成本计算
let tradeIdCounter = 0;
let tradeMarkers = []; // 绘制时缓存标记位置，供点击检测
let strokeHitCache = []; // 缓存笔/线段线段坐标，供双击命中检测: { type, idx, x1, y1, x2, y2 }

function getCurrentPrice() {
  if (!hasData()) return 0;
  const globalIdx = rangeStart + currentStep;
  return allKlines[globalIdx] ? allKlines[globalIdx].c : 0;
}

function getPortfolioValue() {
  return availableCash + position.shares * getCurrentPrice();
}

function executeBuy(pct) {
  if (!hasData() || !authValid) return;
  const price = getCurrentPrice();
  if (price <= 0) return;
  if (posPctAccum + pct > 1.0) return; // 总仓位不能超过 100%（简单百分比加减，无需容差）
  // 买入金额 = 总资金的 pct，但不能超过可用资金（亏损后可用资金可能 < INITIAL_CAPITAL）
  const invest = Math.min(INITIAL_CAPITAL * pct, availableCash);
  if (invest < 1) return;
  const shares = Math.floor(invest / price);
  if (shares <= 0) return;
  const cost = shares * price;
  availableCash -= cost;
  position.totalCost += cost;
  position.shares += shares;
  position.avgCost = position.shares > 0 ? position.totalCost / position.shares : 0;
  const globalIdx = rangeStart + currentStep;
  const date = allKlines[globalIdx] ? allKlines[globalIdx].d : '';
  trades.push({ id: ++tradeIdCounter, type: 'buy', pct, globalIdx, step: currentStep, price, shares, date, cost });
  posPctAccum += pct;
  updateTradeInfo(); updateTradeButtons(); draw();
}

function executeSell(pct) {
  if (!hasData() || !authValid || position.shares <= 0) return;
  const price = getCurrentPrice();
  if (price <= 0) return;
  let shares;
  if (pct >= 1.0) {
    // 100% 卖出 = 清空全部持仓，不按 sellCost 计算
    shares = position.shares;
  } else {
    const sellCost = INITIAL_CAPITAL * pct; // 卖出目标 = 总资金的 pct（按成本计量）
    shares = position.avgCost > 0 ? Math.floor(sellCost / position.avgCost) : 0;
    shares = Math.min(shares, position.shares); // 安全兜底防止超卖
  }
  if (shares <= 0) return;
  const revenue = shares * price;
  realizedPnL += revenue - position.avgCost * shares;
  availableCash += revenue;
  position.shares -= shares;
  position.totalCost = position.shares > 0 ? position.avgCost * position.shares : 0;
  const globalIdx = rangeStart + currentStep;
  const date = allKlines[globalIdx] ? allKlines[globalIdx].d : '';
  trades.push({ id: ++tradeIdCounter, type: 'sell', pct, globalIdx, step: currentStep, price, shares, date });
  posPctAccum = Math.max(0, posPctAccum - pct);
  updateTradeInfo(); updateTradeButtons(); draw();
}

function executeClear() {
  if (position.shares <= 0) return;
  const price = getCurrentPrice();
  if (price <= 0) return;
  const shares = position.shares;
  const revenue = shares * price;
  realizedPnL += revenue - position.totalCost;
  availableCash += revenue;
  const globalIdx = rangeStart + currentStep;
  const date = allKlines[globalIdx] ? allKlines[globalIdx].d : '';
  const clearPct = posPctAccum;
  trades.push({ id: ++tradeIdCounter, type: 'sell', pct: clearPct, globalIdx, step: currentStep, price, shares, date });
  position.shares = 0; position.totalCost = 0; position.avgCost = 0;
  posPctAccum = 0;
  updateTradeInfo(); updateTradeButtons(); draw();
}

function deleteTrade(id) {
  const idx = trades.findIndex(t => t.id === id);
  if (idx < 0) return;
  trades.splice(idx, 1);
  recalcFromTrades();
  updateTradeInfo(); updateTradeButtons(); draw();
}

function recalcFromTrades() {
  position = { shares: 0, totalCost: 0, avgCost: 0 };
  realizedPnL = 0;
  availableCash = INITIAL_CAPITAL;
  posPctAccum = 0;
  for (const t of trades) {
    if (t.type === 'buy') {
      posPctAccum += t.pct;
      availableCash -= t.cost;
      position.totalCost += t.cost;
      position.shares += t.shares;
      position.avgCost = position.shares > 0 ? position.totalCost / position.shares : 0;
    } else {
      const revenue = t.price * t.shares;
      realizedPnL += revenue - position.avgCost * t.shares;
      availableCash += revenue;
      position.shares -= t.shares;
      position.totalCost = position.shares > 0 ? position.avgCost * position.shares : 0;
      posPctAccum = Math.max(0, posPctAccum - t.pct);
    }
  }
}

function executeResetTrades() {
  trades = [];
  position = { shares: 0, totalCost: 0, avgCost: 0 };
  realizedPnL = 0;
  availableCash = INITIAL_CAPITAL;
  posPctAccum = 0;
  updateTradeInfo(); updateTradeButtons(); draw();
}

function fmtPct(v) {
  return (v >= 0 ? '+' : '') + v.toFixed(2) + '%';
}

function updateTradeInfo() {
  const cur = getCurrentPrice();
  const posVal = position.shares * cur;
  const unrealized = posVal - position.totalCost;
  // 投入仓位 = 简单加减百分比（买加卖减），不通过股数×成本计算
  const posPct = posPctAccum * 100;
  const unrealizedPct = position.totalCost > 0 ? unrealized / position.totalCost * 100 : 0;
  const totalReturn = realizedPnL / INITIAL_CAPITAL * 100;
  document.getElementById('pos-pct').textContent = posPct.toFixed(0) + '%';
  const urEl = document.getElementById('pos-unrealized');
  urEl.textContent = fmtPct(unrealizedPct);
  urEl.className = unrealizedPct >= 0 ? 'profit' : 'loss';
  const tEl = document.getElementById('pos-total-return');
  tEl.textContent = fmtPct(totalReturn);
  tEl.className = totalReturn >= 0 ? 'profit' : 'loss';
}

function updateTradeButtons() {
  const enabled = hasData() && authValid;
  const posPct = posPctAccum; // 0~1
  // 买入：总仓位 + pct 不能超过 100%，且可用资金足够
  const buyTiers = [
    { id: 'btn-buy-25', pct: 0.25 },
    { id: 'btn-buy-50', pct: 0.50 },
    { id: 'btn-buy-100', pct: 1.00 }
  ];
  buyTiers.forEach(({ id, pct }) => {
    // 只要有可用资金就允许买入（executeBuy 内部会 cap invest 到 availableCash）
    document.getElementById(id).disabled = !enabled || posPct + pct > 1.0 || availableCash < 1;
  });
  // 卖出：pct 不能超过当前仓位（容差 0.02 容纳取整误差）
  const sellTiers = [
    { id: 'btn-sell-25', pct: 0.25 },
    { id: 'btn-sell-50', pct: 0.50 },
    { id: 'btn-sell-100', pct: 1.00 }
  ];
  sellTiers.forEach(({ id, pct }) => {
    document.getElementById(id).disabled = !enabled || pct > posPct;
  });
  document.getElementById('btn-clear').disabled = !enabled || position.shares <= 0;
  document.getElementById('btn-reset-trade').disabled = trades.length === 0;
}

function resetTrades() {
  trades = [];
  position = { shares: 0, totalCost: 0, avgCost: 0 };
  realizedPnL = 0;
  availableCash = INITIAL_CAPITAL;
  updateTradeInfo();
  updateTradeButtons();
}

// 按钮事件绑定
document.getElementById('btn-buy-25').addEventListener('click', () => executeBuy(0.25));
document.getElementById('btn-buy-50').addEventListener('click', () => executeBuy(0.50));
document.getElementById('btn-buy-100').addEventListener('click', () => executeBuy(1.00));
document.getElementById('btn-sell-25').addEventListener('click', () => executeSell(0.25));
document.getElementById('btn-sell-50').addEventListener('click', () => executeSell(0.50));
document.getElementById('btn-sell-100').addEventListener('click', () => executeSell(1.00));
document.getElementById('btn-clear').addEventListener('click', executeClear);
document.getElementById('btn-reset-trade').addEventListener('click', executeResetTrades);

// 键盘快捷键：1/2/3=买入25/50/100, Q/W/E=卖出25/50/100
document.addEventListener('keydown', (e) => {
  if (!hasData() || !authValid) return;
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  switch(e.key) {
    case '1': e.preventDefault(); executeBuy(0.25); break;
    case '2': e.preventDefault(); executeBuy(0.50); break;
    case '3': e.preventDefault(); executeBuy(1.00); break;
    case 'q': case 'Q': e.preventDefault(); executeSell(0.25); break;
    case 'w': case 'W': e.preventDefault(); executeSell(0.50); break;
    case 'e': case 'E': e.preventDefault(); executeSell(1.00); break;
  }
});

// 点击图表中的交易标记 → 弹出确认菜单
let pendingDeleteTradeId = null;
const ctxMenu = document.getElementById('trade-ctx-menu');
const canvasWrap = document.querySelector('.canvas-wrap');

canvas.addEventListener('click', (e) => {
  // 点击空白处关闭笔/线段编号显示
  strokeInfoEl.style.display = 'none';
  if (trades.length === 0 || tradeMarkers.length === 0) return;
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  for (const m of tradeMarkers) {
    const dx = mx - m.x, dy = my - m.y;
    if (dx*dx + dy*dy < 100) { // 10px radius hit area
      pendingDeleteTradeId = m.id;
      ctxMenu.style.left = m.x + 'px';
      ctxMenu.style.top = (m.y + 12) + 'px';
      ctxMenu.style.display = 'flex';
      return;
    }
  }
  // 点击空白处关闭菜单
  ctxMenu.style.display = 'none';
  pendingDeleteTradeId = null;
});

document.getElementById('trade-ctx-del').addEventListener('click', () => {
  if (pendingDeleteTradeId !== null) {
    deleteTrade(pendingDeleteTradeId);
    pendingDeleteTradeId = null;
  }
  ctxMenu.style.display = 'none';
});

document.getElementById('trade-ctx-cancel').addEventListener('click', () => {
  pendingDeleteTradeId = null;
  ctxMenu.style.display = 'none';
});

// 按 Esc 关闭菜单
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    pendingDeleteTradeId = null;
    ctxMenu.style.display = 'none';
  }
});

// ====== 初始化 ======
resizeCanvas();
initWasm();

// ====== 退出按钮 ======
document.getElementById('btn-close').addEventListener('click', async () => {
  // 通知后端关闭服务器
  try {
    await fetch(_apiUrl('/api/stop'), { method: 'POST', keepalive: true, headers: _apiHeaders() });
  } catch(e) { /* ignore */ }
  // 关闭当前页面
  setTimeout(() => {
    window.open('', '_self');
    window.close();
    setTimeout(() => { window.location.replace('about:blank'); }, 120);
  }, 200);
});

// ====== 缠论配置持久化 ======
function _saveZenConfig() {
  var cfg = {
    tdxMode: tdxMode,
    analyzeMode: currentMode,
    layers: {}
  };
  for (var k in layers) cfg.layers[k] = layers[k];
  try {
    fetch(_apiUrl('/api/zenconfig'), {
      method: 'POST',
      headers: _apiHeaders({ 'Content-Type': 'application/json' }),
      body: JSON.stringify({ zenConfig: cfg })
    }).catch(function(e) { console.log('[Zen] 保存配置失败:', e); });
  } catch(e) { console.log('[Zen] 保存配置异常:', e); }
}

function _loadZenConfig() {
  try {
    fetch(_apiUrl('/api/zenconfig'), { headers: _apiHeaders() })
      .then(function(r) { return r.json(); })
      .then(function(data) {
        var cfg = data && data.zenConfig;
        if (!cfg) return;
        var changed = false;
        // 恢复 tdxMode
        if (cfg.tdxMode !== undefined && cfg.tdxMode !== tdxMode) {
          tdxMode = cfg.tdxMode;
          modeInput.value = String(tdxMode);
          updateModeSwitches();
          changed = true;
        }
        // 恢复分析模式
        if (cfg.analyzeMode !== undefined && cfg.analyzeMode !== currentMode) {
          var radio = document.querySelector('input[name="analyze-mode"][value="' + cfg.analyzeMode + '"]');
          if (radio) { radio.checked = true; currentMode = cfg.analyzeMode; changed = true; }
        }
        // 恢复图层开关
        if (cfg.layers) {
          for (var k in cfg.layers) {
            var el = document.getElementById('L-' + k);
            if (el && el.checked !== cfg.layers[k]) {
              el.checked = cfg.layers[k];
              layers[k] = cfg.layers[k];
              changed = true;
            }
          }
        }
        console.log('[Zen] 加载配置:', JSON.stringify(cfg), 'changed=', changed);
        if (changed) draw();
      })
      .catch(function(e) { console.log('[Zen] 加载配置失败:', e); });
  } catch(e) { console.log('[Zen] 加载配置异常:', e); }
}

// 启动时加载持久化配置
_loadZenConfig();
</script>
