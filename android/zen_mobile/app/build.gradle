plugins {
    id 'com.android.application'
}

// Strip whitespace, CR, and surrounding quotes from env vars.
// .env.android values may arrive with quotes or \r on Windows batch builds.
def stripEnv = { String name ->
    def v = (System.getenv(name) ?: '').trim()
    if (v.length() >= 2 && v.startsWith('"') && v.endsWith('"')) {
        v = v.substring(1, v.length() - 1)
    }
    return v
}
def rawStoreFile = stripEnv('ZEN_ANDROID_STORE_FILE')
def releaseStoreFilePath = rawStoreFile.startsWith('~')
    ? System.getProperty('user.home') + rawStoreFile.substring(1)
    : rawStoreFile
def releaseStorePassword = stripEnv('ZEN_ANDROID_STORE_PASSWORD')
def releaseKeyAlias = stripEnv('ZEN_ANDROID_KEY_ALIAS')
def releaseKeyPassword = stripEnv('ZEN_ANDROID_KEY_PASSWORD')
def zenProfile = (findProperty('zenProfile') ?: System.getenv('ZEN_BUILD_PROFILE') ?: 'release').toString()
def hasReleaseSigning = releaseStoreFilePath &&
    releaseStorePassword &&
    releaseKeyAlias &&
    releaseKeyPassword &&
    file(releaseStoreFilePath).exists()

// 从 applications/VERSION 的 [ui] apk 读取 UI 版本号（与 desktop/replay 共用同一来源）
def uiVersionFile = file('../../../VERSION')
def uiVersion = '1.4.9'
if (uiVersionFile.exists()) {
    def line = uiVersionFile.readLines().find { it.trim().startsWith('apk') && it.contains('=') }
    if (line) {
        uiVersion = line.substring(line.indexOf('"') + 1, line.lastIndexOf('"'))
    }
}
def uiVersionCode = 20

android {
    namespace = 'com.zen.mobile'
    compileSdk 35

    buildFeatures {
        buildConfig = true
    }

    defaultConfig {
        applicationId 'com.zen.mobile'
        minSdk 24
        targetSdk 35
        versionCode uiVersionCode
        versionName "V${uiVersion}"

        // 当前 gomobile AAR 只生成 arm64-v8a，APK 也只声明这一种 ABI。
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    signingConfigs {
        debug {
            if (hasReleaseSigning) {
                storeFile file(releaseStoreFilePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            } else {
                storeFile file(System.getProperty('user.home') + '/.android/debug.keystore')
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseStoreFilePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // AGP 9.1 已内置 Kotlin 支持，且废弃了旧插件下的 kotlinOptions。
    // 如果需要深入配置，应改用新的 'kotlin' DSL 块，这里由于是简单 App，采用默认配置即可。

    packaging {
        jniLibs {
            // gomobile release output is stripped with -s -w; AGP cannot strip libgojni.so cleanly.
            keepDebugSymbols += ['**/libgojni.so']
        }
        resources {
            excludes += ['META-INF/AL2.0', 'META-INF/LGPL2.1']
            excludes += ['go/error.java']
        }
    }
}

gradle.taskGraph.whenReady { graph ->
    def releaseRequested = graph.allTasks.any { it.name.toLowerCase().contains('release') }
    if (releaseRequested) {
        if (!releaseStoreFilePath || releaseStoreFilePath.trim() == '') {
            throw new GradleException("ZEN_ANDROID_STORE_FILE is empty or not set.")
        }
        if (!file(releaseStoreFilePath).exists()) {
            throw new GradleException("Android keystore file not found: ${releaseStoreFilePath}")
        }
        if (!releaseStorePassword) {
            throw new GradleException("ZEN_ANDROID_STORE_PASSWORD is not set.")
        }
        if (!releaseKeyAlias) {
            throw new GradleException("ZEN_ANDROID_KEY_ALIAS is not set.")
        }
        if (!releaseKeyPassword) {
            throw new GradleException("ZEN_ANDROID_KEY_PASSWORD is not set.")
        }
        // Actual keystore and password validation is done by apksigner, not here
    }
}

// 使用 AGP 9.0+ 推荐的新 API 进行 APK 重命名 (兼容 Gradle 10)
androidComponents {
    onVariants(selector().all(), { variant ->
        variant.outputs.forEach { output ->
            def projectName = "zen_mobile_app"
            def date = new java.text.SimpleDateFormat("yyyyMMdd").format(new Date())
            output.outputFileName.set("${projectName}_${android.defaultConfig.versionName}_${date}.apk")
        }
    })
}

// 自动检测运行环境：
//   大仓库（zen_plugin）：android/zen_mobile/app → 4 级上是 zen_plugin，下面有 applications/
//   独立仓库：android/zen_mobile/app → 3 级上是项目根，直接有 dist/、HQChart/ 等
def candidateRoot = projectDir.toPath().resolve("../../../").normalize().toFile()
def isMonorepo = new File(candidateRoot, "applications").isDirectory()
def repoRootDir = isMonorepo ? new File(candidateRoot, "applications") : candidateRoot
def repoRelativePath = { File target ->
    repoRootDir.toPath().relativize(target.toPath()).toString().replace(File.separator, "/")
}

def aarDistPath = "${repoRootDir}/dist/aarch64-linux-android/${zenProfile}/zen_android_api.aar"

def syncedAssetEntries = [
    "zen_mobile.html",
    "zen_analysis_worker.js",
    "ZenLocalService.js",
    "StockData.js",
    "ZenHQChartCompat.js",
    "ZenChartDraw.js",
    "ZenStockSearch.js",
    "jscommon",
    "pkg",
    "LICENSE",
    "license_agreement.html",
    "license_agreement.js",
    "zen_error_codes.js",
]

def excludedJscommonEntries = [
    "umychart.testdata",
    "umychart.testdata.js",
    "umychart.NetworkFilterTest.js",
    "umychart.regressiontest.js",
]

tasks.register("syncZenAssets") {
    group = "zen"
    def sourceDir = new File(repoRootDir, "android/zen_mobile/frontend")
    def sharedJscommonDir = new File(repoRootDir, "HQChart/jscommon")
    def sharedCompatFile = new File(repoRootDir, "HQChart/ZenHQChartCompat.js")
    def sharedChartDrawFile = new File(repoRootDir, "HQChart/ZenChartDraw.js")
    def distCommonDir = new File(repoRootDir, "dist/common")
    def wasmDir = new File(repoRootDir, "dist/wasm32-unknown-unknown/${zenProfile}/pkg")
    def targetDir = new File(projectDir, "src/main/assets")
    def versionFile = new File(repoRootDir, "VERSION")

    // inputs 照旧声明（下游 mergeAssets 按内容哈希增量），但本任务永不判 UP-TO-DATE。
    // 原先用 build/zen/syncZenAssets.fingerprint 当 outputs 哨兵，并让 cleanupZenSyncedAssets
    // 与资源同生同死——实测（2026-10-24）这条判据不成立：Gradle 在构建结束时才给 outputs
    // 拍快照，而 cleanup 就在同一次构建里删掉了哨兵，于是快照永远记着"哨兵不存在"，
    // 下一轮 inputs 未变就判 syncZenAssets UP-TO-DATE、不再拷贝，成品 APK 只剩 3 个 asset
    // （html/wasm 全缺）而构建全程绿灯。
    // 现在每次构建都重拷约 20 个文件（秒级）；内容未变时 mergeAssets 及下游仍按内容哈希跳过，
    // 增量收益保住，只是"资源已清空 + 任务已完成"这个不自洽状态再无可能。
    inputs.property "zenProfile", zenProfile
    inputs.file new File(sourceDir, "zen_mobile.html")
    inputs.file new File(sourceDir, "zen_analysis_worker.js")
    inputs.file new File(sourceDir, "ZenLocalService.js")
    inputs.file new File(sourceDir, "StockData.js")
    inputs.file new File(sourceDir, "ZenStockSearch.js")
    inputs.file new File(sourceDir, "zen_version.js")
    inputs.file sharedCompatFile
    inputs.file sharedChartDrawFile
    inputs.dir sharedJscommonDir
    inputs.file new File(distCommonDir, "license_agreement.html")
    inputs.file new File(distCommonDir, "license_agreement.js")
    inputs.file new File(repoRootDir, "LICENSE.md")
    inputs.file new File(distCommonDir, "zen_error_codes.js")
    inputs.dir wasmDir
    inputs.file versionFile
    outputs.upToDateWhen { false }

    doLast {
        if (!targetDir.exists()) targetDir.mkdirs()

        // 从 android/zen_mobile/frontend 同步前端文件
        if (sourceDir.exists()) {
            println "[Zen] Syncing assets from: ${repoRelativePath(sourceDir)}"
            
            // 直接复制前端文件，避免 broken symlink 影响 lint / asset 打包
            ["zen_mobile.html", "zen_analysis_worker.js", "ZenLocalService.js", "StockData.js", "ZenStockSearch.js", "zen_version.js"].each { name ->
                def target = new File(targetDir, name)
                def source = new File(sourceDir, name)
                if (source.exists()) {
                    java.nio.file.Files.deleteIfExists(target.toPath())
                    def parentDir = target.parentFile
                    if (!parentDir.exists()) parentDir.mkdirs()
                    ant.copy(file: source.absolutePath, tofile: target.absolutePath, overwrite: true)

                    // 调试日志门：@ZEN_DEBUG@ 占位符按 zenProfile 替换（release=false / debug=true）。
                    // zen_mobile.html 用内联的 window.ZEN_DEBUG 判断，worker 没有内联门、靠 release
                    // 前置一段 console stub。两个都必须替换：html 漏替换恒为 false（只是没日志），
                    // worker 漏替换是语法错误（Worker 当场崩溃）—— 所以不存在"跳过替换"这一档。
                    if (name == "zen_mobile.html" || name == "zen_analysis_worker.js") {
                        def flag = zenProfile == "release" ? "false" : "true"
                        def content = target.text.replace("@ZEN_DEBUG@", flag)
                        if (zenProfile == "release" && name == "zen_analysis_worker.js") {
                            def stub = "self.console.log = function () { };\nself.console.info = function () { };\nself.console.debug = function () { };\nself.console.warn = function () { };\nself.console.error = function () { };\n"
                            content = stub + content
                        }
                        java.nio.file.Files.write(target.toPath(), content.getBytes())
                        println "[Zen] Replaced @ZEN_DEBUG@ -> ${flag} in ${name}"
                    }
                }
            }

            if (versionFile.exists()) {
                def versionTarget = new File(targetDir, "VERSION")
                java.nio.file.Files.deleteIfExists(versionTarget.toPath())
                ant.copy(file: versionFile.absolutePath, tofile: versionTarget.absolutePath, overwrite: true)
                println "[Zen] Synced applications/VERSION -> assets/VERSION"
            }

            // 同步 License 文件（html / js 都从 dist/common 取，与 desktop 共用同一来源）
            def licenseHtmlSource = new File(distCommonDir, "license_agreement.html")
            def licenseJsSource = new File(distCommonDir, "license_agreement.js")

            // 同步协议正文原文（Kotlin 侧 agreementHash() 读 assets/LICENSE 算 SHA-256，
            // 与 Rust 端口径一致：同一 LICENSE.md 字节 → 同一摘要，驱动协议变更重同意三态）
            def licenseMdSource = new File(repoRootDir, "LICENSE.md")
            if (licenseMdSource.exists()) {
                def target = new File(targetDir, "LICENSE")
                java.nio.file.Files.deleteIfExists(target.toPath())
                println "[Zen] Syncing LICENSE from: ${repoRelativePath(licenseMdSource)}"
                ant.copy(file: licenseMdSource.absolutePath, tofile: target.absolutePath, overwrite: true)
            } else {
                throw new RuntimeException("[Zen] Missing LICENSE.md at ${repoRelativePath(licenseMdSource)}.")
            }

            if (licenseHtmlSource.exists()) {
                def target = new File(targetDir, "license_agreement.html")
                java.nio.file.Files.deleteIfExists(target.toPath())
                println "[Zen] Syncing license_agreement.html from: ${repoRelativePath(licenseHtmlSource)}"
                ant.copy(file: licenseHtmlSource.absolutePath, tofile: target.absolutePath, overwrite: true)
            } else {
                throw new RuntimeException("[Zen] Missing license_agreement.html. Restore dist/common from the release package (see SETUP.md).")
            }

            if (licenseJsSource.exists()) {
                def target = new File(targetDir, "license_agreement.js")
                java.nio.file.Files.deleteIfExists(target.toPath())
                println "[Zen] Syncing license_agreement.js from: ${repoRelativePath(licenseJsSource)}"
                ant.copy(file: licenseJsSource.absolutePath, tofile: target.absolutePath, overwrite: true)
            } else {
                throw new RuntimeException("[Zen] Missing license_agreement.js at ${repoRelativePath(licenseJsSource)}.")
            }

            // 同步公共错误码 JS（从 dist/common 取，与 desktop/replay 共用同一来源）
            def errCodesJsSource = new File(distCommonDir, "zen_error_codes.js")
            if (errCodesJsSource.exists()) {
                def target = new File(targetDir, "zen_error_codes.js")
                java.nio.file.Files.deleteIfExists(target.toPath())
                println "[Zen] Syncing zen_error_codes.js from: ${repoRelativePath(errCodesJsSource)}"
                ant.copy(file: errCodesJsSource.absolutePath, tofile: target.absolutePath, overwrite: true)
            } else {
                throw new RuntimeException("[Zen] Missing zen_error_codes.js at ${repoRelativePath(errCodesJsSource)}.")
            }

        } else {
            throw new RuntimeException("[Zen] Frontend source directory not found: ${repoRelativePath(sourceDir)}")
        }

        if (sharedCompatFile.exists()) {
            def targetCompat = new File(targetDir, "ZenHQChartCompat.js")
            java.nio.file.Files.deleteIfExists(targetCompat.toPath())
            println "[Zen] Copying shared compat from: ${repoRelativePath(sharedCompatFile)}"
            ant.copy(file: sharedCompatFile.absolutePath, tofile: targetCompat.absolutePath, overwrite: true)
        } else {
            throw new RuntimeException("[Zen] Shared compat file not found: ${repoRelativePath(sharedCompatFile)}")
        }

        if (sharedChartDrawFile.exists()) {
            def targetChartDraw = new File(targetDir, "ZenChartDraw.js")
            java.nio.file.Files.deleteIfExists(targetChartDraw.toPath())
            println "[Zen] Copying shared chart draw from: ${repoRelativePath(sharedChartDrawFile)}"
            ant.copy(file: sharedChartDrawFile.absolutePath, tofile: targetChartDraw.absolutePath, overwrite: true)
        } else {
            throw new RuntimeException("[Zen] Shared chart draw file not found: ${repoRelativePath(sharedChartDrawFile)}")
        }

        // 复制共享 jscommon 目录（唯一来源：interfaces/zen_desktop/core/web/jscommon）
        if (sharedJscommonDir.exists()) {
            def targetJscommon = new File(targetDir, "jscommon")
            if (targetJscommon.exists()) targetJscommon.deleteDir()
            println "[Zen] Copying shared jscommon from: ${repoRelativePath(sharedJscommonDir)}"
            ant.copy(todir: targetJscommon.absolutePath) {
                fileset(dir: sharedJscommonDir.absolutePath)
            }
            excludedJscommonEntries.each { name ->
                def excluded = new File(targetJscommon, name)
                if (!excluded.exists() && !excluded.isDirectory()) return

                println "[Zen] Excluding jscommon test asset: jscommon/${name}"
                if (excluded.isDirectory()) excluded.deleteDir()
                else excluded.delete()
            }
        } else {
            throw new RuntimeException("[Zen] Shared jscommon directory not found: ${repoRelativePath(sharedJscommonDir)}")
        }

        // 复制 pkg 目录 (WASM)
        if (wasmDir.exists()) {
            def targetPkg = new File(targetDir, "pkg")
            if (targetPkg.exists()) targetPkg.deleteDir()
            println "[Zen] Copying pkg directory (WASM)"
            ant.copy(todir: targetPkg.absolutePath) {
                fileset(dir: wasmDir.absolutePath)
            }
        }

        println "[Zen] Assets sync completed"
    }
}

tasks.register("cleanupZenSyncedAssets") {
    group = "zen"
    def targetDir = file("${projectDir}/src/main/assets")

    doLast {
        if (!targetDir.exists()) return

        syncedAssetEntries.each { name ->
            def target = new File(targetDir, name)
            if (!target.exists() && !target.isDirectory()) return

            println "[Zen] Cleaning synced asset: ${repoRelativePath(target)}"
            if (target.isDirectory()) {
                target.deleteDir()
            } else {
                target.delete()
            }
        }

        def remaining = targetDir.listFiles()
        if (remaining == null || remaining.length == 0) {
            println "[Zen] Removing empty assets directory: ${repoRelativePath(targetDir)}"
            targetDir.deleteDir()
        }
    }
}

// 成品 APK 自检：直接读 zip 条目，确认前端页面与闭源 wasm 真的被封包里了。
// 这条判据存在的原因（2026-10-24 实测）：cleanupZenSyncedAssets 每次构建后清空
// src/main/assets，一旦 syncZenAssets 被跳过，mergeAssets 只是把空目录合并一遍，
// APK 里就只剩 3 个 tracked asset —— 页面根本无从加载，而 gradle 照旧 BUILD SUCCESSFUL。
// 判据落在 gradle 里而不是 build_android.{sh,bat}，是因为两份平台脚本要对这条检查
// 一字不差，而 cmd 侧列 zip 条目只能靠 jar/find 的文本解析。
tasks.register("verifyZenApkAssets") {
    group = "zen"
    def apkDir = file("${project.buildDir}/outputs/apk/${zenProfile}")
    def requiredEntries = [
        "assets/zen_mobile.html",
        "assets/pkg/tdx_zen_bg.wasm",
        "assets/pkg/tdx_zen.js",
    ]

    doLast {
        def apks = apkDir.isDirectory() ? apkDir.listFiles().findAll { it.name.endsWith(".apk") } : []
        if (apks == null || apks.isEmpty()) {
            throw new GradleException("[Zen] APK asset check failed: no APK under ${repoRelativePath(apkDir)}")
        }
        apks.each { apk ->
            def zip = new java.util.zip.ZipFile(apk)
            try {
                requiredEntries.each { name ->
                    if (zip.getEntry(name) == null) {
                        throw new GradleException(
                            "[Zen] APK asset check failed: ${name} missing from ${apk.name} " +
                            "-- syncZenAssets did not populate src/main/assets, the page cannot load.")
                    }
                }
            } finally {
                zip.close()
            }
        }
        println "[Zen] APK asset check: OK"
    }
}

afterEvaluate {
    // preBuild 是 assemble* 的上游，确保资源同步
    if (tasks.findByName('preBuild')) {
        tasks.named('preBuild').configure {
            dependsOn 'syncZenAssets'
        }
    }

    // 显式声明 assemble* 任务的依赖（比 preBuild 更可靠，直接命中构建命令）
    ['assemble', 'assembleDebug', 'assembleRelease', 'bundle', 'bundleDebug', 'bundleRelease'].each { taskName ->
        if (tasks.findByName(taskName)) {
            tasks.named(taskName).configure {
                dependsOn 'syncZenAssets'
            }
        }
    }

    // 构建完成后清理临时资源（仅在 syncZenAssets 确实执行后才清理）
    // 注意：不能依赖 finalizedBy，因为 assembleRelease 内部 task 执行顺序不确定
    // cleanup 改为手动在所有构建任务完成后调用，而不是自动追加到 assemble*
    tasks.configureEach { task ->
        if (task.name == 'packageRelease' || task.name == 'packageDebug') {
            task.finalizedBy 'verifyZenApkAssets'
            task.finalizedBy 'cleanupZenSyncedAssets'
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    // Reference the AAR directly from dist/. files() is lazy: the path is
    // resolved at execution time. The AAR ships pre-built in dist/ (see
    // SETUP.md) - this build never generates it.
    implementation files(aarDistPath)
}
